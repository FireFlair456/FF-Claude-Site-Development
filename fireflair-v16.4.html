function ProfileBuilder() {
  const { state, dispatch } = useStore();
  const p = state.profile;
  const me = meAsStaff(p, state.session);
  const cardReady = !!String(p.name || "").trim() && recsOf(p, "professions").some(r => !r.proposed);
  const signedIn = state.auth.status === "signedIn";
  const finished = signedIn && !!p.finishedAt;
  const toWelcome = () => setTimeout(() => {
    const el = document.getElementById("ff-sec-welcome");
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  }, 80);
  return (
    <div>
      <div className="ff-eyebrow">FF Team · Profile</div>

      <div className="ff-journey">
        <BigStepHead n={1} title="Join the Team" done={signedIn} />
        <TagSection />

        <StepHead n={2} title="Profile Card" done={cardReady} />
        <div id="ff-sec-card"><CardBuilder /></div>

        <StepHead n={3} title="FF AI & CV" done={hasCV(p)} />
        <ProfileFFAI />
        <CVPanel />

        <StepHead n={4} title="Your profile" done={false} />
        <ProfileSections person={me} isMe />
      </div>

      {/* Section 4 → Save & Share → Section 5, all in the same column */}
      <div className="ff-finale">
        <SaveShareCard onSaved={toWelcome} />
        <div className="ff-s5">
          {finished ? (<>
            <div id="ff-sec-welcome" style={{ display: "flex", gap: 12, alignItems: "center", margin: "28px 0 16px", scrollMarginTop: 80 }}>
              <span className="ff-stepnum" data-done="1" style={{ cursor: "default", boxShadow: "none" }}><Check size={14} /></span>
              <h1 className="ff-h1" style={{ margin: 0, minWidth: 0, fontSize: "clamp(20px, 5.6vw, 26px)" }}>Welcome to the Team</h1>
            </div>
            <PlayerCard person={me} format="full" themeKey={p.theme} />
            <div style={{ maxWidth: 372, margin: "14px auto 0" }}>
              <button type="button" className="ff-addff" onClick={() => window.dispatchEvent(new Event("ff-add"))} aria-label="Add FF — share your card">
                Add <AddFireFlairMark size={22} tone="var(--gold-lt)" />
              </button>
            </div>
          </>) : (
            <div className="ff-s5-closed" title="Section 5 opens when you save" aria-label="Section 5 — opens when you save">
              <span className="ff-stepnum closed" aria-hidden="true">05</span>
              <span className="stem" aria-hidden="true" />
              <span className="ff-vdashes" aria-hidden="true"><i /><i /><i /></span>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function TeamRouter() {
  const { state } = useStore();
  const { tab } = state;
  if (state.viewing) return <PersonProfile />;
  if (tab === "network") return <NetworkScreen />;
  if (tab === "bookings") return <TeamBookings />;
  if (tab === "profile") return <ProfilePage />;
  return <TeamHome />;
}

function StaffRouter() {
  const { state } = useStore();
  const { route, tab } = state;
  if (state.viewing) return <PersonProfile />;
  if (tab === "network") return <StaffRoster />;
  if (tab === "bookings") return <StaffBookings />;
  if (tab === "profile") return <StaffProfile />;
  if (route === "eventNew") return <EventNew />;
  if (route === "eventPage" || route === "shiftNew" || route === "shiftSend") return state.activeEventId ? <EventPage /> : <EventNew />;
  if (route === "companyEdit") return <CompanyEdit />;
  return <StaffHome />;
}

/* ==========================================================================
   ROOT — persistence via the `db` capability.
   Each viewer's own state (role, session, profile, connections, invitations,
   events, shifts, engagements, selection) lives under their private
   data/users/{self} subtree, so a reload or a later visit picks up where
   they left off. Demo directory/venues/services stay static — not persisted.
   ========================================================================== */

const PERSIST_KEYS = ["feedback", "profileQuestions", "auth", "role", "route", "tab", "session", "profile", "connections", "invitations", "reviews", "reviewRequests", "events", "shifts", "engagements", "selection", "categoryVisibility", "credits", "company", "activeEventId"];

function pickPersisted(state) {
  const out = {};
  PERSIST_KEYS.forEach(k => { out[k] = state[k]; });
  return out;
}

function FireFlair() {
  const [state, baseDispatch] = useReducer(reducer, initialState);
  const dbDocRef = useRef(null);
  const saveTimer = useRef(null);
  const hydratedRef = useRef(false);

  const dispatch = React.useCallback((action) => {
    baseDispatch(action);
  }, []);

  const store = useMemo(() => ({ state, dispatch }), [state, dispatch]);

  // Capture the FireFlair referral tag once, on load.
  useEffect(() => { dispatch({ type: "SESSION", patch: { refTag: INVITE_LINK_TAG } }); }, []);

  // Hydrate from db on mount.
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const db = await (window.claude && window.claude.use ? window.claude.use("db") : Promise.resolve(null));
        if (!db || cancelled) return;
        const ref = db.doc("fireflair/state");
        dbDocRef.current = ref;
        const snap = await ref.get();
        if (!cancelled && snap.exists) {
          const saved = snap.data() || {};
          /* Schema guard: discard a snapshot saved by an earlier build whose
             profile shape this version no longer understands, rather than
             hydrate into a broken state. */
          const stale = saved.profile && (!saved.profile.records || typeof saved.profile.xp === "undefined");
          if (stale) { hydratedRef.current = true; return; }
          const patch = {};
          PERSIST_KEYS.forEach(k => { if (saved[k] !== undefined) patch[k] = saved[k]; });
          /* Bookings saved before FF Staff 1.0 used multi-person shifts. Start
             those viewers on the new one-person Shift Card demo data instead. */
          if (Array.isArray(saved.shifts) && saved.shifts.length && !saved.shifts.some(x => x && "staffId" in x)) {
            delete patch.events; delete patch.shifts; delete patch.engagements;
            if (patch.route === "shiftNew" || patch.route === "shiftSend") patch.route = "staffHome";
          }
          /* The link you arrived on wins over one remembered from a visit before. */
          if (patch.session) patch.session = { ...patch.session, refTag: INVITE_LINK_TAG };
          if (patch.profile) {
            patch.profile = { ...patch.profile, records: { ...emptyRecords(), ...(patch.profile.records || {}) }, xp: patch.profile.xp || 0, media: patch.profile.media || [] };
            patch.profile = rollXPPeriodIfNeeded(patch.profile);
          }
          if (Object.keys(patch).length) dispatch({ type: "HYDRATE", patch });
        }
      } catch (e) {
        // No db available, or hydration failed — carry on with in-memory state.
      } finally {
        hydratedRef.current = true;
      }
    })();
    return () => { cancelled = true; };
  }, []);

  // Debounced save on every change, once hydration has had its chance to run.
  useEffect(() => {
    if (!dbDocRef.current) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      dbDocRef.current.set(pickPersisted(state)).catch(() => {});
    }, 500);
    return () => { if (saveTimer.current) clearTimeout(saveTimer.current); };
  }, [state]);

  return (
    <Store.Provider value={store}>
      <style>{CSS}</style>
      <div className="ff">
        <Shell>{state.viewing ? <PersonProfile /> : state.role === "team" ? <TeamRouter /> : state.role === "staff" ? <StaffRouter /> : <Landing />}</Shell>
      </div>
    </Store.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<FireFlair />);
</script>
</body>
</html>
