/* --- XP bar --------------------------------------------------------------

.ff-map { position:relative; border:1px solid var(--gold-dk); background:linear-gradient(168deg,#141416,#08080A); overflow:hidden; }

/* Minimal Leaflet layout rules (inlined; the page may only load Google Fonts stylesheets) */

.ff .ff-lpin>div{position:absolute;left:0;top:0;width:0;height:0}
.ff .ff-lpin>div>.ff-pin{left:0;top:0}
.ff .ff-llbl{pointer-events:none;width:0;height:0;overflow:visible}
.ff .ff-llbl span{position:absolute;transform:translate(-50%,-190%);font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:rgba(234,215,156,.8);text-shadow:0 0 4px #000,0 0 6px #000;white-space:nowrap}

.ff-hscroll {

.ff-tile {

}

.ff-addtile { border:1px dashed var(--gold-dk); background:transparent; display:grid; place-items:center; }

.ff-info { border:1px solid var(--rule); background:#fff; padding:12px; margin-bottom:8px; position:relative; }
.ff-pin span.lbl { position:absolute; left:50%; top:100%; transform:translateX(-50%); margin-top:3px; font-size:8px; letter-spacing:.1em; text-transform:uppercase; color:rgba(234,215,156,.75); white-space:nowrap; }

/* --- FF Staff 1.0 --------------------------------------------------------- */
.ff-locked { opacity:.92; }

  width:26px; height:26px; flex:none; display:grid; place-items:center; border:1px solid var(--gold-dk);
  font-family:var(--display); font-size:12px; color:var(--gold-dk); background:var(--paper); margin-top:1px;
}

/* Next steps — the FF coin's task list */

  .ff-topbar, .ff-bottomnav, .ff-basket, .ff-xpbar { display:none !important; }

}
/* --- Premium refresh: rounded geometry, soft surfaces, quiet depth ------- */
.ff { --r-sm:10px; --r:14px; --r-lg:20px; --r-xl:26px;
  --lift-1: 0 1px 2px rgba(28,20,6,.05), 0 6px 18px rgba(28,20,6,.06);
  --lift-2: 0 2px 6px rgba(28,20,6,.08), 0 18px 44px rgba(28,20,6,.14); }

  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%237E611D' stroke-width='1.6'/></svg>");
  background-repeat:no-repeat; background-position:right 16px center; }

.ff .ff-frame .ff-corner { display:none; }

.ff .ff-chip { border-radius:999px; padding:5px 12px; }

.ff .ff-addtile { border-radius:var(--r); }

.ff-panel { background:var(--paper); border:1px solid rgba(126,97,29,.18); border-radius:var(--r-lg); padding:18px; box-shadow:var(--lift-1); }

/* Tinted surfaces for the special steps */

.ff-substep { font-family:var(--sans); font-weight:700; font-size:14px; color:#16130F; margin:22px 0 10px; display:flex; gap:8px; align-items:center; }

/* Log out is quiet; Log in stays the red call to action */

/* SECTION 1 — Create your FF Tag. The account card, in FireFlair gold. */
.ff .ff-tagsection { position:relative; border-radius:var(--r-xl); padding:22px clamp(16px,4vw,28px); color:#241B07;
  background:linear-gradient(155deg,#FBF1CF 0%,#F1DB94 38%,#DEBC5E 76%,#C9A23A 100%); border:1px solid rgba(126,97,29,.45);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 2px 6px rgba(90,64,8,.14), 0 20px 44px rgba(120,88,16,.22); }

.ff .ff-linkbtn { color:#5C1220; font-weight:700; text-decoration:underline; text-underline-offset:2px; font-size:13px; padding:2px 0; }

/* FF Tag = a username: plain sans, lower case, with the address in front. */

.ff .ff-userfield { display:flex; align-items:center; background:#fff; border:1px solid rgba(126,97,29,.22); border-radius:var(--r);
  box-shadow: inset 0 1px 2px rgba(28,20,6,.04); transition: border-color .15s ease, box-shadow .15s ease; }
.ff .ff-tagsection .ff-userfield { border-color:rgba(90,64,8,.32); }

.ff .ff-userfield .pre { padding-left:15px; color:#8A8375; font-size:16px; white-space:nowrap; flex:none; }
.ff .ff-userfield input { flex:1; min-width:0; border:0; outline:none; background:transparent; padding:14px 6px 14px 1px; font-size:17px; font-weight:600; color:var(--ink); }
.ff .ff-userfield input::placeholder { color:#B3AB9C; font-weight:500; }
.ff .ff-userfield .st { flex:none; display:flex; padding-right:13px; }
.ff .ff-tagsection { padding:18px clamp(14px,4vw,24px); }
.ff .ff-tagsection .ff-field { margin-bottom:12px; }
.ff .ff-tagrow { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr)); gap:0 12px; }
/* CV: red until it's uploaded, then the same gradient, calmed right down. */
.ff .ff-cvdone { background:linear-gradient(160deg,#F4EFEA 0%,#E9E1D9 58%,#E0D6CC 100%); border:1px solid rgba(126,97,29,.24);
  border-radius:var(--r-lg); color:#2E2A24; box-shadow:var(--lift-1); }
/* Save & Share sits between Section 4 and Section 5, in the content column.
   Closed, Section 5 is its number with a line and three dashes running down. */

@media (max-width:520px){ .ff .ff-finale { padding-left:34px; } }
.ff .ff-s5 { margin:0 clamp(0px,4vw,40px); }
.ff .ff-s5-closed { display:flex; flex-direction:column; align-items:center; padding-top:18px; }
.ff .ff-stepnum.closed { cursor:default; opacity:.6; }
.ff .ff-s5-closed .stem { width:2px; height:22px; margin:6px 0 10px; border-radius:2px; background:linear-gradient(180deg, rgba(176,141,42,.6), rgba(176,141,42,.2)); }
.ff .ff-vdashes { display:flex; flex-direction:column; align-items:center; gap:11px; }
.ff .ff-vdashes i { display:block; width:12px; height:2px; border-radius:2px; background:var(--gold-mid); opacity:.7; }
.ff .ff-vdashes i:nth-child(2) { opacity:.5; } .ff .ff-vdashes i:nth-child(3) { opacity:.32; }
/* Profile photo: the big circle is the photo; the small one is the button */
.ff .ff-photobtn { position:relative; display:block; border-radius:50%; }
.ff .ff-photoadd { position:absolute; right:-4px; bottom:-2px; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; color:#0B0B0C;
  box-shadow:0 0 0 3px var(--paper), 0 4px 10px rgba(0,0,0,.28); transition:transform .15s ease; }

/* READABILITY — three tiers. Display type (Cinzel) keeps the FireFlair
   character in headings, the card plate and the name; everything a person
   has written about themselves is set in Inter, which stays legible small.
   Tier 1  names, professions, questions, answers   — biggest, darkest
   Tier 2  skills, interests, locations, languages,
           descriptions, card titles                 — medium, strong contrast
   Tier 3  labels, card types, XP, status            — small, never faint     */
.ff .ff-tagchip { font-family:var(--sans); font-size:13.5px; font-weight:500; line-height:1.25; padding:5px 10px; border-radius:999px;
  background:rgba(255,255,255,.62); border-color:rgba(126,97,29,.32); }
.ff .ff-deck:not(.lite) .ff-tagchip { background:rgba(255,255,255,.08); border-color:rgba(234,215,156,.32); }

.ff .ff-tagchip button { opacity:.55; }
.ff .ff-cardin { font-family:var(--sans); font-size:15px; padding:6px 0; }
.ff .ff-cardin::placeholder { opacity:.62; }
.ff .ff-cardin.name { font-family:var(--display); font-size:22px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; text-align:center; }
.ff .ff-cardin.name::placeholder { font-weight:500; opacity:.5; }

.ff .ff-pc-lbl { letter-spacing:.12em; font-weight:700; }
.ff .ff-pc-title { font-weight:700; letter-spacing:.14em; }
.ff .ff-pc-url { letter-spacing:.1em; }

/* Profession level picker: five compact boxes, the chosen one in black/gold */
.ff .ff-levels { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; }
.ff .ff-levels button { display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 2px 8px; min-width:0;
  border-radius:10px; border:1px solid rgba(126,97,29,.35); background:#fff; color:#2E2A24; }
.ff .ff-levels button:hover:not(.on) { border-color:var(--gold); background:#FFFDF6; }

.ff .ff-levels span { font-size:clamp(8.5px, 2.4vw, 10.5px); font-weight:600; color:#5C513F; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.ff .ff-levels button.on span { color:#EAD79C; }

/* Q&A — answered cards turn green and move right; a big tick pops when you answer */
.ff .ff-qdone { box-shadow: 0 0 0 2px #39C27E, 0 10px 26px rgba(8,58,34,.32) !important; }
.ff .ff-qbadge { position:absolute; top:7px; right:8px; z-index:5; width:26px; height:26px; border-radius:50%; display:grid; place-items:center;
  background:#34C27A; color:#fff; box-shadow:0 2px 8px rgba(0,0,0,.35), 0 0 0 2px rgba(255,255,255,.18); }
.ff .ff-qcelebrate { animation: ffqCard .7s cubic-bezier(.2,.9,.3,1.3) 1; }
.ff .ff-qburst { position:absolute; inset:0; z-index:6; display:grid; place-items:center; pointer-events:none;
  background:radial-gradient(circle at 50% 46%, rgba(52,194,122,.32), transparent 62%); animation: ffqFade 1.9s ease forwards; }
.ff .ff-qburst .ring { position:absolute; width:84px; height:84px; border-radius:50%; border:3px solid #6EE7A8; animation: ffqRing .9s ease-out .15s both; }
.ff .ff-qburst .disc { width:84px; height:84px; border-radius:50%; display:grid; place-items:center; background:#34C27A;
  box-shadow:0 8px 24px rgba(0,0,0,.4), inset 0 0 0 3px rgba(255,255,255,.25); animation: ffqPop .6s cubic-bezier(.2,.9,.3,1.4) both; }
.ff .ff-qburst .disc path { stroke-dasharray:40; stroke-dashoffset:40; animation: ffqDraw .45s ease-out .3s forwards; }
.ff .ff-qburst .spark { position:absolute; width:7px; height:7px; border-radius:50%; background:#F3DE9C; animation: ffqSpark .9s ease-out .2s both; }
@keyframes ffqCard { 0% { transform:scale(1) } 35% { transform:scale(1.05) } 100% { transform:scale(1) } }
@keyframes ffqPop { 0% { transform:scale(.3); opacity:0 } 60% { transform:scale(1.12); opacity:1 } 80% { transform:scale(.96) } 100% { transform:scale(1) } }
@keyframes ffqDraw { to { stroke-dashoffset:0 } }
@keyframes ffqRing { from { transform:scale(.7); opacity:.9 } to { transform:scale(2.2); opacity:0 } }
@keyframes ffqFade { 0%, 72% { opacity:1 } 100% { opacity:0 } }
@keyframes ffqSpark { from { transform:translate(0,0) scale(1); opacity:1 } to { transform:translate(var(--dx),var(--dy)) scale(.3); opacity:0 } }
.ff .ff-qa-sides { display:flex; justify-content:space-between; align-items:center; gap:10px; margin:0 0 8px; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }

.ff-wa { display:flex; gap:12px; align-items:center; padding:12px 14px; border-radius:14px; background:#E9F8EF; border:1px solid #9ED9B4; color:#0B3D22; margin-bottom:12px; }

.ff-poster.ivory { color:#2A0B12; background: linear-gradient(170deg,#FFFCF5,#F4ECDB); border-color:rgba(154,115,34,.55); }

.ff-poster-ribbon { align-self:flex-start; margin:-6px 0 0 -18px; padding:7px 16px 7px 14px; background:linear-gradient(90deg,#5C1220,#7A1B30); color:#F3DE9C;

.ff-poster-coin { position:absolute; top:14px; right:14px; }
.ff-poster-head { text-align:center; padding:16px 6px 14px; }
.ff-poster-eyebrow { font-size:11px; letter-spacing:.26em; text-transform:uppercase; color:var(--pc-accent); font-weight:600; }
.ff-poster-title { font-family:var(--display); font-weight:600; font-size:clamp(22px,5.4vw,28px); line-height:1.12; letter-spacing:.06em; margin:10px 0 6px; text-transform:uppercase; }

  background:linear-gradient(90deg,#4A0D18,#6E1829); color:#F6E7B4; }
.ff-poster-foot .ff-pill { background:rgba(255,255,255,.92); }
.ff .ff-poster-btn { display:inline-flex; align-items:center; gap:4px; padding:9px 14px; border-radius:12px; background:linear-gradient(170deg,#F6E4A6,#D8B34F);
  color:#3A0A14; font-weight:700; font-size:12px; letter-spacing:.06em; text-transform:uppercase; }
.ff-seg { display:inline-flex; border:1px solid rgba(126,97,29,.4); border-radius:12px; overflow:hidden; background:#fff; }

/* XP ladder — each rung names the tier metal it unlocks, so the reward badge
   is always drawn from the same Coin/FFEmblem art used everywhere else in
   the card system, never a separate gamification graphic. Extensible: add a
   rung here and the XP bar, profile badge and level-up state all follow. */
/* XP ladder. Bronze and Silver are fixed thresholds; Gold is NOT a number —
   it's awarded to the current quarter's top performers, so it can never be
   invented as a fixed XP figure. xpProgress() treats Gold as "reached" only
   when the caller says so (goldEligible), never from the xp value alone. */
const XP_LEVELS = [
  { tier: "bronze", xp: 100, label: "Bronze", unlocks: "First level of profile customisation" },
  { tier: "silver", xp: 500, label: "Silver", unlocks: "Additional profile customisation" },
  { tier: "gold",   xp: null, label: "Gold",   unlocks: "Premium profile customisation", earnedBy: "quarter-top-performers" },
];
const XP_NUMERIC_LEVELS = XP_LEVELS.filter(l => typeof l.xp === "number");

/* ==========================================================================
   XP PERIODS — professional quarterly structure.
   One generator, not months hand-written across the UI: give it a start
   quarter and a count, and it produces the sequence with each quarter's
   months derived from its number. Extending the beta into more quarters is
   a config change here, not a UI change.
   ========================================================================== */
const QUARTER_MONTHS = [
  ["January", "February", "March"], ["April", "May", "June"],
  ["July", "August", "September"], ["October", "November", "December"],
];

function quarterAfter(year, q) { return q === 4 ? { year: year + 1, q: 1 } : { year, q: q + 1 }; }
function quarterLabel(p) { return `${p.year} Q${p.q}`; }
function quarterMonths(p) { return QUARTER_MONTHS[p.q - 1]; }

function generateQuarters(startYear, startQ, count) {
  const out = [];
  let cur = { year: startYear, q: startQ };
  for (let i = 0; i < count; i++) { out.push(cur); cur = quarterAfter(cur.year, cur.q); }
  return out;
}

/* The single source of truth for "what quarter is it": change these two
   numbers and the whole XP Beta timeline, labels and reset behaviour move
   with it — nothing else in the app hardcodes a quarter. */
const XP_BETA_START = { year: 2026, q: 4 };
const XP_CURRENT_PERIOD = { year: 2026, q: 4 };
const XP_TIMELINE = generateQuarters(XP_BETA_START.year, XP_BETA_START.q, 5);
const xpPeriodKey = (p) => `${p.year}Q${p.q}`;

function xpProgress(xp) {
  const cur = xp || 0;
  const next = XP_NUMERIC_LEVELS.find(l => cur < l.xp);
  const prevXp = (() => {
    const i = next ? XP_NUMERIC_LEVELS.indexOf(next) : XP_NUMERIC_LEVELS.length;
    return i > 0 ? XP_NUMERIC_LEVELS[i - 1].xp : 0;
  })();
  const reached = XP_NUMERIC_LEVELS.filter(l => cur >= l.xp);
  const currentTier = reached.length ? reached[reached.length - 1].tier : "standard";
  if (!next) return { xp: cur, next: null, pct: 100, currentTier, prevXp, nextXp: cur || 1 };
  const span = next.xp - prevXp;
  const pct = span > 0 ? Math.min(100, Math.max(0, ((cur - prevXp) / span) * 100)) : 0;
  return { xp: cur, next, pct, currentTier, prevXp, nextXp: next.xp };
}

   will use it to pair Masters with Apprentices for training and mentorship. */
const PROFESSION_LEVELS = [
  { n: 1, title: "Apprentice" },

  { n: 3, title: "Professional" },
  { n: 4, title: "Expert" },

/* Merge built-in categories with any the user has added at runtime. */
const allCategories = (profile) => ({ ...BASE_CATEGORIES, ...(profile.categories || {}) });
const categoryDef = (profile, key) => allCategories(profile)[key] || { label: key, singular: key, icon: "skills", fields: ["description", "media"] };

const makeRecord = (category, name, extra = {}) => ({
  id: uid("rec"),
  category,
  name: String(name || "").trim(),
  description: "",
  media: [],          // [{ id, name, dataUrl }]
  document: null,     // { name, size, type, dataUrl }
  proficiency: "",
  primary: false,
  proposed: false,    // true while awaiting user review (CV adapter)
  source: { origin: "manual", location: null, confidence: "confirmed" },
  ...extra,
});

const recsOf = (profile, cat) => (profile.records && profile.records[cat]) || [];

/* PROFILE FIRST. The profile holds everything the person has told
   FireFlair; the Profile Card shows the first cards in each attribute, in
   the order the person arranges them left to right. Hidden cards stay on
   the private profile but never take a place. Positions map to rank:
   1 = primary, 2-3 = secondary, 4+ = tertiary (profile only). */
const FEATURE_LIMIT = 3;
const cardRank = (i) => i === 0 ? "primary" : i < FEATURE_LIMIT ? "secondary" : "tertiary";
const visibleRecs = (profile, cat) => recsOf(profile, cat).filter(r => !r.proposed && !r.hidden);
function primaryNames(profile, cat, limit) {
  return visibleRecs(profile, cat).slice(0, Math.min(limit, FEATURE_LIMIT)).map(r => r.name).filter(Boolean);
}
const featuredCount = (profile, cat) => Math.min(FEATURE_LIMIT, visibleRecs(profile, cat).length);

const emptyRecords = () => Object.keys(BASE_CATEGORIES).reduce((m, k) => { m[k] = []; return m; }, {});

/* Read-only records synthesised for directory people, so that opening
   someone else's profile uses the same Information Card components. */
/* Reviews written ABOUT a person, newest first, shaped as records so they
   render through the same Information Card as everything else. */
function reviewRecordsFor(state, personId) {
  return (state.reviews || [])
    .filter(r => r.aboutId === personId)
    .sort((a, b) => b.at - a.at)
    .map(r => ({
      ...makeRecord("reviews", `${r.rating}★ from ${r.byName}`),
      id: r.id, description: r.text, rating: r.rating, primary: true, readOnly: true,
    }));
}

function recordsForPerson(state, person) {
  if (person.id === "me") return { ...state.profile.records, reviews: reviewRecordsFor(state, "me") };
  const mk = (cat, arr) => (arr || []).filter(Boolean).map(n => ({
    ...makeRecord(cat, n), id: `${person.id}_${cat}_${String(n).replace(/\W+/g, "")}`,
    primary: true, readOnly: true,
  }));
  return {
    professions: mk("professions", [person.profession]),
    skills: mk("skills", person.skills),
    interests: mk("interests", person.interests),
    locations: mk("locations", person.locations),
    languages: mk("languages", person.languages),
    qualifications: [], reviews: reviewRecordsFor(state, person.id), experience: [],
  };
}

function byMonth(items) {
  const groups = {};
  [...items].sort((a, b) => String(a.iso || "9").localeCompare(String(b.iso || "9")))
    .forEach(i => { const k = monthKey(i.iso); (groups[k] = groups[k] || []).push(i); });
  return Object.entries(groups);
}

    /* Quarterly XP: xpPeriod is the CURRENT quarter's running total — what
       resets. xpPeriodKey remembers which quarter that total belongs to, so
       a new quarter is detected automatically. xpHistory archives every
       past quarter's final total; nothing here ever deletes xp/xpLog, the
       all-time record. */
    xpPeriod: 0, xpPeriodKey: xpPeriodKey(XP_CURRENT_PERIOD), xpHistory: [],
    records: emptyRecords(), categories: {}, extraction: null, aiQuestions: [],
  },
  /* Feedback Question Card answers — product research, not profile data. */
  feedback: {},
  connections: [], invitations: [], reviews: [], reviewRequests: [],
  /* Questions visitors ask on a profile ("Ask a question") — one Question
     Card each, tied to that person: { id, personId, text, askedAt, by, answer }. */
  profileQuestions: [],
  /* Section show/hide state — one map, reused by every horizontal card
     section (profession groups, feed sections, rankings, etc). A key that
     isn't present defaults to visible; FF Staff seeds a few keys hidden here
     rather than deleting those categories anywhere. */
  categoryVisibility: {
    staff_Chefs: false, staff_Services: false, "staff_Back of House": false,
  },
  directory: DIRECTORY,
  selection: [],
  events: DEMO_EVENTS, shifts: DEMO_SHIFTS, engagements: DEMO_ENGAGEMENTS,
  /* FireFlair credits — bought before availability is sent, used only when a
     Shift Card is confirmed. balance never includes money for anyone's pay. */
  credits: { balance: 0, log: [] },
  company: null,
  activeEventId: null,
  viewing: null,
  toast: null,
  /* Where the FF sheet just sent the person — { target } — consumed once by
     the Profile screen that owns that section. UI only; never persisted. */
  focus: null,
  /* Network search text — shared so Home's FF AI can hand a search over. */
  netQuery: "",
  _hydrated: false,
};

const withRecords = (s, cat, list) => ({
  ...s, profile: { ...s.profile, records: { ...s.profile.records, [cat]: list } },
});

/* Claim a task once. Re-claiming is a no-op, so XP can never be farmed by
   repeating the same action. Every award lands in xpLog for Core to read. */
/* Quarter rollover — if the profile's stored xpPeriodKey no longer matches
   the live current quarter, archive that period's final total into history
   and start the new quarter at 0. All-time xp/xpLog are untouched: this
   only ever resets the CURRENT-period counter. */
function rollXPPeriodIfNeeded(profile) {
  const liveKey = xpPeriodKey(XP_CURRENT_PERIOD);
  if (profile.xpPeriodKey === liveKey) return profile;
  const closed = { period: profile.xpPeriodKey, xp: profile.xpPeriod || 0 };
  return {
    ...profile,
    xpPeriod: 0,
    xpPeriodKey: liveKey,
    xpHistory: [...(profile.xpHistory || []), closed],
  };
}

function claimXP(s, taskId, amount) {
  const claimed = s.profile.xpClaimed || [];
  if (claimed.includes(taskId)) return s;
  const xp = amount === undefined ? XP_VALUES.task : amount;
  return {
    ...s,
    profile: {
      ...s.profile,
      xp: (s.profile.xp || 0) + xp,
      xpPeriod: (s.profile.xpPeriod || 0) + xp,
      xpClaimed: [...claimed, taskId],
      xpLog: [...(s.profile.xpLog || []), { id: taskId, xp, at: Date.now() }],
    },
  };
}

/* Claim the matching "Add …" task once a category holds real (non-proposed)
   records, however they were added — card editor, review screen or CV. Uses
   the existing claim-once system, so XP can never be awarded twice. */
function claimListXP(s, cat, list) {
  const id = xpTaskFor(cat);
  if (!XP_TASKS.some(t => t.id === id)) return s;
  if (!(list || []).some(r => r && !r.proposed && String(r.name || "").trim())) return s;
  return claimXP(s, id);
}

function reducer(s, a) {
  switch (a.type) {
    case "FOCUS":     return { ...s, focus: a.focus };
    case "NET_QUERY": return { ...s, netQuery: a.q || "" };
    case "ROLE":      return { ...s, viewing: null, role: a.role, tab: "home", route: a.role === "team" ? (s.profile.live ? "live" : "entry") : "staffHome" };
    case "GO":        return { ...s, route: a.route };
    case "TAB":       return { ...s, viewing: null, tab: a.tab, route: a.route ?? s.route };
    case "SESSION":   return { ...s, session: { ...s.session, ...a.patch } };
    case "PROFILE":   return { ...s, profile: { ...s.profile, ...a.patch } };

    case "REC_ADD":   return claimXP(withRecords(s, a.category, [...recsOf(s.profile, a.category), a.record]), xpTaskFor(a.category));
    case "REC_PATCH":
      return withRecords(s, a.category, recsOf(s.profile, a.category).map(r => r.id === a.id ? { ...r, ...a.patch } : r));
    case "REC_DELETE":
      return withRecords(s, a.category, recsOf(s.profile, a.category).filter(r => r.id !== a.id));
    case "REC_ACCEPT": {
      const list = recsOf(s.profile, a.category).map(r => r.id === a.id ? { ...r, proposed: false } : r);
      return claimListXP(withRecords(s, a.category, list), a.category, list);
    }
    case "REC_MOVE": {
      const list = [...recsOf(s.profile, a.category)];
      const i = list.findIndex(r => r.id === a.id), j = i + a.dir;
      if (i < 0 || j < 0 || j >= list.length) return s;
      [list[i], list[j]] = [list[j], list[i]];
      return withRecords(s, a.category, list);
    }
    case "REC_BULK":  return claimListXP(withRecords(s, a.category, a.list), a.category, a.list);
    /* New information joins the ONE profile — from FF AI, a CV or a card.
       A name the profile already holds is never duplicated (the existing
       record keeps its description, media and documents). New items join
       the end of the row; the person moves them left to feature them. */
    case "RECORDS_MERGE": {
      const next = { ...s.profile.records };
      Object.entries(a.byCategory).forEach(([cat, list]) => {
        const cur = [...(next[cat] || [])];
        (list || []).forEach(r => {
          const name = String((r && r.name) || "").trim();
          if (!name || cur.some(x => x.name.toLowerCase() === name.toLowerCase())) return;
          cur.push({ ...r, name });
        });
        next[cat] = cur;
      });
      let out = { ...s, profile: { ...s.profile, records: next } };
      Object.keys(a.byCategory).forEach(cat => { out = claimListXP(out, cat, next[cat]); });
      return out;
    }

    case "SELECT": {
      const on = s.selection.includes(a.id);
      return { ...s, selection: on ? s.selection.filter(x => x !== a.id) : [...s.selection, a.id] };
    }
    case "CLEAR_SELECTION": return { ...s, selection: [] };
    case "TOGGLE_CATEGORY":
      return { ...s, categoryVisibility: { ...s.categoryVisibility, [a.key]: a.visible ?? !(s.categoryVisibility[a.key] !== false) } };
    case "MEDIA_ADD":    return { ...s, profile: { ...s.profile, media: [...(s.profile.media || []), a.item] } };
    case "MEDIA_DELETE": return { ...s, profile: { ...s.profile, media: (s.profile.media || []).filter(m => m.id !== a.id) } };

    case "EVENT_ADD":  return { ...s, events: [...s.events, a.event], activeEventId: a.event.id };
    case "EVENT_PATCH": return { ...s, events: s.events.map(e => e.id === a.id ? { ...e, ...a.patch } : e) };
    case "ACTIVE_EVENT": return { ...s, activeEventId: a.id, viewing: null };
    case "SHIFT_ADD":  return { ...s, shifts: [...s.shifts, a.shift] };
    case "SHIFT_PATCH": return { ...s, shifts: s.shifts.map(x => x.id === a.id ? { ...x, ...a.patch } : x) };
    case "SHIFT_DELETE": return { ...s, shifts: s.shifts.filter(x => x.id !== a.id) };
    case "SHIFT_DUPLICATE": {
      const src = s.shifts.find(x => x.id === a.id);
      if (!src) return s;
      const copy = { ...src, id: uid("shf"), staffId: a.staffId || "", skills: [...(src.skills || [])] };
      const i = s.shifts.findIndex(x => x.id === a.id);
      const shifts = [...s.shifts]; shifts.splice(i + 1, 0, copy);
      return { ...s, shifts, toast: "Shift Card duplicated — amend it and assign someone" };
    }

    case "CREDITS_BUY": return {
      ...s, credits: {
        balance: (s.credits?.balance || 0) + a.n,
        log: [...(s.credits?.log || []), { kind: "bought", n: a.n, at: Date.now() }],
      },
    };

    /* Send one Availability Card per Shift Card, each to the person assigned
       to it. Each request reserves a credit; nothing is used until they confirm. */
    case "SEND_REQUESTS": {
      const now = Date.now();
      const made = a.shiftIds.map(id => {
        const sh = s.shifts.find(x => x.id === id);
        return {
          id: uid("eng"), shiftId: id, staffId: sh.staffId, state: "requested", credit: true,
          sentAt: now, expiresAt: now + RESPONSE_MS, questions: a.questions || [],
          history: [{ state: "requested", at: now }],
        };
      });
      const sentStaff = made.map(m => m.staffId);
      return { ...s, engagements: [...s.engagements, ...made], selection: s.selection.filter(x => !sentStaff.includes(x)) };
    }
    case "REQUESTS": {
      const made = a.staffIds.map(sid => ({
        id: uid("eng"), shiftId: a.shiftId, staffId: sid,
        state: "requested", history: [{ state: "requested", at: Date.now() }],
      }));
      return { ...s, engagements: [...s.engagements, ...made], selection: [] };
    }
    case "ENG_STATE": {
      let credits = s.credits || { balance: 0, log: [] };
      const engagements = s.engagements.map(e => {
        if (e.id !== a.id) return e;
        let next = { ...e, state: a.state, history: [...e.history, { state: a.state, at: Date.now() }] };
        /* A credit is used only on a confirmed response, and only once. */
        if (a.state === "confirmed" && e.credit && !e.creditUsed) {
          next.creditUsed = true;
          credits = { balance: Math.max(0, credits.balance - 1), log: [...credits.log, { kind: "used", n: 1, shiftId: e.shiftId, at: Date.now() }] };
        }
        return next;
      });
      return { ...s, engagements, credits };
    }
    /* Requests with no reply inside the response window expire; their
       credit is released back for a replacement or a future booking. */
    case "EXPIRE_DUE": {
      const now = Date.now();
      const due = s.engagements.some(e => e.state === "requested" && e.credit && e.expiresAt && e.expiresAt <= now);
      if (!due) return s;
      return {
        ...s, engagements: s.engagements.map(e => e.state === "requested" && e.credit && e.expiresAt && e.expiresAt <= now
          ? { ...e, state: "expired", history: [...e.history, { state: "expired", at: now }] } : e),
      };
    }
    case "COMPANY_SAVE": return { ...s, company: { ...(s.company || {}), ...a.company } };
    case "COMPANY_REVIEW_ADD": return { ...s, company: { ...s.company, reviews: [a.review, ...((s.company && s.company.reviews) || [])] } };

    case "PUBLISH_XP": return claimXP(s.profile.name ? claimXP(s, "create_card") : s, "publish_profile");
    case "CARD_CREATED_XP": return claimXP(s, "create_card");
    case "ASK_QUESTION": return { ...s, profileQuestions: [...(s.profileQuestions || []), a.q] };
    case "ANSWER": {
      const q = QUESTIONS.find(x => x.id === a.qid);
      const aiList = s.profile.aiQuestions || [];
      let prevVal, next;
      if (q && q.group === "feedback") {
        /* Feedback is product research — kept apart from the profile. */
        prevVal = (s.feedback || {})[a.qid];
        next = { ...s, feedback: { ...(s.feedback || {}), [a.qid]: a.value } };
      } else if (!q && aiList.some(x => x.id === a.qid)) {
        prevVal = aiList.find(x => x.id === a.qid).answer;
        next = { ...s, profile: { ...s.profile, aiQuestions: aiList.map(x => x.id === a.qid ? { ...x, answer: a.value } : x) } };
      } else {
        const prev = s.profile.answers || {};
        prevVal = prev[a.qid];
        const patch = { answers: { ...prev, [a.qid]: a.value } };
        /* The travel answer drives the card's car glyph. */
        if (a.qid === "g_travel") patch.hasCar = a.value === "I drive";
        next = { ...s, profile: { ...s.profile, ...patch } };
      }
      /* +1 XP the first time a question is answered, never on edits. */
      return isAnswered(prevVal) ? next : claimXP(next, `question_${a.qid}`, XP_VALUES.question);
    }
    case "AI_QUESTION_ADD": {
      const list = s.profile.aiQuestions || [];
      if (list.some(x => x.text.toLowerCase() === a.q.text.toLowerCase())) return s;
      const next = { ...s, profile: { ...s.profile, aiQuestions: [...list, a.q] } };
      return isAnswered(a.q.answer) ? claimXP(next, `question_${a.q.id}`, XP_VALUES.question) : next;
    }
    case "CONNECT":   return { ...s, connections: [...s.connections, ...a.people] };
    case "REVIEW_ADD": {
      const next = { ...s, reviews: [...s.reviews, a.review] };
      return a.review.aboutId === "me" ? claimXP(next, "first_review") : next;
    }
    case "REVIEW_REQUEST": return { ...s, reviewRequests: [...s.reviewRequests, a.request] };
    case "INVITE":    return { ...s, invitations: [...s.invitations, ...a.people] };
    case "VIEW":      return { ...s, viewing: a.id };
    case "SEED_DEMO": {
      /* The demo profile is complete, so it carries the XP its data has earned. */
      let n = {
      ...s, role: "team", tab: "home", route: "home", viewing: null,
      session: { ...s.session, tag: "SAM42", phone: "+44 7700 900412", verified: true },
      auth: { status: "signedIn", tag: "SAM42", method: "demo" },
      profile: { ...s.profile, name: "Sam Morgan", live: true, theme: "ivory", tier: "gold", level: 5, hasCar: true, photo: avatarFor("Sam Morgan"), records: DEMO_RECORDS(), categories: {} },
      connections: [
        { id: "stf_ava", name: "Ava Clarke", note: "Senior Bartender", onFF: true, tag: "AVA03" },
        { id: "stf_tom", name: "Tom Beatson", note: "DJ & Music Producer", onFF: true, tag: "TOMBE" },
        { id: "stf_mia", name: "Mia Santos", note: "Silver Service Waiter", onFF: true, tag: "MIAS1" },
        { id: "stf_pri", name: "Priya Raman", note: "MC & Event Host", onFF: true, tag: "PRIYA" },
        { id: "stf_idr", name: "Idris Bello", note: "Head Chef", onFF: true, tag: "IDRIS" },
      ],
      reviews: [
        { id: "rev_1", aboutId: "me", byId: "stf_ava", byName: "Ava Clarke", rating: 5, text: "Ran the bar for our launch night without a single hiccup — fast, clean, and great with the guests.", at: Date.now() - 12 * 864e5 },
        { id: "rev_2", aboutId: "me", byId: "stf_pri", byName: "Priya Raman", rating: 5, text: "One of the most reliable bartenders I've worked events with. Always early, always prepped.", at: Date.now() - 40 * 864e5 },
      ],
      };
      ["create_card", "publish_profile", "first_review"].forEach(id => { n = claimXP(n, id); });
      Object.keys(n.profile.records).forEach(cat => { n = claimListXP(n, cat, n.profile.records[cat]); });
      return n;
    }
    case "AUTH_SIGNED_IN": return { ...s, auth: { status: "signedIn", tag: a.tag, method: a.method }, session: { ...s.session, tag: s.session.tag || a.tag } };
    case "TOAST":     return { ...s, toast: a.toast };
    case "RESET":     return { ...initialState, role: s.role, route: s.role === "team" ? "entry" : "staffHome" };
    /* Sign out: back to the signed-out home page with no role, no profile and
       no demo data, so the full sign-up flow can be walked through again.
       The referral tag from the link is kept. */
    case "SIGN_OUT":  return { ...initialState, session: { ...initialState.session, refTag: s.session.refTag }, toast: "Signed out" };
    case "HYDRATE":   return { ...s, ...a.patch, _hydrated: true };
    default:          return s;
  }
}

const Store = createContext(null);
const useStore = () => useContext(Store);

/* The signed-in professional, presented in the same shape as a directory
   person, so one PlayerCard renderer serves both. Card values are READ from
   the primary records — never a second copy of them. */
function meAsStaff(profile, session) {
  return {
    id: "me", name: profile.name || "Your profile", tag: session.tag || "username",
    professions: primaryNames(profile, "professions", 3),
    profession: primaryNames(profile, "professions", 1)[0] || "Professional",
    group: "Your profile",
    tier: profile.tier, level: profile.level, years: null, rating: null, reviews: 0,
    skills: primaryNames(profile, "skills", 3),
    interests: primaryNames(profile, "interests", 3),
    languages: primaryNames(profile, "languages", 5).length ? primaryNames(profile, "languages", 5) : ["English"],
    locations: primaryNames(profile, "locations", 3).length ? primaryNames(profile, "locations", 3) : ["London"],
    hasCar: profile.hasCar, availability: "open", photo: profile.photo, theme: profile.theme,
    /* Top profession's confirmed display category, if the person set one. */
    categoryOverride: (recsOf(profile, "professions").filter(r => !r.proposed)[0] || {}).displayCategory,
    /* Display-only: where they've worked, read from Experience records. */
    experience: recsOf(profile, "experience").filter(r => !r.proposed).map(r => String(r.name).split(" — ")[0]).slice(0, 2),
  };
}

/* ==========================================================================
   4. SERVICES — CV extraction adapter.
   --------------------------------------------------------------------------
   The adapter boundary is deliberate: `CV_ADAPTER.extract(file)` is the ONLY
   place the rest of the app touches extraction. Swap its body for a real
   Core API call and nothing above it changes.

   HONEST STATUS: no extraction service is wired up in this prototype. The
   adapter reports `available: false` and the UI says so plainly rather than
   pretending a CV was read. The review/accept/reject data flow below is real
   and is what a live adapter would feed.
   ========================================================================== */

const CV_ADAPTER = {
  available: false,
  note: "CV reading is not connected in this prototype. The review flow below is the one a live extraction service would feed.",

  /* Contract a live adapter must satisfy:
     -> { name, professions[], skills[], interests[], locations[],
          languages[], qualifications[], experience[] }
        where each item is { value, description?, source, confidence }.
     Nothing is invented; anything not evidenced in the document is omitted. */
  async extract(file) {
    await new Promise(r => setTimeout(r, 700));
    const err = new Error(CV_ADAPTER.note);
    err.notConnected = true;
    throw err;
  },
};

/* Apple Wallet adapter — same honesty pattern as CV_ADAPTER. No pass-signing
   service is connected in this prototype, so passKit() reports that plainly
   rather than faking a .pkpass download. A live adapter would generate and
   sign a real pass from the same profile/booking data passed in here. */
const WALLET_ADAPTER = {
  available: false,
  note: "Wallet passes aren't connected in this prototype — Apple and Google passes need to be signed by a real wallet service. This is where that request would go.",

  /* Contract a live adapter must satisfy: given { kind: "profile"|"booking", ...data },
     -> a signed .pkpass file (or a URL to one) for the browser to open. */
  async passFor(payload) {
    await new Promise(r => setTimeout(r, 500));
    const err = new Error(WALLET_ADAPTER.note);
    err.notConnected = true;
    throw err;
  },
};

/* ==========================================================================
   AUTH adapter — the ONLY place the app asks "who is this?".
   The nav, the login sheet and the reducer only ever see { tag, method }
   come back, so a live FireFlair Core auth API replaces these bodies and
   nothing above them changes.

   Account creation:  FF Tag + phone number -> WhatsApp one-time code ->
   account created. A password is optional and offered afterwards.
   Sign-in:           FF Tag + WhatsApp code (always), or FF Tag + password
                      (only once one has been created).

   FF TAG: a short username — 3 to 8 letters or numbers, unique, not case
   sensitive (stored lower case: alex, alexg, alex94). Eight is the most
   that fits cleanly on the Profile Card. It can be changed later.

   HONEST STATUS: no account service is connected and no WhatsApp message
   is sent. This mock accepts any available Tag, any mobile number of nine
   or more digits, any six-digit code, and any password of six or more
   characters.
   ========================================================================== */
const AUTH_ADAPTER = {
  available: false,
  note: "Prototype sign-in: no FireFlair account service is connected yet.",
  TAG_MIN: 3, TAG_MAX: 8,
  cleanTag: (t) => String(t || "").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 8),
  tagOk: (t) => { const n = AUTH_ADAPTER.cleanTag(t).length; return n >= AUTH_ADAPTER.TAG_MIN && n <= AUTH_ADAPTER.TAG_MAX; },
  _taken: (t) => TAKEN_TAGS.some(x => x.toLowerCase() === t),
  _tag(tag) {
    const t = AUTH_ADAPTER.cleanTag(tag);
    if (!AUTH_ADAPTER.tagOk(t)) throw new Error("Your FF Tag is 3 to 8 letters or numbers.");
    return t;
  },
  _phone(phone) {
    if (String(phone || "").replace(/\D/g, "").length < 9) throw new Error("Enter your mobile number, with the country code if you're outside the UK.");
    return String(phone).trim();
  },
  /* Availability. Core checks this against every account; the mock checks
     a short list. `current` is the person's own Tag, which is never
     "taken" from their point of view. */
  isAvailable(tag, current) {
    const t = AUTH_ADAPTER.cleanTag(tag);
    if (!AUTH_ADAPTER.tagOk(t)) return false;
    return t === String(current || "").toLowerCase() || !AUTH_ADAPTER._taken(t);
  },
  /* A suggested Tag from the person's name: their first name where it's
     free (alex), then first name + initial (alexg), then name + number
     (alex94). Only ever a suggestion — the field stays editable. */
  suggestTag(name) {
    const words = String(name || "").toLowerCase().replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter(Boolean);
    if (!words.length) return "";
    const first = words[0], rest = words.slice(1).join("");
    const pad = (x) => (x + rest).slice(0, 8);
    const options = [];
    if (first.length >= 3) options.push(first.slice(0, 8));
    if (rest) options.push((first.slice(0, 7) + rest[0]));
    options.push(pad(first));
    const free = options.find(t => AUTH_ADAPTER.tagOk(t) && !AUTH_ADAPTER._taken(t));
    if (free) return free;
    let h = 0; for (const ch of words.join("")) h = (h * 31 + ch.charCodeAt(0)) % 9973;
    const stem = pad(first).slice(0, 6);
    for (let i = 0; i < 90; i++) {
      const t = stem + String(10 + ((h + i) % 90));
      if (AUTH_ADAPTER.tagOk(t) && !AUTH_ADAPTER._taken(t)) return t;
    }
    return "";
  },
  async sendSignupCode(tag, phone) {
    await new Promise(r => setTimeout(r, 450));
    const t = AUTH_ADAPTER._tag(tag);
    if (!AUTH_ADAPTER.isAvailable(t)) throw new Error(`${t} is taken — try another Tag.`);
    return { sentTo: AUTH_ADAPTER._phone(phone), channel: "whatsapp" };
  },
  /* Verifying the code IS account creation: the Tag is reserved and the
     number is recorded as verified in the same step. */
  async verifySignupCode(tag, phone, code) {
    await new Promise(r => setTimeout(r, 450));
    const t = AUTH_ADAPTER._tag(tag);
    if (!/^\d{6}$/.test(String(code || ""))) throw new Error("The code is six digits.");
    return { tag: t, phone: AUTH_ADAPTER._phone(phone), method: "otp" };
  },
  async setPassword(tag, password) {
    await new Promise(r => setTimeout(r, 350));
    AUTH_ADAPTER._tag(tag);
    if (String(password || "").length < 6) throw new Error("Choose a password of at least six characters.");
    return { ok: true };
  },
  async changeTag(oldTag, newTag) {
    await new Promise(r => setTimeout(r, 400));
    const t = AUTH_ADAPTER._tag(newTag);
    if (t === String(oldTag || "").toLowerCase()) return { tag: t };
    if (!AUTH_ADAPTER.isAvailable(t, oldTag)) throw new Error(`${t} is taken — try another Tag.`);
    return { tag: t };
  },
  async loginWithPassword(tag, password) {
    await new Promise(r => setTimeout(r, 450));
    const t = AUTH_ADAPTER._tag(tag);
    if (String(password || "").length < 6) throw new Error("That password doesn't match this FF Tag.");
    return { tag: t, method: "password" };
  },
  async sendCode(tag, phone) {
    await new Promise(r => setTimeout(r, 450));
    AUTH_ADAPTER._tag(tag);
    if (String(phone || "").replace(/\D/g, "").length < 9) throw new Error("Enter the mobile number on your FireFlair account.");
    return { sentTo: phone, channel: "whatsapp" };
  },
  async verifyCode(tag, phone, code) {
    await new Promise(r => setTimeout(r, 450));
    const t = AUTH_ADAPTER._tag(tag);
    if (!/^\d{6}$/.test(String(code || ""))) throw new Error("The code is six digits.");
    return { tag: t, method: "otp" };
  },
  async logout() { await new Promise(r => setTimeout(r, 120)); },
};

/* PROFILE adapter — where the profile goes once the account exists.

   HONEST STATUS: not connected — nothing leaves this page. */
const PROFILE_ADAPTER = {

  async shareTo(tag, phone) {

/* ==========================================================================
   SPEECH adapter — browser speech recognition today. A hosted speech-to-text
   service later replaces start() and the FFAI input doesn't change: it only
   ever puts text into the field, where the person reviews it before sending.
   ========================================================================== */
const SPEECH_ADAPTER = {
  supported: () => typeof window !== "undefined" && !!(window.SpeechRecognition || window.webkitSpeechRecognition),
  start({ onText, onEnd, onError }) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { onError("unsupported"); return null; }
    const r = new SR();
    r.lang = "en-GB"; r.interimResults = false; r.continuous = false;
    r.onresult = (e) => {
      const t = Array.from(e.results).map(x => x[0].transcript).join(" ").trim();
      if (t) onText(t);
    };
    r.onerror = (e) => onError((e && e.error) || "error");
    r.onend = () => onEnd();
    try { r.start(); } catch (e) { onError("busy"); return null; }
    return { stop: () => { try { r.stop(); } catch (e) { /* already stopped */ } } };
  },
};
const SPEECH_ERRORS = {
  unsupported: "Voice input isn't available in this browser — type instead.",
  "not-allowed": "Microphone access is blocked. Allow it in your browser settings, or type instead.",
  "service-not-allowed": "Microphone access is blocked. Allow it in your browser settings, or type instead.",
  "no-speech": "Didn't catch that — tap the microphone and try again.",
  "audio-capture": "No microphone was found on this device.",
  network: "Voice input needs a connection. Try again, or type instead.",
};

/* ==========================================================================
   PROFILE AI — free text -> proposed Question Card answers.
   No language model is wired up: this is a keyword/phrase matcher against
   the QUESTIONS library, honestly labelled as such. A live adapter would
   swap this function's body for a real model call and keep the same
   { qid, value, matchedOn } output shape, so nothing downstream changes.
   The caller is always responsible for confirming proposals before they
   touch the profile — this function only ever proposes, never writes.
   ========================================================================== */
function proposeAnswersFromText(text) {
  const t = (text || "").toLowerCase();
  const out = [];
  const add = (qid, value) => { if (!out.some(p => p.qid === qid)) out.push({ qid, value }); };
  if (/\b(i drive|own car|have a car|my car|driving licen[cs]e|drive myself)\b/.test(t)) add("g_travel", "I drive");
  else if (/\b(public transport|tube|train|bus|underground|overground)\b/.test(t)) add("g_travel", "Public transport");
  if (/\bfreelanc/.test(t)) add("g_freelance", "Yes");
  if (/\b(own (kit|equipment|tools|bar tools|shaker)|cocktail equipment|bar equipment|my (kit|equipment|tools))\b/.test(t)) add("g_equipment", "Yes");
  if (/\b(last[- ]minute|short notice)\b/.test(t)) add("g_notice", "Yes");
  if (/\b(weddings?|corporate|festivals?|private (parties|party|events?)|events?)\b/.test(t)) add("g_events", "Yes");

  /* Information that fits no profile category becomes a NEW Question Card
     (v1.6 §7), answered from what was given and confirmed by the person. */
  const AI_RULES = [
    [/\b(trained|training|train) (new |junior )?(staff|bartenders|teams?|people|others|waiters)\b|\btrainer\b/, "Have you trained other hospitality staff?"],
    [/\b(managed|managing|led|leading|ran|running) (a |the |my )?(team|bar team|staff|crew)\b/, "Have you managed a team?"],
    [/\bcompetitions?\b/, "Have you competed in cocktail competitions?"],
  ];
  AI_RULES.forEach(([re, q]) => { if (re.test(t)) out.push({ ai: true, qid: "new_" + q.toLowerCase().replace(/[^a-z]+/g, "_"), text: q, value: "Yes" }); });
  return out;
}

/* Extraction result -> proposed records, flagged `proposed` so nothing
   reaches the profile until the user accepts it. */
function recordsFromExtraction(x) {
  const byCategory = {};
  const src = (o) => ({ origin: "CV", location: o?.source || "document", confidence: o?.confidence || "medium" });
  const many = (cat, arr) => {
    const list = (arr || []).filter(i => i && i.value);
    if (!list.length) return;
    byCategory[cat] = list.map(i => ({
      ...makeRecord(cat, i.value),
      description: i.description || "",
      proposed: true,
      source: src(i),
    }));
  };
  many("professions", x.professions);
  many("skills", x.skills);
  many("interests", x.interests);
  many("locations", x.locations);
  many("languages", x.languages);
  many("qualifications", x.qualifications);
  many("experience", x.experience);
  return byCategory;
}

const MAX_MEDIA_BYTES = 10 * 1024 * 1024;

function readFileAsDataUrl(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result));
    r.onerror = () => rej(new Error("Could not read that file."));
    r.readAsDataURL(file);
  });
}

/* Time left on a request's response window, e.g. "47h 12m left". */
function timeLeft(expiresAt) {
  const ms = (expiresAt || 0) - Date.now();
  if (ms <= 0) return "Expired";
  const h = Math.floor(ms / 36e5), m = Math.floor((ms % 36e5) / 6e4);
  return `${h}h ${String(m).padStart(2, "0")}m left`;
}

/* ==========================================================================
   INFORMATION CARD EDITOR
   Opens the full record behind a Profile Card entry. Renders only the fields
   the category declares, so qualifications get documents, languages get
   proficiency, and nothing carries fields it has no use for.
   ========================================================================== */
/* ==========================================================================
   REVIEW SHEET
   Written about a connection, stored centrally against their id, and surfaced
   on their profile as a Review information record.
   ========================================================================== */
/* Add-to-Apple-Wallet button — same shape wherever it appears, on a profile
   card or a booking card. Honest about the adapter status rather than
   pretending a pass downloads. */
/* ==========================================================================
   FFAI — one shared chat-style entry point.
   Reused wherever the app needs "tell us what you're looking for": FF Staff
   today, FF Team/FF Party/FF VIP later. It wraps the EXISTING search logic
   (directory filtering by name/skill/area) rather than replacing it, and
   offers the existing event/shift creation as quick actions for anyone who'd
   rather describe a booking than search. No real language model is wired up
   here — a typed line either matches people directly (search) or is handed
   to the person as a prompt to create an event/shift card, honestly, same
   pattern as the CV and Wallet adapters elsewhere in the app.
   ========================================================================== */
/* One FFAI component for every page; each page passes its own title and
   purpose (Home: Welcome to FireFlair, Profile: Tell us about yourself…).
   The microphone is always part of the input: speech becomes text in the
   field, the person checks or edits it, then sends it. `multiline` gives a
   longer guided entry with a submit button; `children` renders the page's
   own result (e.g. Profile's proposed information) under the input. */
function FFAI({ query, onQuery, onSubmit, onEvent, onShift, placeholder, context = "FireFlair", title, purpose, actions, hero = false, multiline = false, submitLabel = "Go", note, children, tint = false, coinSize }) {
  const [val, setVal] = useState(query || "");
  const [listening, setListening] = useState(false);
  const [micMsg, setMicMsg] = useState(null);
  const recRef = useRef(null);
  const valRef = useRef(val);
  valRef.current = val;
  useEffect(() => setVal(query || ""), [query]);
  useEffect(() => () => { if (recRef.current) recRef.current.stop(); }, []);
  const looksLikeBooking = /\b(need|looking for|wedding|event|shift|hire|staff|party|corporate)\b/i.test(val) && val.trim().split(/\s+/).length > 3;

  const change = (v) => { setVal(v); if (onQuery) onQuery(v); };
  const submit = () => {
    const v = val.trim();
    if (!v) return;
    if (onSubmit) onSubmit(v); else if (onQuery) onQuery(v);
  };
  const toggleMic = () => {
    if (listening) { if (recRef.current) recRef.current.stop(); return; }
    if (!SPEECH_ADAPTER.supported()) { setMicMsg(SPEECH_ERRORS.unsupported); return; }
    recRef.current = SPEECH_ADAPTER.start({
      onText: (t) => change((valRef.current ? valRef.current.trim() + " " : "") + t),
      onEnd: () => { setListening(false); setMicMsg(m => (m && m.startsWith("Listening") ? "Check the text, edit anything, then send it." : m)); },
      onError: (code) => { setListening(false); setMicMsg(SPEECH_ERRORS[code] || "Voice input stopped. Try again, or type instead."); },
    });
    if (recRef.current) { setListening(true); setMicMsg("Listening… speak now."); }
  };

  const mic = (style) => (
    <button type="button" className={`ff-mic${listening ? " on" : ""}`} onClick={toggleMic} style={style}
      aria-pressed={listening} aria-label={listening ? "Stop listening" : "Speak instead of typing"} title={listening ? "Stop" : "Speak"}>
      <MicGlyph size={18} />
    </button>
  );

  return (
    <div className={`ff-frame ${tint ? "ff-ffai-tint" : "ff-lattice"}`} style={{ padding: hero ? 18 : 14, margin: "14px 0" }}>
      <Corners />
      <div style={{ display: "flex", gap: hero ? 14 : 10, alignItems: "center", marginBottom: 10 }}>
        <Coin size={hero ? (coinSize || 48) : 30} tier="gold" />
        <span style={{ minWidth: 0 }}>
          <span className="ff-display" style={{ fontSize: hero ? 19 : 13, display: "block", lineHeight: 1.2 }}>{title || `Welcome to ${context}`}</span>
          <span className="ff-body ff-muted" style={{ fontSize: hero ? 13 : 12 }}>{purpose || "Tell us what you're looking for."}</span>
        </span>
      </div>
      {multiline ? (<>
        <div style={{ position: "relative" }}>
          <textarea className="ff-input" rows={4} style={{ paddingRight: 50, resize: "vertical" }}
            placeholder={placeholder} value={val} onChange={(e) => change(e.target.value)} aria-label={title || "FF AI"} />
          {mic({ right: 7, top: 7 })}
        </div>
        <Btn variant="primary wide" disabled={!val.trim() || listening} onClick={submit} style={{ marginTop: 10 }}>
          <Sparkles size={14} /> {submitLabel}
        </Btn>
      </>) : (
        <div style={{ position: "relative" }}>
          <Search size={16} color="#7A7366" style={{ position: "absolute", left: 12, top: 15 }} />
          <input className="ff-input" style={{ paddingLeft: 36, paddingRight: val ? 100 : 48 }}
            placeholder={placeholder || "Name, skill, area, or describe your event…"}
            value={val} onChange={(e) => change(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && submit()} aria-label={title || "FF AI"} />
          {mic({ right: val ? 56 : 6, top: 6 })}
          {val && (
            <button onClick={submit} className="ff-btn sm primary" style={{ position: "absolute", right: 5, top: 6, padding: "7px 10px", minWidth: 46 }}>{submitLabel}</button>
          )}
        </div>
      )}
      {micMsg && <p className="ff-body" role="status" style={{ fontSize: 11.5, margin: "8px 0 0", color: listening ? "var(--ox)" : "#6A6253" }}>{micMsg}</p>}
      {looksLikeBooking && (onEvent || onShift) && (
        <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap", alignItems: "center" }}>
          <span className="ff-body ff-muted" style={{ fontSize: 11.5 }}>Sounds like a booking —</span>
          {onEvent && <Btn variant="sm" onClick={onEvent}><Calendar size={12} /> Create event</Btn>}
          {onShift && <Btn variant="sm" onClick={onShift}><Clock size={12} /> Create shift</Btn>}
        </div>
      )}
      {!val && actions && actions.length > 0 && (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginTop: 10 }}>
          {actions.map(a => <Btn key={a.label} variant={a.primary ? "sm primary" : "sm"} onClick={a.onClick}>{a.label}</Btn>)}
        </div>
      )}
      {!val && (onEvent || onShift) && (
        <div style={{ display: "grid", gridTemplateColumns: onEvent && onShift ? "1fr 1fr" : "1fr", gap: 8, marginTop: 12 }}>
          {onEvent && <Btn variant="primary" onClick={onEvent}><Calendar size={14} /> Tell us about an event</Btn>}
          {onShift && <Btn onClick={onShift}><Clock size={14} /> Describe a shift</Btn>}
        </div>
      )}
      {children}
      <p className="ff-body ff-muted" style={{ fontSize: 10.5, margin: "10px 0 0" }}>
        {note || "Prototype: FF AI matches what you type to FireFlair — no AI model is connected yet."}
      </p>
    </div>
  );
}

/* Home's FF AI — "Welcome to FireFlair". Routes what someone types to the
   right main page: work → Profile, hiring → FF Staff, a question → the
   FireFlair information, anything else → a Network search. */
function HomeFFAI() {
  const { state, dispatch } = useStore();
  const isTeam = state.role === "team";
  const goProfile = () => { if (!isTeam) dispatch({ type: "ROLE", role: "team" }); dispatch({ type: "TAB", tab: "profile", route: "home" }); window.scrollTo(0, 0); };
  const goStaff = () => { dispatch({ type: "ROLE", role: "staff" }); window.scrollTo(0, 0); };
  const goNetwork = (q = "") => { dispatch({ type: "NET_QUERY", q }); dispatch({ type: "TAB", tab: "network" }); window.scrollTo(0, 0); };
  const onSubmit = (v) => {
    const t = v.toLowerCase();
    if (/\b(hire|hiring|need|book|booking)\b|looking for (a|an|some|staff)/.test(t)) {
      goStaff(); dispatch({ type: "TOAST", toast: "FF Staff — find and book event professionals" }); return;
    }
    if (/\b(bartender|bartending|waiter|chef|dj|host|photographer|work|job|jobs|shifts?|join|card|profile|sign ?up)\b/.test(t)) {
      goProfile(); dispatch({ type: "TOAST", toast: "Let's build your Profile Card" }); return;
    }
    if (/\?|^(what|why|how|who|is|can|does|tell)\b/.test(t)) {
      const el = document.getElementById("ff-why");
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      dispatch({ type: "TOAST", toast: "Here's what FireFlair is about" }); return;
    }
    goNetwork(v); dispatch({ type: "TOAST", toast: `Searching the network for “${v}”` });
  };
  return (
    <FFAI hero title="Welcome to FireFlair"
      purpose="Ask about FireFlair, or tell us what you're here to do — find work, hire staff or find someone."
      placeholder="I'm a bartender · I need staff · Shoreditch…" onSubmit={onSubmit}
      actions={[
        { label: isTeam ? "My Profile Card" : "Join FF Team", primary: true, onClick: goProfile },
        { label: "Hire staff", onClick: goStaff },
        { label: "Explore the network", onClick: () => goNetwork("") },
      ]} />
  );
}

function QuestionSheet({ open, q, onClose, onSaved }) {
  const { state, dispatch } = useStore();
  const [val, setVal] = useState("");
  const [choice, setChoice] = useState("");
  const [detail, setDetail] = useState("");
  useEffect(() => {
    if (!open || !q) return;
    const ex = String(answerOf(state, q) || "");
    setVal(ex);
    if (q.detail && ex.startsWith(q.detail.option)) { setChoice(q.detail.option); setDetail(ex.slice(q.detail.option.length).replace(/^\s*—\s*/, "")); }
    else { setChoice(ex); setDetail(""); }
  }, [open, q && q.id]);
  if (!open || !q) return null;
  const existing = answerOf(state, q);
  const isNew = !isAnswered(existing);

  const save = (v) => {
    dispatch({ type: "ANSWER", qid: q.id, value: v });
    dispatch({ type: "TOAST", toast: isNew ? `Answered · +${q.xp} XP` : "Answer updated" });
    if (onSaved) onSaved(q.id, isNew);
    onClose();
  };
  const pick = (o) => { if (q.detail && o === q.detail.option) { setChoice(o); return; } save(o); };
  const needsDetail = q.detail && choice === q.detail.option;
  const note = q.group === "feedback"
    ? "Feedback goes to the FireFlair team to improve FF Team. It's kept separately from your profile and never shown on it."
    : q.group === "ai"
      ? "FF AI created this Question Card from information you gave it. It isn't shown on your public card."
      : "Answers help FireFlair match you to work. They don't appear on your public card.";

  return (
    <Sheet open onClose={onClose} title={q.group === "feedback" ? "Feedback" : q.group === "ai" ? "FF AI question" : "Question"}>
      <p className="ff-serif" style={{ fontSize: 19, lineHeight: 1.35, marginTop: 0 }}>{q.text}</p>
      {q.type === "choice" && (
        <div style={{ display: "grid", gap: 8 }}>
          {q.options.map(o => (
            <Btn key={o} variant={choice === o ? "primary" : ""} onClick={() => pick(o)}>{o}</Btn>
          ))}
        </div>
      )}
      {needsDetail && (<>
        <div style={{ height: 12 }} />
        <Field label={q.detail.label}>
          <input className="ff-input" value={detail} onChange={(e) => setDetail(e.target.value)} placeholder={q.detail.placeholder || ""} autoFocus />
        </Field>
        <Btn variant="primary wide" disabled={!q.detail.optional && !detail.trim()}
          onClick={() => save(detail.trim() ? `${choice} — ${detail.trim()}` : choice)}>
          {isNew ? `Save · +${q.xp} XP` : "Save answer"}
        </Btn>
      </>)}
      {q.type === "text" && (<>
        <Field label="Your answer">
          <textarea className="ff-input" rows={3} value={val} onChange={(e) => setVal(e.target.value)} placeholder={q.placeholder || ""} />
        </Field>
        <Btn variant="primary wide" disabled={!val.trim()} onClick={() => save(val.trim())}>
          {isNew ? `Save · +${q.xp} XP` : "Save answer"}
        </Btn>
      </>)}
      <p className="ff-body ff-muted" style={{ fontSize: 11.5, marginTop: 14, marginBottom: 0 }}>{note}</p>
    </Sheet>
  );
}

/* A group of Question Cards — used for logistics, availability, experience,
   and for the dream-opportunity questions that become Job Request data. */
/* ONE unified Question Cards carousel — every category's questions in a
   single left/right swipeable collection, each card carrying its own
   category name and colour so the category stays legible while swiping. */
/* Question order is shuffled once per visit to the Profile page (ProfilePage
   calls resetQuestionOrder when it mounts) and then held still while the
   person works through them. Answered and unanswered are shuffled
   independently. Display order only — answers are never touched. */
let QA_RANKS = {};
const resetQuestionOrder = () => { QA_RANKS = {}; };
const qaRank = (id) => (QA_RANKS[id] === undefined ? (QA_RANKS[id] = Math.random()) : QA_RANKS[id]);

function QuestionCardsCollection() {
  const { state } = useStore();
  const [openId, setOpenId] = useState(null);
  const [celebrate, setCelebrate] = useState(null);
  const rowRef = useRef(null);
  const qs = allQuestions(state);
  const isDone = (q) => isAnswered(answerOf(state, q));
  const byRank = (a, b) => qaRank(a.id) - qaRank(b.id);
  const todo = qs.filter(q => !isDone(q)).sort(byRank);
  const done = qs.filter(isDone).sort(byRank);
  const openQ = qs.find(q => q.id === openId) || null;
  const present = QUESTION_GROUPS.filter(g => qs.some(q => q.group === g.key));

  /* Bring a card into view inside the row (and only the row). */
  const showCard = (selector) => {
    const row = rowRef.current && rowRef.current.querySelector(".ff-hscroll");
    const el = row && row.querySelector(selector);
    if (!row || !el) return;
    const r = row.getBoundingClientRect(), e = el.getBoundingClientRect();
    row.scrollTo({ left: row.scrollLeft + (e.left - r.left) - (r.width - e.width) / 2, behavior: "smooth" });
  };
  const onSaved = (id, isNew) => {
    if (!isNew) return;
    setCelebrate(id);
    setTimeout(() => showCard(`[data-qid="${id}"]`), 80);
    setTimeout(() => setCelebrate(c => (c === id ? null : c)), 2000);
  };

  const card = (q) => (
    <span key={q.id} data-qid={q.id} style={{ display: "block" }}>
      <QuestionCard q={q} answer={answerOf(state, q)} celebrate={celebrate === q.id} onClick={() => setOpenId(q.id)} />
    </span>
  );

  return (
    <>
      <p className="ff-body ff-muted" style={{ fontSize: 11.5, margin: "-4px 0 8px" }}>
        {todo.length} to answer · {done.length} answered · +{XP_VALUES.question} XP each · never on your public card
      </p>
      <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 12 }}>
        {present.map(g => (
          <span key={g.key} className="ff-body ff-muted" style={{ fontSize: 11, display: "flex", gap: 6, alignItems: "center" }}>
            <span style={{ width: 12, height: 12, borderRadius: 2, background: questionGroupColor(g.key).bg, border: `1px solid ${questionGroupColor(g.key).sub}`, display: "block" }} />
            {g.label}{g.key === "feedback" ? " (private)" : ""}
          </span>
        ))}
        <span className="ff-body ff-muted" style={{ fontSize: 11, display: "flex", gap: 6, alignItems: "center" }}>
          <span style={{ width: 12, height: 12, borderRadius: 2, background: QUESTION_DONE.bg, border: "1px solid #39C27E", display: "block" }} />Answered
        </span>
      </div>
      <div className="ff-qa-sides">
        <span className="todo">To answer · {todo.length}</span>
        <button type="button" className="done" onClick={() => showCard(".ff-qa-divider")}>
          Answered · {done.length} <span style={{ width: 18, height: 18, borderRadius: "50%", background: "#34C27A", color: "#fff", display: "grid", placeItems: "center" }}><TickGlyph size={12} /></span> →
        </button>
      </div>
      <div ref={rowRef}>
        <HScroll label="Question Cards">
          {todo.length ? todo.map(card) : <div className="ff-qa-slot">All answered — nice work.</div>}
          <div className="ff-qa-divider" aria-hidden="true"><i /><span>Answered</span><i /></div>
          {done.length ? done.map(card) : <div className="ff-qa-slot">Answered questions move here.</div>}
        </HScroll>
      </div>
      <QuestionSheet open={!!openQ} q={openQ} onClose={() => setOpenId(null)} onSaved={onSaved} />
    </>
  );
}

/* Share Card — FF Team's Add FireFlair action. Enter a number, send the
   card. Deliberately simple: no new send infrastructure, just the flow the
   spec asks for, using the existing tag/session data already on the card. */
/* Media — photos and videos on the profile itself, not tucked inside one
   skill. Photos are stored as data URLs, same as everywhere else media is
   handled in this prototype; video is a linked URL rather than an uploaded
   file, since a video blob would blow the size budget this app works within. */
/* ==========================================================================
   PROFILE FFAI — "Tell us about yourself".
   The same FFAI component as every other page, given the Profile's purpose.
   What the person writes or says becomes PROPOSED profile information
   (professions, skills, interests, locations, languages) plus Question Card
   answers; they tick what's right before anything is saved. Confirmed items
   join the one profile through RECORDS_MERGE — whether each is featured on
   the card is then chosen in the profile editor below.
   HONEST STATUS: no language model is wired up. profileFromText() is a
   phrase matcher; a live model replaces its body and keeps its output shape.
   ========================================================================== */
const PROFILE_SKILLS = [
  "Cocktail Mixology", "Flair Bartending", "Wine Pairing", "Wine Service", "Silver Service", "Fine Dining",
  "Bar Management", "Stock Control", "Batch Cocktails", "Classic Cocktails", "Customer Service",
  "Guest Relations", "Menu Design", "Live Cooking", "Canapé Service", "Banqueting", "Public Speaking",
  "Event Management", "Coffee", "Barista", "Mixing", "Beatmatching", "Photography", "Editing",
];
const reEsc = (x) => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

function profileFromText(text) {
  const raw = String(text || "");
  const t = raw.toLowerCase();
  const out = {};
  const title = (x) => x.replace(/\b\w/g, c => c.toUpperCase());
  const add = (cat, v) => {
    const val = String(v || "").trim().replace(/^(a|an|the)\s+/i, "").replace(/[.,;:!]+$/, "");
    if (!val || val.length > 40) return;
    const list = (out[cat] = out[cat] || []);
    if (!list.some(x => x.toLowerCase() === val.toLowerCase())) list.push(val);
  };
  const has = (n) => new RegExp(`\\b${reEsc(n.toLowerCase())}s?\\b`).test(t);

  PROFESSION_CATEGORIES.forEach(c => c.suggested.forEach(n => { if (has(n)) add("professions", n); }));
  PROFILE_SKILLS.forEach(n => { if (has(n)) add("skills", n); });
  Object.keys(FLAGS).forEach(l => { if (new RegExp(`\\b${l.toLowerCase()}\\b`).test(t)) add("languages", l); });
  [...Object.keys(MAP_AREAS), ...Object.keys(LOCATION_NEIGHBOURS).map(title)].forEach(a => { if (has(a)) add("locations", a); });
  const grab = (re, cat) => {
    const r = new RegExp(re, "gi"); let m;
    while ((m = r.exec(raw))) m[1].split(/,|\band\b|\//).forEach(x => add(cat, title(x.trim())));
  };
  grab("\\b(?:i love|i enjoy|i'm into|i am into|interested in|passionate about)\\s+([^.!?\\n]+)", "interests");
  grab("\\b(?:skilled in|good at|experienced in|specialise in|specialize in)\\s+([^.!?\\n]+)", "skills");
  grab("\\b(?:i work (?:in|around|across))\\s+([^.!?\\n]+)", "locations");
  /* "Cocktail Bartender" beats "Bartender"; "Central London" beats "London". */
  ["professions", "skills", "locations"].forEach(cat => {
    if (out[cat]) out[cat] = out[cat].filter(v => !out[cat].some(o => o !== v && o.toLowerCase().includes(v.toLowerCase())));
  });
  return out;
}

function ProfileFFAI() {
  const { state, dispatch } = useStore();
  const [text, setText] = useState("");
  const [found, setFound] = useState(null);
  const [picked, setPicked] = useState({});
  const onProfile = (cat, v) => recsOf(state.profile, cat).some(r => r.name.toLowerCase() === v.toLowerCase());
  const qOf = (qid) => QUESTIONS.find(q => q.id === qid);

  const run = (v) => {
    const items = [];
    Object.entries(profileFromText(v)).forEach(([cat, vals]) => vals.filter(x => !onProfile(cat, x))
      .forEach(x => items.push({ key: `${cat}:${x}`, kind: "record", cat, value: x })));
    proposeAnswersFromText(v)
      .filter(p => p.ai
        ? !(state.profile.aiQuestions || []).some(x => x.text.toLowerCase() === p.text.toLowerCase())
        : !isAnswered(answerOf(state, qOf(p.qid))))
      .forEach(p => items.push({ key: `q:${p.qid}`, kind: "answer", p }));
    setFound(items);
    setPicked(Object.fromEntries(items.map(i => [i.key, true])));
  };

  const confirm = () => {
    const chosen = found.filter(i => picked[i.key]);
    const byCategory = {};
    chosen.filter(i => i.kind === "record").forEach(i => {
      (byCategory[i.cat] = byCategory[i.cat] || []).push({ ...makeRecord(i.cat, i.value), source: { origin: "FF AI", location: "Tell us about yourself", confidence: "confirmed" } });
    });
    if (Object.keys(byCategory).length) dispatch({ type: "RECORDS_MERGE", byCategory });
    chosen.filter(i => i.kind === "answer").forEach(({ p }) => p.ai
      ? dispatch({ type: "AI_QUESTION_ADD", q: { id: uid("aiq"), text: p.text, options: ["Yes", "No"], answer: p.value, source: "FF AI" } })
      : dispatch({ type: "ANSWER", qid: p.qid, value: p.value }));
    dispatch({ type: "TOAST", toast: `${chosen.length} item${chosen.length === 1 ? "" : "s"} added to your profile` });
    setFound(null); setText(""); setPicked({});
  };

  const label = (i) => i.kind === "record" ? categoryDef(state.profile, i.cat).singular : i.p.ai ? "New Question Card" : "Question Card";
  const body = (i) => i.kind === "record" ? i.value : `${i.p.ai ? i.p.text : (qOf(i.p.qid) || {}).text} — ${i.p.value}`;

  return (
    <div id="ff-sec-ffai">
      <FFAI hero multiline tint coinSize={68} title="FFAI"
        purpose="Tell me about yourself and I'll fill out your profile."
        placeholder="I'm a cocktail bartender and floor manager in Central London. I speak English and Spanish, I'm good at wine pairing, and I love music…"
        query={text} onQuery={setText} onSubmit={run} submitLabel="Fill out my profile"
        note="Prototype: FFAI uses simple matching for now. Nothing is saved until you tick it.">
        {found && (
          <div style={{ marginTop: 14 }}>
            {found.length === 0 ? (
              <p className="ff-body" style={{ margin: 0 }}>Nothing new in there — your profile already holds it, or try a little more detail.</p>
            ) : (<>
              <p className="ff-body" style={{ margin: "0 0 10px" }}>Found {found.length} thing{found.length === 1 ? "" : "s"} for your profile — untick anything that's wrong.</p>
              {found.map(i => (
                <label key={i.key} className="ff-info" style={{ display: "flex", gap: 11, alignItems: "center", cursor: "pointer" }}>
                  <input type="checkbox" checked={!!picked[i.key]} style={{ accentColor: "var(--gold-dk)", width: 16, height: 16, flex: "none" }}
                    onChange={(e) => setPicked(x => ({ ...x, [i.key]: e.target.checked }))} />
                  {i.kind === "record" ? <CatBadge kind={categoryDef(state.profile, i.cat).icon} size={26} tone="light" /> : <CatBadge kind="skills" size={26} tone="light" />}
                  <span style={{ minWidth: 0 }}>
                    <span className="ff-label" style={{ display: "block", fontSize: 8.5 }}>{label(i)}</span>
                    <span className="ff-serif" style={{ fontSize: 15 }}>{body(i)}</span>
                  </span>
                </label>
              ))}
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 4 }}>
                <Btn variant="primary" disabled={!Object.values(picked).some(Boolean)} onClick={confirm}><Check size={13} /> Add to my profile</Btn>
                <Btn variant="ghost" onClick={() => setFound(null)}>Discard</Btn>
              </div>
              <p className="ff-body ff-muted" style={{ fontSize: 11.5, margin: "8px 0 0" }}>New items join the end of each row on your profile.</p>
            </>)}
          </div>
        )}
      </FFAI>
    </div>
  );
}

/* ADD FF (FF Team) — share your card with someone by typing their number.
   Opened from the header's Add and from under the finished card. */
function ShareCardSheet({ open, onClose }) {
  const { state, dispatch } = useStore();
  const [phone, setPhone] = useState("");
  const [sent, setSent] = useState(null);
  const [busy, setBusy] = useState(false);
  useEffect(() => { if (open) { setPhone(""); setSent(null); setBusy(false); } }, [open]);
  if (!open) return null;
  const tag = state.auth.status === "signedIn" ? (state.auth.tag || state.session.tag) : null;
  const ok = phone.replace(/\D/g, "").length >= 9;

  const send = async () => {
    if (!ok || busy) return;
    setBusy(true);
    try {
      const r = await PROFILE_ADAPTER.shareTo(tag, phone);
      setSent(r.sentTo);
      dispatch({ type: "TOAST", toast: `Card sent to ${r.sentTo}` });
    } finally { setBusy(false); }
  };

  return (
    <Sheet open onClose={onClose} title="Share your card">
      {!tag ? (<>
        <p className="ff-body" style={{ marginTop: 0 }}>Create your FF Tag first — then you can share your card.</p>
        <Btn variant="primary wide" onClick={() => {
          onClose();
          if (state.role !== "team") dispatch({ type: "ROLE", role: "team" });
          dispatch({ type: "TAB", tab: "profile" }); window.scrollTo(0, 0);
        }}><User size={14} /> Join the Team</Btn>
      </>) : sent ? (<>
        <div className="ff-frame" style={{ padding: 16, textAlign: "center" }}>
          <Check size={22} color="var(--ok)" style={{ marginBottom: 6 }} />
          <p className="ff-body" style={{ margin: 0 }}>Sent to <b>{sent}</b>.</p>
        </div>
        <div style={{ height: 10 }} />
        <Btn variant="ghost wide" onClick={() => { setSent(null); setPhone(""); }}><Plus size={13} /> Share with someone else</Btn>
      </>) : (<>
        <p className="ff-body" style={{ marginTop: 0, fontSize: 15 }}>Type someone's phone number here to share your card with them.</p>
        <Field label="Phone number">
          <input className="ff-input" type="tel" inputMode="tel" autoComplete="off" placeholder="+44 7700 900000" value={phone} autoFocus
            onChange={(e) => setPhone(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()} />
        </Field>
        <Btn variant="primary wide" disabled={!ok || busy} onClick={send}>
          {busy ? <Loader2 size={14} className="ff-spin" /> : <WhatsAppIcon size={15} />} Send my card
        </Btn>
      </>)}
    </Sheet>
  );
}
