/* Ask anyone in your network for a review/reference. If they don't have one
   posted yet, the fallback is simply to share your card with them. */
function AskForReviewSheet({ open, onClose }) {
  const { state, dispatch } = useStore();
  const all = useDirectory();
  const [picked, setPicked] = useState(null);
  useEffect(() => { if (open) setPicked(null); }, [open]);
  if (!open) return null;

  const asked = (id) => state.reviewRequests.some(r => r.fromId === id && r.aboutId === "me");
  const network = state.connections.map(c => all.find(p => p.id === c.id)).filter(Boolean);

  const ask = (person) => {
    dispatch({ type: "REVIEW_REQUEST", request: { id: uid("req"), aboutId: "me", fromId: person.id, fromName: person.name, at: Date.now() } });
    dispatch({ type: "TOAST", toast: `Asked ${person.name.split(" ")[0]} for a review` });
  };

  return (
    <Sheet open onClose={onClose} title="Ask for a review">
      <p className="ff-body" style={{ marginTop: 0 }}>
        Anyone in your network can leave you a review or a reference, whether or not you've worked an event
        together on FireFlair — most people you'd ask have worked with you somewhere.
      </p>
      {network.length === 0 ? (
        <div className="ff-frame" style={{ padding: 14, marginTop: 10 }}>
          <p className="ff-body" style={{ margin: "0 0 10px" }}>Nobody in your network yet. Share your card instead — they can send you a review once they have it.</p>
          <Btn variant="primary wide" onClick={() => { dispatch({ type: "TOAST", toast: "Link copied" }); onClose(); }}>
            <Share2 size={14} /> Share my card
          </Btn>
        </div>
      ) : network.map(p => (
        <div key={p.id} className="ff-frame" style={{ padding: 11, marginBottom: 8, display: "flex", gap: 11, alignItems: "center" }}>
          <Portrait src={p.photo} name={p.name} size={36} tier={p.tier} />
          <span style={{ flex: 1, minWidth: 0 }}>
            <span className="ff-display" style={{ fontSize: 13, display: "block" }}>{p.name}</span>
            <span className="ff-body ff-muted" style={{ fontSize: 12 }}>{p.profession}</span>
          </span>
          {asked(p.id)
            ? <Pill tone="ok">Asked</Pill>
            : <Btn variant="sm" onClick={() => ask(p)}><Send size={12} /> Ask</Btn>}
        </div>
      ))}
    </Sheet>
  );
}

/* Quick-pick: five suggested professions per display category (v1.6 §2).
   Anything else can be typed — "Add another profession". */
function ProfessionPicker({ selected = [], onPick, title = "Pick your professions" }) {
  const [cat, setCat] = useState(PROFESSION_CATEGORIES[0].key);
  const c = PROFESSION_CATEGORIES.find(x => x.key === cat);
  const has = (n) => selected.some(x => String(x).toLowerCase() === n.toLowerCase());
  return (
    <div className="ff-frame ff-goldpick" style={{ padding: 14, marginTop: 14 }}>
      <div className="ff-label" style={{ marginBottom: 8 }}>{title}</div>
      <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 6, scrollbarWidth: "none" }}>
        {PROFESSION_CATEGORIES.map(x => (
          <button key={x.key} className="ff-chip" onClick={() => setCat(x.key)} aria-pressed={x.key === cat}
            style={{ whiteSpace: "nowrap", margin: 0, flex: "none", ...(x.key === cat ? { background: "#141416", color: "#EAD79C", borderColor: "#141416" } : {}) }}>{x.key}</button>
        ))}
      </div>
      <div style={{ marginTop: 6 }}>
        {c.suggested.map(n => (
          <button key={n} className="ff-chip" onClick={() => onPick(n)}
            style={has(n) ? { background: "#5C1220", borderColor: "#5C1220", color: "#F6E7B4" } : undefined}>
            {has(n) ? "✓ " : "+ "}{n}
          </button>
        ))}
      </div>
      <p className="ff-body ff-muted" style={{ fontSize: 11.5, margin: "6px 0 0" }}>
        Your first three show on your card.
      </p>
    </div>
  );
}

/* ==========================================================================
   PROFILE CARD SYSTEM — one set of parts for every attribute.
   GenericAttributeCard          how one item looks (portrait, or landscape
                                 for venues)
   HorizontalCardRanker          left-to-right order; position decides what
                                 the Profile Card features (see cardRank)
   ProfileAttributeSection       drop-down section: cards + an add-card tile
   GenericAttributeCardCreator   the ONE sheet that adds or updates a card:
                                 title, description, images, document
   ========================================================================== */
const mapsUrl = (r) => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([r.name, r.address].filter(Boolean).join(", "))}`;

function VenueLandscapeCard({ record, onClick }) {
  const t = THEMES.onyx;
  const desc = (record.description || "").trim();
  return (
    <CardFrame as={onClick ? "button" : "div"} tier="standard" theme={t} ratio="7 / 5" onClick={onClick}
      style={{ width: CARD_W.venue, padding: "26px 16px 12px", display: "flex", flexDirection: "column", textAlign: "left" }}>
      <span style={{ position: "absolute", top: 10, left: 15, fontSize: 8.5, letterSpacing: ".14em", textTransform: "uppercase", fontWeight: 700, color: t.sub, zIndex: 4 }}>Venue</span>
      <span style={{ display: "flex", gap: 14, alignItems: "flex-start", flex: 1, minHeight: 0 }}>
        <span style={{ flex: 1, minWidth: 0 }}>
          <span style={{ display: "block", fontFamily: "var(--sans)", color: t.ink, fontSize: 15.5, fontWeight: 700, lineHeight: 1.25 }}>{record.name}</span>
          {desc && <span style={{ display: "-webkit-box", WebkitLineClamp: 3, WebkitBoxOrient: "vertical", overflow: "hidden", fontFamily: "var(--sans)", color: t.ink, opacity: .82, fontSize: 13, marginTop: 6, lineHeight: 1.4 }}>{desc}</span>}
        </span>
        <span style={{ flex: "none", maxWidth: "42%", fontFamily: "var(--sans)", color: t.sub, fontWeight: 600, fontSize: 12.5, textAlign: "right", display: "flex", gap: 5, alignItems: "flex-start" }}>
          <MapPin size={12} strokeWidth={1.6} style={{ flex: "none", marginTop: 2 }} />{record.address || "—"}
        </span>
      </span>
      <span style={{ display: "flex", alignItems: "center", paddingTop: 7, borderTop: `1px solid ${t.rule}`, marginTop: 8 }}>
        <span className="ff-label" style={{ marginLeft: "auto", fontSize: 8, color: "#EAD79C" }}>View on Google Maps →</span>
      </span>
    </CardFrame>
  );
}

/* MEDIA CARD — a title at the top, then the media itself filling the card.
   No description: the picture (or document) is the content. */
function MediaCard({ record, def, themeKey = "onyx", onClick, highlight, rank }) {
  const tier = !record.proposed && RANK_TIER[rank] || "standard";
  const t = tier !== "standard" ? RANK_THEMES[tier] : (THEMES[themeKey === "slate" ? "onyx" : themeKey] || THEMES.onyx);
  const media = record.media || [];
  const doc = record.document && record.document.name ? record.document : null;
  const lead = media[0];
  return (
    <CardFrame as={onClick ? "button" : "div"} tier={tier} theme={t} ratio="5 / 7" onClick={onClick}
      style={{ width: CARD_W.info, padding: "24px 8px 8px", display: "flex", flexDirection: "column", textAlign: "left" }}>
      <span style={{ position: "absolute", top: 10, left: 13, fontSize: 8.5, letterSpacing: ".14em", textTransform: "uppercase", fontWeight: 700, color: t.sub, zIndex: 4 }}>{def.singular}</span>
      {record.proposed && <span style={{ position: "absolute", top: 7, right: 8, zIndex: 4 }}><Pill tone="warn">Proposed</Pill></span>}
      {!record.proposed && highlight && (
        <span style={{ position: "absolute", top: 8, right: 9, zIndex: 4, color: t.accent, display: "flex" }} title="Featured">
          {rank === "primary" ? <Star size={13} fill="currentColor" /> : <Check size={13} strokeWidth={2.4} />}
        </span>
      )}
      <div style={{ fontFamily: "var(--sans)", color: t.ink, fontSize: 14.5, fontWeight: 700, lineHeight: 1.25, padding: "4px 4px 8px",
        whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{record.name}</div>
      <div style={{ flex: 1, minHeight: 0, position: "relative", borderRadius: 8, overflow: "hidden", border: `1px solid ${t.rule}`,
        background: lead ? `url("${lead.dataUrl}") center/cover` : (t.dark ? "rgba(255,255,255,.06)" : "rgba(20,20,22,.05)"),
        display: "grid", placeItems: "center", color: t.sub }}>
        {!lead && doc && (
          <span style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 8, padding: 10, textAlign: "center", minWidth: 0, maxWidth: "100%" }}>
            <FileText size={34} strokeWidth={1.3} />
            <span className="ff-serif" style={{ fontSize: 12, lineHeight: 1.25, overflowWrap: "anywhere" }}>{doc.name}</span>
          </span>
        )}
        {!lead && !doc && (
          <span style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 6, opacity: .75 }}>
            <Camera size={24} strokeWidth={1.4} />
            <span style={{ fontSize: 9, letterSpacing: ".14em", textTransform: "uppercase" }}>Add media</span>
          </span>
        )}
        {(media.length > 1 || (lead && doc)) && (
          <span style={{ position: "absolute", right: 6, bottom: 6, display: "flex", gap: 6, alignItems: "center", padding: "3px 7px", borderRadius: 999,
            background: "rgba(10,10,12,.72)", color: "#EAD79C", fontSize: 9.5 }}>
            {media.length > 1 && <><Camera size={11} strokeWidth={1.6} />{media.length}</>}
            {lead && doc && <FileText size={11} strokeWidth={1.6} />}
          </span>
        )}
      </div>
    </CardFrame>
  );
}

/* rank: "primary" | "secondary" | "tertiary" (internal only, never shown as words). */
function GenericAttributeCard({ record, def, themeKey, onClick, rank }) {
  const card = def.landscape
    ? <VenueLandscapeCard record={record} onClick={onClick} />
    : def.mediaCard
    ? <MediaCard record={record} def={def} themeKey={record.proposed ? "paper" : themeKey} onClick={onClick} highlight={rank !== "tertiary" && !record.hidden} rank={rank} />
    : <InformationCard record={record} def={def} themeKey={record.proposed ? "paper" : themeKey} onClick={onClick} highlight={rank !== "tertiary" && !record.hidden} rank={rank} />;
  if (!record.hidden) return card;
  return (
    <div style={{ position: "relative" }}>
      <div style={{ opacity: .42, filter: "grayscale(.6)" }}>{card}</div>
      <span style={{ position: "absolute", top: "42%", left: 0, right: 0, display: "flex", justifyContent: "center", pointerEvents: "none" }}>
        <Pill><EyeOff size={10} /> Hidden</Pill>
      </span>
    </div>
  );
}

/* Left-to-right ordering, kept separate so any card category can use it.
   Hidden and proposed items keep their place but never take a featured slot. */
function HorizontalCardRanker({ items, label, editable, onMove, renderCard, tail }) {
  let shown = 0;
  return (
    <HScroll label={label}>
      {items.map((r, i) => {
        const counts = !r.hidden && !r.proposed;
        const rank = counts ? cardRank(shown++) : "tertiary";
        return (
          <div key={r.id} style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {renderCard(r, rank)}
            {editable && items.length > 1 && (
              <div style={{ display: "flex", justifyContent: "center", alignItems: "center", gap: 6 }}>
                <button type="button" className="ff-move" disabled={i === 0} aria-label={`Move ${r.name} left`} title="Move left"
                  onClick={() => onMove(r.id, -1)}><ArrowLeft size={17} strokeWidth={2.2} /></button>
                <span className="ff-label" style={{ fontSize: 11, minWidth: 18, textAlign: "center" }}>{i + 1}</span>
                <button type="button" className="ff-move" disabled={i === items.length - 1} aria-label={`Move ${r.name} right`} title="Move right"
                  onClick={() => onMove(r.id, 1)}><ArrowRight size={17} strokeWidth={2.2} /></button>
              </div>
            )}
          </div>
        );
      })}
      {tail}
    </HScroll>
  );
}

function ProfileAttributeSection({ catKey, def, list, isMe, shade, onOpen, onAdd }) {
  const { state, dispatch } = useStore();
  const items = isMe ? list : list.filter(r => !r.hidden && !r.proposed);
  if (!isMe && !items.length) return null;
  const v = state.categoryVisibility[`attr_${catKey}`];
  const startOpen = items.length > 0 || (isMe && catKey === "professions");
  const open = v === undefined ? startOpen : v !== false;
  const unresolved = isMe && catKey === "professions" ? items.find(r => !r.proposed && !r.hidden && !professionCategory(r.name, r.displayCategory)) : null;
  const addTile = isMe && !def.system && (
    <button className="ff-card ff-addtile" aria-label={`Add ${def.singular.toLowerCase()}`} onClick={onAdd}
      style={def.landscape ? { width: CARD_W.venue, aspectRatio: "7 / 5" } : { width: CARD_W.info, aspectRatio: "5 / 7" }}>
      <span style={{ textAlign: "center" }}>
        <span style={{ display: "grid", placeItems: "center", width: 42, height: 42, margin: "0 auto", border: "1px solid var(--gold-dk)", borderRadius: 12 }}><Plus size={20} color="var(--gold-dk)" /></span>
        <span className="ff-label" style={{ display: "block", marginTop: 8 }}>Add {def.singular.toLowerCase()}</span>
      </span>
    </button>
  );
  return (
    <section id={isMe ? `ff-sec-${catKey}` : undefined} style={{ marginTop: 22 }}>
      <SectionHead icon={<CatIcon kind={def.icon} size={15} color="var(--gold-dk)" />} title={def.label} count={items.filter(r => !r.hidden).length}
        action={<CategoryToggle sectionKey={`attr_${catKey}`} defaultOpen={startOpen} />} />
      {open && (<>
        {unresolved && (
          <div className="ff-frame" style={{ padding: 12, marginBottom: 10 }}>
            <div style={{ display: "flex", gap: 9, alignItems: "center", marginBottom: 8 }}>
              <Coin size={22} tier="gold" />
              <span className="ff-body" style={{ fontSize: 13 }}><b>FF AI:</b> which category is “{unresolved.name}”? It decides where you appear on Network.</span>
            </div>
            <div>
              {PROFESSION_CATEGORIES.map(c => (
                <button key={c.key} className="ff-chip" onClick={() => {
                  dispatch({ type: "REC_PATCH", category: "professions", id: unresolved.id, patch: { displayCategory: c.key } });
                  dispatch({ type: "TOAST", toast: `${unresolved.name} → ${c.key}` });
                }}>{c.key}</button>
              ))}
            </div>
          </div>
        )}
        {isMe && catKey === "professions" && (
          <ProfessionPicker selected={items.map(r => r.name)} onPick={(n) => {
            if (items.some(r => r.name.toLowerCase() === n.toLowerCase())) { dispatch({ type: "TOAST", toast: `${n} is already on your profile` }); return; }
            dispatch({ type: "RECORDS_MERGE", byCategory: { professions: [makeRecord("professions", n)] } });
            dispatch({ type: "TOAST", toast: `${n} added` });
          }} />
        )}
        <div style={{ height: isMe && catKey === "professions" ? 12 : 0 }} />
        <HorizontalCardRanker items={items} label={def.label} editable={isMe && !def.system}
          onMove={(id, dir) => dispatch({ type: "REC_MOVE", category: catKey, id, dir })}
          renderCard={(r, rank) => <GenericAttributeCard record={r} def={def} themeKey={shade} rank={rank} onClick={() => onOpen(r)} />}
          tail={addTile} />
      </>)}
    </section>
  );
}

/* One creator for every attribute. With no `record` it adds a new card;
   with one it updates that card in place (changes save as you type). */
function ProfessionLevelPicker({ value, onChange }) {
  return (
    <div className="ff-levels" role="radiogroup" aria-label="Profession level">
      {PROFESSION_LEVELS.map(l => {
        const on = value === l.n;
        return (
          <button key={l.n} type="button" role="radio" aria-checked={on} className={on ? "on" : ""}
            onClick={() => onChange(on ? null : l.n)} title={`Level ${l.n} · ${l.title}`}>
            <b>{l.n}</b><span>{l.title}</span>
          </button>
        );
      })}
    </div>
  );
}

function GenericAttributeCardCreator({ open, record, def, category, readOnly, onClose }) {
  const { state, dispatch } = useStore();
  const adding = !record;
  const [draft, setDraft] = useState(record);
  const [busy, setBusy] = useState(null);
  const mediaRef = useRef(null);
  const docRef = useRef(null);

  useEffect(() => { if (open) { setDraft(record || makeRecord(category, "")); setBusy(null); } }, [open, record && record.id, category]);
  if (!open || !def || !draft) return null;
  const live = adding ? draft : (recsOf(state.profile, category).find(r => r.id === record.id) || draft);

  const patch = (p) => {
    setDraft(d => ({ ...d, ...p }));
    if (!readOnly && !adding) dispatch({ type: "REC_PATCH", category, id: record.id, patch: p });
  };

  const addMedia = async (file) => {
    if (!file) return;
    if ((draft.media || []).length >= MAX_MEDIA_PER_CARD) { setBusy(`Each card holds up to ${MAX_MEDIA_PER_CARD} images.`); return; }
    if (file.size > MAX_MEDIA_BYTES) { setBusy(`That image is ${prettyBytes(file.size)} — keep it under ${prettyBytes(MAX_MEDIA_BYTES)}.`); return; }
    setBusy("Adding…");
    try {
      const dataUrl = await readFileAsDataUrl(file);
      patch({ media: [...(draft.media || []), { id: uid("med"), name: file.name, dataUrl }] });
      setBusy(null);
    } catch (e) { setBusy(e.message); }
  };

  const addDoc = async (file) => {
    if (!file) return;
    setBusy("Attaching…");
    try {
      const big = file.size > MAX_MEDIA_BYTES;
      const dataUrl = big ? null : await readFileAsDataUrl(file);
      patch({ document: { name: file.name, size: file.size, type: file.type || "application/pdf", dataUrl } });
      setBusy(big ? "Attached by reference — too large to store in this prototype, so it can't be reopened here." : null);
    } catch (e) { setBusy(e.message); }
  };

  const commit = () => {
    const rec = { ...draft, name: draft.name.trim(), description: (draft.description || "").trim() };
    const taskId = xpTaskFor(category);
    const fresh = XP_TASKS.some(t => t.id === taskId) && !(state.profile.xpClaimed || []).includes(taskId);
    dispatch({ type: "REC_ADD", category, record: rec });
    dispatch({ type: "TOAST", toast: fresh ? `${def.singular} added · +${XP_VALUES.task} XP` : `${def.singular} added` });
    onClose();
  };

  const doc = draft.document;
  const one = def.singular.toLowerCase();

  return (
    <Sheet open onClose={onClose} title={adding ? `Add ${one}` : def.singular}>
      {adding && category === "professions" && (
        <ProfessionPicker title="Suggested professions" selected={[draft.name, ...recsOf(state.profile, "professions").map(r => r.name)]}
          onPick={(n) => patch({ name: n })} />
      )}

      <Field label="Title">
        {readOnly
          ? <div className="ff-display" style={{ fontSize: 17 }}>{draft.name}</div>
          : <input className="ff-input" style={{ fontSize: 17 }} value={draft.name} autoFocus={adding && category !== "professions"}
              onChange={(e) => patch({ name: e.target.value })} placeholder={def.placeholder || def.singular} />}
      </Field>

      {draft.proposed && (
        <div className="ff-frame" style={{ padding: 12, marginBottom: 14 }}>
          <p className="ff-body" style={{ margin: "0 0 10px" }}>Proposed from your CV — nothing is on your profile until you accept it.</p>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            <Btn variant="primary" onClick={() => { dispatch({ type: "REC_ACCEPT", category, id: record.id }); patch({ proposed: false }); }}>
              <Check size={13} /> Accept
            </Btn>
            <Btn variant="danger" onClick={() => { dispatch({ type: "REC_DELETE", category, id: record.id }); onClose(); }}>Reject</Btn>
          </div>
        </div>
      )}

      {/* Profession level: only ever seen by the owner, while editing */}
      {category === "professions" && !readOnly && (
        <div className="ff-field">
          <span className="ff-label" style={{ display: "block", marginBottom: 7 }}>Level</span>
          <ProfessionLevelPicker value={draft.level || null} onChange={(n) => patch({ level: n })} />
          <span className="ff-body ff-muted" style={{ fontSize: 12, display: "block", marginTop: 7 }}>
            Profession level helps FireFlair connect Masters with Apprentices for training and development.
          </span>
        </div>
      )}

      {catHas(def, "proficiency") && (
        <Field label="Level">
          {readOnly ? <div className="ff-serif" style={{ fontSize: 16 }}>{draft.proficiency || "Not stated"}</div> : (
            <select className="ff-input" value={draft.proficiency || ""} onChange={(e) => patch({ proficiency: e.target.value })}>
              <option value="">Not stated</option>
              {PROFICIENCY.map(p => <option key={p} value={p}>{p}</option>)}
            </select>
          )}
        </Field>
      )}

      {catHas(def, "address") && (
        <Field label="Location">
          {readOnly ? <div className="ff-serif" style={{ fontSize: 16 }}>{draft.address || "—"}</div>
            : <input className="ff-input" value={draft.address || ""} onChange={(e) => patch({ address: e.target.value })} placeholder="Street, area or postcode" />}
          {draft.name.trim() && (
            <a className="ff-btn sm" href={mapsUrl(draft)} target="_blank" rel="noopener noreferrer" style={{ textDecoration: "none", marginTop: 8 }}>
              <MapPin size={12} /> View on Google Maps →
            </a>
          )}
        </Field>
      )}

      {!def.mediaCard && (
      <Field label="Description">
        {readOnly
          ? <p className="ff-serif" style={{ fontSize: 16, lineHeight: 1.5, margin: 0 }}>{draft.description || "Nothing written yet."}</p>
          : <textarea className="ff-input" rows={5} value={draft.description || ""}
              onChange={(e) => patch({ description: e.target.value })} />}
      </Field>
      )}

      <div style={{ marginBottom: 16 }}>
        <div className="ff-label" style={{ marginBottom: 8 }}>Media</div>
        {(draft.media || []).length > 0 && (
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
            {draft.media.map(m => (
              <span key={m.id} style={{ position: "relative", width: 84, height: 84, border: "1px solid var(--rule)", overflow: "hidden", background: `url("${m.dataUrl}") center/cover` }}>
                {!readOnly && (
                  <button aria-label={`Remove ${m.name}`}
                    onClick={() => patch({ media: draft.media.filter(x => x.id !== m.id) })}
                    style={{ position: "absolute", top: 2, right: 2, background: "rgba(12,12,14,.82)", color: "#EAD79C", width: 20, height: 20, display: "grid", placeItems: "center" }}>
                    <X size={12} />
                  </button>
                )}
              </span>
            ))}
          </div>
        )}
        {doc && (
          <div className="ff-frame" style={{ padding: 10, display: "flex", gap: 11, alignItems: "center", marginBottom: 10 }}>
            <span style={{ width: 30, height: 30, flex: "none", background: "#5C1220", display: "grid", placeItems: "center" }}>
              <FileText size={15} color="#EAD79C" strokeWidth={1.6} />
            </span>
            <span style={{ flex: 1, minWidth: 0 }}>
              <span className="ff-serif" style={{ fontSize: 14, display: "block", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{doc.name}</span>
              <span className="ff-body ff-muted" style={{ fontSize: 11 }}>{doc.size ? prettyBytes(doc.size) : "Attached"}</span>
            </span>
            {doc.dataUrl && <a className="ff-btn sm ghost" href={doc.dataUrl} target="_blank" rel="noopener noreferrer" style={{ textDecoration: "none" }} aria-label="Open document"><Eye size={12} /></a>}
            {!readOnly && <button className="ff-btn sm ghost" aria-label="Remove document" onClick={() => patch({ document: null })}><X size={12} /></button>}
          </div>
        )}
        {readOnly && !(draft.media || []).length && !doc && <p className="ff-body ff-muted" style={{ margin: 0 }}>None.</p>}
        {!readOnly && (
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <input ref={mediaRef} type="file" accept="image/*" style={{ display: "none" }}
              onChange={(e) => { addMedia(e.target.files?.[0]); e.target.value = ""; }} />
            <input ref={docRef} type="file" accept=".pdf,.doc,.docx,.txt,application/pdf" style={{ display: "none" }}
              onChange={(e) => { addDoc(e.target.files?.[0]); e.target.value = ""; }} />
            <Btn variant="sm" disabled={(draft.media || []).length >= MAX_MEDIA_PER_CARD} onClick={() => mediaRef.current?.click()}><Camera size={12} /> Image {(draft.media || []).length}/{MAX_MEDIA_PER_CARD}</Btn>
            <Btn variant="sm" onClick={() => docRef.current?.click()}><FileText size={12} /> {doc ? "Replace document" : "Document"}</Btn>
          </div>
        )}
      </div>

      {!adding && !readOnly && category === "professions" && (
        <Field label="Display category">
          <select className="ff-input" value={professionCategory(draft.name, draft.displayCategory) || ""}
            onChange={(e) => patch({ displayCategory: e.target.value || undefined })}>
            <option value="">Not sure yet</option>
            {PROFESSION_CATEGORIES.map(c => <option key={c.key} value={c.key}>{c.key}</option>)}
          </select>
        </Field>
      )}

      {busy && <p className="ff-body ff-muted" style={{ fontSize: 12 }}>{busy}</p>}

      {!readOnly && adding && (
        <Btn variant="primary wide" disabled={!draft.name.trim()} onClick={commit}><Plus size={14} /> Add {one}</Btn>
      )}
      {!readOnly && !adding && !draft.proposed && (<>
        <Btn variant="primary wide" disabled={!draft.name.trim()} onClick={onClose}><Check size={14} /> Update {one}</Btn>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 12 }}>
          <button className="ff-btn sm ghost" onClick={() => { patch({ hidden: !live.hidden }); dispatch({ type: "TOAST", toast: live.hidden ? `${draft.name} shown again` : `${draft.name} hidden — still on your profile` }); }}>
            {live.hidden ? <><Eye size={12} /> Show {one}</> : <><EyeOff size={12} /> Hide {one}</>}
          </button>
          <button className="ff-link" style={{ fontSize: 11, color: "#5E574C", textDecoration: "underline", background: "none" }}
            onClick={() => { dispatch({ type: "REC_DELETE", category, id: record.id }); onClose(); }}>Delete</button>
        </div>
      </>)}
    </Sheet>
  );
}

/* Q&A on someone else's profile — always the last section. "Ask a
   question" adds a Question Card to their profile; they answer it, or FF AI
   answers from what they've told FireFlair. Prototype: saved here, nothing
   is sent, and answers aren't generated yet. */
function PublicQA({ person }) {
  const { state } = useStore();
  const [asking, setAsking] = useState(false);
  const first = String(person.name || "").split(" ")[0] || "them";
  const asked = (state.profileQuestions || []).filter(q => q.personId === person.id);
  return (
    <section id="ff-public-qa" style={{ marginTop: 26 }}>
      <SectionHead icon={<MessageSquare size={15} color="var(--gold-dk)" strokeWidth={1.6} />} title="Q&A" count={asked.length} />
      {asked.length > 0 ? (
        <HScroll label="Q&A" snap>
          {asked.map(q => (
            <QuestionCard key={q.id} q={{ text: q.text, group: "asked" }} answer={q.answer} label="Your question" pending={`Sent to ${first}`} />
          ))}
        </HScroll>
      ) : (
        <p className="ff-body ff-muted" style={{ margin: "0 0 2px", fontSize: 13.5 }}>No questions yet.</p>
      )}
      <div style={{ marginTop: 12 }}>
        <Btn variant="wide" onClick={() => setAsking(true)}><MessageSquare size={14} /> Ask a question</Btn>
      </div>
      <AskQuestionSheet open={asking} person={person} onClose={() => setAsking(false)} />
    </section>

}

function AskQuestionSheet({ open, person, onClose }) {
  const { state, dispatch } = useStore();
  const [text, setText] = useState("");
  useEffect(() => { if (open) setText(""); }, [open]);
  if (!open || !person) return null;
  const first = String(person.name || "").split(" ")[0] || "them";
  const ok = text.trim().length >= 5;
  const send = () => {
    if (!ok) return;
    dispatch({ type: "ASK_QUESTION", q: { id: uid("ask"), personId: person.id, text: text.trim(), askedAt: Date.now(), by: state.session.tag || null, answer: null } });
    dispatch({ type: "TOAST", toast: `Question added to ${first}'s profile` });
    onClose();
  };
  return (
    <Sheet open onClose={onClose} title="Ask a question">
      <Field label={`Your question for ${first}`}>
        <textarea className="ff-input" rows={3} autoFocus value={text} onChange={(e) => setText(e.target.value)}
          placeholder="Do you run cocktail masterclasses?" style={{ resize: "vertical" }} />
      </Field>
      <Btn variant="primary wide" disabled={!ok} onClick={send}><Send size={14} /> Ask {first}</Btn>
      <p className="ff-body ff-muted" style={{ fontSize: 12, margin: "10px 0 0" }}>It's added to {first}'s profile as a Question Card. In this preview nothing is sent.</p>
    </Sheet>
  );
}

function ProfileSections({ person, isMe, hideQuestions }) {
  const { state, dispatch } = useStore();
  const all = useDirectory();
  const [openRec, setOpenRec] = useState(null);
  const [addingTo, setAddingTo] = useState(null);
  const [asking, setAsking] = useState(false);
  const shade = "onyx";

  const records = recordsForPerson(state, person);
  const cats = BASE_CATEGORIES;
  const order = categoryOrder().filter(k => !cats[k].system);
  const reviewList = records.reviews || [];
  const reviewDef = cats.reviews || BASE_CATEGORIES.reviews;
  const pendingRequests = isMe
    ? state.reviewRequests.filter(r => r.aboutId === "me" && !state.reviews.some(rv => rv.aboutId === "me" && rv.byId === r.fromId))
    : [];
  const pendingCount = pendingRequests.length;

  const mine = isMe ? myNetwork(state, all) : null;
  const network = isMe ? mine.list : all.filter(p => p.id !== person.id && p.id !== "me").slice(0, 6);

  const focusHandlers = {
    reviews: () => { dispatch({ type: "TOGGLE_CATEGORY", key: "reviews", visible: true }); setAsking(true); },
    questions: () => dispatch({ type: "TOGGLE_CATEGORY", key: "questions", visible: true }),

  order.forEach(k => { focusHandlers[k] = () => setAddingTo(k); });
  useProfileFocus(focusHandlers, isMe);

  const renderCategorySection = (catKey) => (
    <ProfileAttributeSection key={catKey} catKey={catKey} def={cats[catKey]} list={records[catKey] || []} isMe={isMe} shade={shade}
      onOpen={(r) => setOpenRec({ record: r, def: cats[catKey], category: catKey })}
      onAdd={() => setAddingTo(catKey)} />
  );

  const networkSection = (
      <section style={{ marginTop: 26 }}>
        <SectionHead icon={<Users size={15} color="var(--gold-dk)" strokeWidth={1.6} />} title="Network" count={network.length}

        {state.categoryVisibility.profile_network !== false && (
        <HScroll label="Network" snap>
          {network.map(p => <NetworkTile key={p.id} person={p} invited={!!(mine && mine.inviter && mine.inviter.id === p.id)} onClick={() => dispatch({ type: "VIEW", id: p.id })} />)}

              <span style={{ textAlign: "center" }}><Plus size={20} color="var(--gold-dk)" />

  const reviewsSection = (
      <section id={isMe ? "ff-sec-reviews" : undefined} style={{ marginTop: 22 }}>
        <SectionHead icon={<CatIcon kind="reviews" size={15} color="var(--gold-dk)" />} title="Reviews & References" count={reviewList.length}
          action={
            <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
              {isMe && <button className="ff-btn sm ghost" onClick={() => setAsking(true)}>Ask</button>}
              <CategoryToggle sectionKey="reviews" defaultOpen={reviewList.length > 0 || pendingCount > 0} />
            </span>
          } />
        {(state.categoryVisibility.reviews === undefined ? !(reviewList.length || pendingCount) : state.categoryVisibility.reviews === false) ? null : (reviewList.length || (isMe && pendingCount > 0)) ? (
          <HScroll label="Reviews & References">
            {reviewList.map((r, i) => (
              <InformationCard key={r.id} record={r} def={reviewDef} themeKey={shade} highlight={i < 3}
                onClick={() => setOpenRec({ record: r, def: reviewDef, category: "reviews" })} />
            ))}
            {isMe && pendingRequests.map(req => (
              <div key={req.id} className="ff-tile" style={{ width: CARD_W.info, minHeight: 140, justifyContent: "center", alignItems: "center", textAlign: "center", gap: 6 }}>

              <button className="ff-card ff-addtile" style={{ width: CARD_W.info, minHeight: 140 }} onClick={() => setAsking(true)}>

            <span style={{ textAlign: "center" }}><Plus size={18} color="var(--gold-dk)" />

function PersonProfile() {
  const { state, dispatch } = useStore();
  const all = useDirectory();
  const person = all.find(p => p.id === state.viewing);
  const connected = state.connections.some(c => c.id === state.viewing);
  const [reviewing, setReviewing] = useState(false);
  if (!person) return null;
  const acts = {
    onBook: () => { if (!state.selection.includes(person.id)) dispatch({ type: "SELECT", id: person.id }); dispatch({ type: "TOAST", toast: `${person.name.split(" ")[0]} added to your basket` }); },
    onReview: () => setReviewing(true),
    onJoin: () => {
      if (state.auth.status === "signedIn" || person.id === "me") { dispatch({ type: "TOAST", toast: "Share this card so they can join FireFlair" }); return; }
      dispatch({ type: "SESSION", patch: { invitedBy: person.id } });
      dispatch({ type: "VIEW", id: null });
      if (state.role !== "team") dispatch({ type: "ROLE", role: "team" });
      dispatch({ type: "TAB", tab: "profile" });
      dispatch({ type: "TOAST", toast: `Joining with ${person.name.split(" ")[0]} — your first connection` });
      window.scrollTo(0, 0);
    },
  };
  const other = person.id !== "me";

  return (
    <div>
      <button aria-label="Back" onClick={() => dispatch({ type: "VIEW", id: null })}
        style={{
          display: "flex", alignItems: "center", justifyContent: "center", gap: 8,

        <span style={{ fontSize: 12, letterSpacing: ".14em", textTransform: "uppercase", fontWeight: 600 }}>Back</span>
      </button>
      <PlayerCard person={person} format="full" themeKey={person.id === "me" ? state.profile.theme : (person.theme || "ivory")} actions={person.id === "me" ? acts : undefined} />
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 16 }}>
        <Btn variant={connected ? "ghost" : "primary"} disabled={connected}
          onClick={() => dispatch({ type: "CONNECT", people: [{ id: person.id, name: person.name, note: person.profession, onFF: true, tag: person.tag }] })}>
          {connected ? <><Check size={14} /> Added</> : <><Plus size={14} /> Add to team</>}
        </Btn>
        <Btn onClick={() => setReviewing(true)}><Award size={14} /> Review</Btn>
      </div>
      {person.id !== "me" && state.role !== "team" && (
        <div style={{ marginTop: 8 }}>
          <Btn variant={state.selection.includes(person.id) ? "ghost wide" : "wide"} onClick={() => {
            dispatch({ type: "SELECT", id: person.id });
            dispatch({ type: "TOAST", toast: state.selection.includes(person.id) ? `${person.name} removed from your basket` : `${person.name} added to your basket` });
          }}>
            {state.selection.includes(person.id) ? <><Check size={14} /> In your basket</> : <><Users size={14} /> Add to basket</>}
          </Btn>
        </div>
      )}
      <ProfileSections person={person} isMe={person.id === "me"} />
      {other && <div style={{ maxWidth: 372, margin: "26px auto 0" }}><ProfileActions actions={acts} /></div>}
      <ReviewSheet open={reviewing} person={person} onClose={() => setReviewing(false)} />
    </div>
  );
}

/* INVITES. Every new FireFlair user starts with one Network connection: the
   person who brought them in. That's whoever's invite link they arrived on,
   or — if they were browsing — whoever's profile they tapped Join on.
   Prototype: everyone arrives on Don Gee's link (DONGE). Live, the tag comes
   from the link itself. */
const INVITE_LINK_TAG = "DONGE";
function inviterOf(state, people) {
  const id = state.session.invitedBy;
  if (id) return people.find(p => p.id === id) || null;
  const ref = String(state.session.refTag || "").toLowerCase();
  return ref ? people.find(p => String(p.tag || "").toLowerCase() === ref) || null : null;
}
/* My Network: the inviter first, then everyone I've connected with. */
function myNetwork(state, people) {
  const inv = inviterOf(state, people);
  const rest = state.connections.map(c => people.find(p => p.id === c.id)).filter(Boolean).filter(p => !inv || p.id !== inv.id);
  return { inviter: inv, list: inv ? [inv, ...rest] : rest };
}
function NetworkTile({ person, invited, onClick }) {
  if (!invited) return <PlayerTile person={person} onClick={onClick} />;
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
      <PlayerTile person={person} onClick={onClick} />
      <span className="ff-invited"><Star size={11} fill="currentColor" /> Invited you</span>
    </div>
  );
}

function ChipEdit({ values, onChange, placeholder, flags, ink, rule, leadFirst }) {
  const [t, setT] = useState("");
  const add = () => { const v = t.trim().replace(/,$/, ""); if (!v) return; if (!values.includes(v)) onChange([...values, v]); setT(""); };
  return (
    <div>
      {values.length > 0 && (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 5, marginBottom: 6 }}>
          {values.map((v, i) => (
            <span key={v + i} className={`ff-tagchip${leadFirst && i === 0 ? " lead" : ""}`} style={{ color: ink }}>
              {flags && <span style={{ fontSize: 14 }}>{flagFor(v)}</span>}{v}
              <button onClick={() => onChange(values.filter((_, j) => j !== i))} aria-label={`Remove ${v}`} style={{ color: ink }}><X size={11} /></button>
            </span>
          ))}
        </div>
      )}
      <input className="ff-cardin" value={t} placeholder={placeholder} style={{ color: ink, borderBottomColor: rule }}
        onChange={(e) => setT(e.target.value)} onBlur={add}
        onKeyDown={(e) => { if (e.key === "Enter" || e.key === ",") { e.preventDefault(); add(); } }} />
    </div>
  );
}

/* Consume a FF-sheet focus request: scroll to #ff-sec-<target> and run the
   matching handler (e.g. open the Add sheet). One consumer is mounted at a
   time — whichever Profile screen is showing. */
function useProfileFocus(handlers, enabled = true) {
  const { state, dispatch } = useStore();
  useEffect(() => {
    const f = state.focus;
    if (!enabled || !f) return;
    const el = document.getElementById(`ff-sec-${f.target}`);
    setTimeout(() => {
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      else window.scrollTo({ top: 0, behavior: "smooth" });
    }, 60);
    const h = handlers[f.target] || handlers._any;
    if (h) h(f.target);
    dispatch({ type: "FOCUS", focus: null });
  }, [state.focus, enabled]);
}

/* Write the card editor's draft into the real profile records — the one
   profile, never a copy. Names are matched to existing records so their
   descriptions, media and documents are kept. */
function syncCardRecords(state, dispatch, d, cats = ["professions", "skills", "interests", "locations", "languages"]) {
  cats.forEach(cat => {
    const existing = recsOf(state.profile, cat);
    const wasOnCard = primaryNames(state.profile, cat, FEATURE_LIMIT).map(n => n.toLowerCase());
    const want = (d[cat] || []).filter(Boolean);
    const has = (n) => want.some(v => v.toLowerCase() === n.toLowerCase());
    const front = want.map(v => {
      const match = existing.find(r => r.name.toLowerCase() === v.toLowerCase());
      return match ? { ...match, name: v, hidden: false } : makeRecord(cat, v);
    });
    const rest = existing.filter(r => !has(r.name))
      .map(r => (!r.proposed && wasOnCard.includes(r.name.toLowerCase())) ? { ...r, hidden: true } : r);
    dispatch({ type: "REC_BULK", category: cat, list: [...front, ...rest] });
  });
}

function GroupedPeople({ onPick, selectable, scope = "", query = "" }) {

/* Peak dates: the busiest nights of the year. Saying yes puts the person
   first in line for shifts on the dates they pick. */
const isoDays = (from, to) => { const out = []; for (let d = new Date(from + "T12:00:00"); d <= new Date(to + "T12:00:00"); d.setDate(d.getDate() + 1)) out.push(d.toISOString().slice(0, 10)); return out; };
const PEAK_DATES = [
  { key: "halloween", icon: "🎃", q: "Are you available for Halloween bookings?", dates: isoDays("2026-10-29", "2026-11-01") },
  { key: "christmas", icon: "🎄", q: "Are you available for Christmas bookings?", dates: isoDays("2026-12-01", "2026-12-24"), grid: true },
  { key: "nye", icon: "🥂", q: "Are you available on New Year's Eve?", dates: ["2026-12-31", "2027-01-01"] },
];
const WEEKDAY = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const chipDate = (iso) => { const d = new Date(iso + "T12:00:00"); return { wd: WEEKDAY[d.getDay()], day: d.getDate(), mon: MONTHS[d.getMonth()].slice(0, 3) }; };

function PeakAvailability() {
  const { state, dispatch } = useStore();
  const peak = state.profile.peak || {};
  const set = (key, patch) => dispatch({ type: "PROFILE", patch: { peak: { ...peak, [key]: { ...(peak[key] || {}), ...patch } } } });
  return (
    <div style={{ display: "grid", gap: 12 }}>
      {PEAK_DATES.map(pk => {
        const cur = peak[pk.key] || {};
        const picked = cur.dates || [];
        const toggle = (iso) => set(pk.key, { dates: picked.includes(iso) ? picked.filter(x => x !== iso) : [...picked, iso].sort() });
        return (
          <div key={pk.key} className="ff-panel">
            <div style={{ display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap" }}>
              <span style={{ fontSize: 24 }} aria-hidden="true">{pk.icon}</span>
              <span style={{ flex: 1, minWidth: 200, fontWeight: 700, fontSize: 15.5, color: "#16130F" }}>{pk.q}</span>
              <span className="ff-seg" role="group" aria-label={pk.q}>
                <button type="button" aria-pressed={cur.answer === "yes"} onClick={() => set(pk.key, { answer: "yes", dates: picked.length ? picked : pk.dates.slice() })}>Yes</button>
                <button type="button" aria-pressed={cur.answer === "no"} onClick={() => set(pk.key, { answer: "no", dates: [] })}>No</button>
              </span>
            </div>
            {cur.answer === "yes" && (<>
              <p className="ff-body" style={{ margin: "12px 0 8px", fontSize: 13 }}>Tap the dates you're free — {picked.length} selected.</p>
              <div className={pk.grid ? "ff-dategrid" : ""} style={pk.grid ? undefined : { display: "flex", gap: 8, flexWrap: "wrap" }}>
                {pk.dates.map(iso => { const c = chipDate(iso); const on = picked.includes(iso); return (
                  <button key={iso} type="button" className={`ff-datechip${on ? " on" : ""}`} aria-pressed={on} onClick={() => toggle(iso)}>
                    <small>{c.wd}</small><b>{c.day}</b><small>{c.mon}</small>
                  </button>
                ); })}
              </div>
            </>)}
            {cur.answer === "yes" && picked.length > 0 && (
              <p className="ff-body" style={{ margin: "10px 0 0", fontSize: 12.5, color: "#5C1220", fontWeight: 600 }}><Star size={12} fill="currentColor" /> You're on the priority list for these dates.</p>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* Shift requests: where people would love to work. Festivals 2027 first. */
const FESTIVAL_SUGGESTIONS = ["Glastonbury", "Reading & Leeds", "Creamfields", "Boomtown", "Latitude", "Download", "Wireless", "Isle of Wight", "Camp Bestival", "BST Hyde Park"];
function ShiftRequests() {
  const { state, dispatch } = useStore();
  const reqs = state.profile.shiftRequests || {};
  const list = reqs.festivals2027 || [];
  const [v, setV] = useState("");
  const save = (next) => dispatch({ type: "PROFILE", patch: { shiftRequests: { ...reqs, festivals2027: next } } });
  const add = (name) => {
    const n = String(name || "").trim();
    if (!n || list.some(x => x.toLowerCase() === n.toLowerCase())) { setV(""); return; }
    save([...list, n]); setV("");
  };
  return (
    <div className="ff-panel ff-champagne">
      <div style={{ fontWeight: 700, fontSize: 16, color: "#16130F" }}>Festivals 2027</div>
      <p className="ff-body" style={{ margin: "4px 0 12px", fontSize: 13.5 }}>Which festivals would you like to work at? Type a name, or tap one below.</p>
      <div style={{ display: "flex", gap: 8 }}>
        <input className="ff-input" value={v} onChange={(e) => setV(e.target.value)} onKeyDown={(e) => e.key === "Enter" && add(v)} placeholder="Festival name" aria-label="Festival name" />
        <Btn variant="primary" disabled={!v.trim()} onClick={() => add(v)}><Plus size={14} /> Add</Btn>
      </div>
      {list.length > 0 && (
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 12 }}>
          {list.map(f => (
            <span key={f} className="ff-chip" style={{ background: "#5C1220", color: "#F6E7B4", borderColor: "#5C1220", display: "inline-flex", alignItems: "center", gap: 6, margin: 0 }}>
              {f}<button type="button" aria-label={`Remove ${f}`} onClick={() => save(list.filter(x => x !== f))} style={{ color: "inherit", display: "flex" }}><X size={12} /></button>
            </span>
          ))}
        </div>
      )}
      <div style={{ marginTop: 12 }}>
        {FESTIVAL_SUGGESTIONS.filter(f => !list.includes(f)).map(f => (
          <button key={f} type="button" className="ff-chip" onClick={() => add(f)}>+ {f}</button>
        ))}
      </div>
    </div>
  );
}

function TeamBookings({ guest = false }) {
  const { state, dispatch } = useStore();
  const [open, setOpen] = useState(null);
  const [q, setQ] = useState("");
  const BOOKED = ["confirmed", "completed", "signed_off", "paid"];
  const all = guest ? [] : state.engagements.filter(e => e.staffId === "me")
    .map(e => { const shift = state.shifts.find(s2 => s2.id === e.shiftId); return { e, shift, event: shift && state.events.find(v => v.id === shift.eventId) }; })
    .filter(x => x.shift).map(x => ({ ...x, iso: x.shift.iso }));
  const n = q.trim().toLowerCase();
  const match = (x) => !n || [x.shift.role, x.shift.venue, x.shift.date, x.event?.title].join(" ").toLowerCase().includes(n);
  const booked = all.filter(x => BOOKED.includes(x.e.state) && match(x)).sort((a, b) => String(a.iso).localeCompare(String(b.iso)));
  const requests = all.filter(x => x.e.state === "requested" && match(x)).sort((a, b) => String(a.iso).localeCompare(String(b.iso)));
  const answered = all.filter(x => ["available", "unavailable", "expired"].includes(x.e.state) && match(x));
  const jump = (id) => { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); };
  const partyHidden = state.profile.partyHidden || [];
  const toggleParty = (id) => dispatch({ type: "PROFILE", patch: { partyHidden: partyHidden.includes(id) ? partyHidden.filter(x => x !== id) : [...partyHidden, id] } });
  const services = PARTY_SERVICES.map(sv => ({ ...sv, name: sv.title, hidden: partyHidden.includes(sv.id) }));
  const goProfile = () => { dispatch({ type: "ROLE", role: "team" }); dispatch({ type: "TAB", tab: "profile", route: "home" }); window.scrollTo(0, 0); };
  const respond = (x, st) => {
    dispatch({ type: "ENG_STATE", id: x.e.id, state: st });
    dispatch({ type: "TOAST", toast: st === "confirmed" ? `Confirmed — ${x.shift.role}, ${x.shift.date}. Now in your bookings.` : "Declined — the company has been told." });
  };

  const Req = ({ x, done }) => (
    <div className="ff-shiftrow" style={{ opacity: done ? .62 : 1 }}>
      <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
        <span style={{ background: "#5C1220", color: "#EAD79C", fontFamily: "var(--display)", fontSize: 11, letterSpacing: ".1em", padding: "5px 8px", whiteSpace: "nowrap" }}>{dayLabel(x.shift.iso)}</span>
        <span style={{ flex: 1, minWidth: 0 }}>
          <span className="ff-display" style={{ fontSize: 13.5, display: "block" }}>{x.shift.role}</span>
          <span className="ff-body ff-muted" style={{ fontSize: 12 }}>{x.event ? `${x.event.title} · ` : ""}{x.shift.venue} · {x.shift.time}</span>
        </span>
        {done ? <Pill tone={ENG_TONE[x.e.state]}>{ENG_LABEL[x.e.state]}</Pill>
          : x.e.expiresAt ? <Pill tone="warn"><Timer size={10} /> {timeLeft(x.e.expiresAt)}</Pill> : <Pill tone="warn">Awaiting reply</Pill>}
      </div>
      {!done && (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr auto", gap: 8, marginTop: 10 }}>
          <Btn variant="sm primary" onClick={() => respond(x, "confirmed")}><Check size={12} /> Confirm</Btn>
          <Btn variant="sm ghost" onClick={() => respond(x, "unavailable")}>Can't make it</Btn>
          <Btn variant="sm ghost" onClick={() => setOpen(x.e)}>Details</Btn>
        </div>
      )}
    </div>
  );

  return (
    <div>
      <div className="ff-eyebrow">{guest ? "FireFlair" : "FF Team"}</div>
      <h1 className="ff-h1" style={{ marginTop: 4 }}>Bookings</h1>

      {!guest && (
        <BookingSection id="ff-bk-companyreq" sectionKey="bk_companyreq" title="Requests from companies"
          icon={<span style={{ color: "#25D366", display: "flex" }}><WhatsAppIcon size={16} /></span>} count={requests.length}>
          <div className="ff-wa">
            <span className="ff-wa-ico"><WhatsAppIcon size={22} /></span>
            <span className="ff-body" style={{ color: "#0B3D22", fontSize: 13.5 }}>
              <b>These are the requests that have been sent to you.</b> Each one also comes to you directly on WhatsApp. Reply within {RESPONSE_HOURS} hours, here or there.
            </span>
          </div>
          {requests.length ? requests.map(x => <Req key={x.e.id} x={x} />)
            : <p className="ff-body ff-muted" style={{ margin: 0 }}>{n ? "No requests match that search." : "No requests right now. When a company asks if you're free, it appears here and on WhatsApp."}</p>}
          {answered.length > 0 && <>
            <div className="ff-label" style={{ margin: "14px 0 8px" }}>Answered</div>
            {answered.map(x => <Req key={x.e.id} x={x} done />)}
          </>}
        </BookingSection>
      )}

      <FFAI query={q} onQuery={setQ} title="FF AI · Bookings"
        purpose="Your shifts and requests in one place — search by event, role, venue or date."
        placeholder="Event, role, venue or date…"
        actions={[
          ...(guest ? [] : [{ label: "Requests from companies", onClick: () => jump("ff-bk-companyreq") }]),
          { label: "Your bookings", onClick: () => jump("ff-bk-booked") },
          { label: "FF Party service cards", onClick: () => jump("ff-bk-party") },
          { label: "Availability", onClick: () => jump("ff-bk-avail") },
          { label: "Shift requests", onClick: () => jump("ff-bk-requests") },

      <BookingSection id="ff-bk-booked" sectionKey="bk_booked" title="Your bookings" count={booked.length}
        icon={<Calendar size={15} color="var(--gold-dk)" strokeWidth={1.6} />}>
        {booked.length ? (
          <HorizontalCardRanker items={booked.map(x => ({ ...x, id: x.e.id, name: x.shift.role }))} label="Your bookings"
            renderCard={(x) => <div style={{ width: CARD_W.poster }}><BookingPoster shift={x.shift} engagement={x.e} event={x.event} onOpen={() => setOpen(x.e)} /></div>} />
        ) : (
          <Empty icon={<Calendar size={26} />}
            title={n ? "No bookings match that search." : guest ? "Your bookings will be shown here — once you have a Profile Card, companies can book you." : "Your bookings will be shown here."}
            action={guest ? <Btn variant="primary" onClick={goProfile}><User size={14} /> Build my Profile Card</Btn> : null} />
        )}
      </BookingSection>

      <BookingSection id="ff-bk-party" sectionKey="bk_party" title="FF Party service cards" count={services.filter(sv => !sv.hidden).length}
        icon={<Martini size={15} color="var(--gold-dk)" strokeWidth={1.6} />}
        extra={<Pill tone="warn"><Lock size={10} /> Coming soon</Pill>}>
        <p className="ff-body" style={{ marginTop: -2, fontSize: 13.5 }}>
          Offer your services straight to people hosting parties and events. Hide any you don't offer. Arriving with FF Party.
        </p>
        <HorizontalCardRanker items={services} label="FF Party service cards"
          renderCard={(sv) => (
            <div style={{ width: CARD_W.poster }}>
              <div style={{ opacity: sv.hidden ? .45 : 1, transition: "opacity .15s" }}><ServicePoster svc={sv} /></div>
              <div style={{ display: "flex", justifyContent: "center", gap: 8, marginTop: 8 }}>
                {sv.hidden && <Pill><EyeOff size={10} /> Hidden</Pill>}
                <Btn variant="sm ghost" onClick={() => toggleParty(sv.id)}>{sv.hidden ? <><Eye size={12} /> Show</> : <><EyeOff size={12} /> Hide</>}</Btn>
              </div>
            </div>
          )} />
      </BookingSection>

      <BookingSection id="ff-bk-avail" sectionKey="bk_avail" title="Availability"
        icon={<Clock size={15} color="var(--gold-dk)" strokeWidth={1.6} />}>
        <p className="ff-body" style={{ marginTop: -2, fontSize: 13.5 }}>
          These are the busiest dates of the year. Tell us you're available and we'll put you first in line for shifts on those dates.
        </p>
        <PeakAvailability />
      </BookingSection>

      <BookingSection id="ff-bk-requests" sectionKey="bk_shiftreq" title="Shift requests"
        icon={<Star size={15} color="var(--gold-dk)" strokeWidth={1.6} />}>
        <p className="ff-body" style={{ marginTop: -2, fontSize: 13.5 }}>
          What are your dream jobs? Where would you like to work? This is the first step in how we find you work.
        </p>
        <ShiftRequests />
      </BookingSection>

      <BookingSheet engagement={open} onClose={() => setOpen(null)} />
    </div>
  );

function draftFromProfile(state) {
  const names = (cat) => recsOf(state.profile, cat).filter(r => !r.proposed).map(r => r.name);
  return {
    name: state.profile.name, professions: names("professions"), photo: state.profile.photo,
    skills: names("skills"), interests: names("interests"),
    locations: names("locations"), languages: names("languages"),
  };
}

function TeamProfile() {
  const { state, dispatch } = useStore();
  const [editing, setEditing] = useState(false);
  const [d, setD] = useState(() => draftFromProfile(state));
  const { share: shareCard, busy: sharing } = useShareCard();

  if (!state.profile.live) return <Empty icon={<User size={26} />} title="Finish creating your profile and your card appears here."
    action={<Btn variant="primary" onClick={() => dispatch({ type: "TAB", tab: "home" })}>Continue setting up</Btn>} />;

  const me = meAsStaff(state.profile, state.session);
  const startEdit = () => { setD(draftFromProfile(state)); setEditing(true); };

  /* Editing the card edits NAMES only. Descriptions, media and documents
     live on the records and are never clobbered by a card edit: existing
     records are matched by name and kept whole. */
  const save = () => {
    syncCardRecords(state, dispatch, d);
    dispatch({ type: "PROFILE", patch: { name: d.name.trim() || state.profile.name, photo: d.photo } });
    setEditing(false);
    dispatch({ type: "TOAST", toast: "Card updated" });
  };

  return (
    <div>
      <div className="ff-eyebrow">FF Team · Profile</div>
      <h1 className="ff-h1" style={{ marginTop: 4, marginBottom: 14 }}>{editing ? "Edit your Profile Card" : `Welcome back${String(state.profile.name || "").trim() ? `, ${String(state.profile.name).trim().split(" ")[0]}` : ""}`}</h1>

      <div id="ff-sec-card" />
      {editing ? (
        <>
          <EditablePlayerCard draft={d} setDraft={setD} themeKey={state.profile.theme}
            tag={state.session.tag} tier={state.profile.tier} level={state.profile.level}
            onPhoto={(url) => setD(x => ({ ...x, photo: url }))} />
          <p className="ff-body ff-muted" style={{ fontSize: 11.5, textAlign: "center", marginTop: 10 }}>
            Descriptions, images and documents stay on the full cards below — editing here only changes the names.
          </p>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 14 }}>
            <Btn variant="primary" onClick={save}><Check size={14} /> Save card</Btn>
            <Btn variant="ghost" onClick={() => setEditing(false)}>Cancel</Btn>
          </div>
        </>
      ) : (
        <>
          <PlayerCard person={me} format="full" themeKey={state.profile.theme} actions={{
            onBook: () => dispatch({ type: "TOAST", toast: "This is what people booking you will see" }),
            onReview: () => dispatch({ type: "TOAST", toast: "This is what people reviewing you will see" }),
            onJoin: () => dispatch({ type: "TOAST", toast: "This is what people joining from your card will see" }),
          }} />
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 16 }}>
            <Btn variant="primary" onClick={startEdit}><Pencil size={13} /> Edit card</Btn>
            <Btn onClick={shareCard} disabled={sharing}>{sharing ? <Loader2 size={13} className="ff-spin" /> : <WhatsAppIcon size={14} />} Share</Btn>
          </div>
          <PublishedPanel />
        </>
      )}

      <ProfileFFAI />
      <CVPanel />

      <ProfileSections person={me} isMe />

      <div className="ff-frame" style={{ padding: 12, marginTop: 22, display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
        <Pill tone="gold"><Hash size={11} /> {state.session.tag}</Pill>
        <Pill tone="ok"><ShieldCheck size={11} /> Verified</Pill>
        <Pill>Level {state.profile.level}</Pill>
        <Pill>{TIERS[state.profile.tier].name} tier</Pill>
      </div>
    </div>
  );
}

/* Helpers shared by the FF Staff screens. */
/* Find a person on a Shift Card. "me" is the signed-in professional, who
   isn't in the directory until their FF Team profile is live. */
const findPerson = (all, state, id) => all.find(p => p.id === id) || (id === "me" ? meAsStaff(state.profile, state.session) : undefined);
const latestEng = (state, shiftId) => {
  const list = state.engagements.filter(e => e.shiftId === shiftId);
  return list[list.length - 1] || null;
};
const reservedCredits = (state) => state.engagements.filter(e => e.credit && e.state === "requested").length;
const freeCredits = (state) => Math.max(0, (state.credits?.balance || 0) - reservedCredits(state));
/* A shift can be sent when someone is assigned and they haven't already been
   asked (or the last person asked declined/expired and has been replaced). */
function canSend(state, shift) {
  if (!shift.staffId) return false;
  const e = latestEng(state, shift.id);
  if (!e) return true;
  return ["unavailable", "expired"].includes(e.state) && e.staffId !== shift.staffId;
}
const splitTime = (t) => { const [a = "", b = ""] = String(t || "").split(/\s*[—–-]\s*/); return [a.trim(), b.trim()]; };

/* ---------------------------------------------------------------------------
   SHIFT SHEET — create or edit one Shift Card for one person.
   --------------------------------------------------------------------------- */
function ShiftSheet({ open, shift, event, onClose, onSaved }) {
  const { state, dispatch } = useStore();
  const all = useDirectory();
  const blank = { role: "", start: "", finish: "", skills: "", pay: "", dress: "", notes: "", staffId: "" };
  const [f, setF] = useState(blank);
  useEffect(() => {
    if (!open) return;
    if (shift) {
      const [a, b] = splitTime(shift.time);
      setF({ role: shift.role || "", start: a, finish: b, skills: (shift.skills || []).join(", "), pay: shift.pay || "", dress: shift.dress || "", notes: shift.notes || "", staffId: shift.staffId || "" });
    } else setF(blank);
  }, [open, shift && shift.id]);
  if (!open) return null;
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const sent = shift && latestEng(state, shift.id) && !canSend(state, shift) && latestEng(state, shift.id).staffId === shift.staffId;
  const candidates = [...new Set([...(f.staffId ? [f.staffId] : []), ...state.selection])].map(id => all.find(p => p.id === id)).filter(Boolean);

  const save = () => {
    const data = {
      role: f.role.trim(), time: [f.start, f.finish].filter(Boolean).join(" — "),
      skills: f.skills.split(",").map(x => x.trim()).filter(Boolean),
      pay: f.pay.trim(), dress: f.dress.trim(), notes: f.notes.trim(), staffId: f.staffId,
      date: event?.date || "", iso: event?.iso || "", venue: event?.venue || "",
    };
    if (shift && state.shifts.some(x => x.id === shift.id)) dispatch({ type: "SHIFT_PATCH", id: shift.id, patch: data });
    else dispatch({ type: "SHIFT_ADD", shift: { id: shift?.id || uid("shf"), eventId: event.id, ...data } });
    onSaved && onSaved();
    onClose();
  };

  return (
    <Sheet open onClose={onClose} title={shift && state.shifts.some(x => x.id === shift.id) ? "Edit Shift Card" : "New Shift Card"}>
      <p className="ff-body ff-muted" style={{ marginTop: 0, fontSize: 12.5 }}>
        One Shift Card is for one person. Date and venue come from the Event Card.
      </p>
      <Field label="Person" hint={candidates.length ? "From your basket." : "Add people to your basket to assign them here."}>
        <select className="ff-input" value={f.staffId} onChange={set("staffId")} disabled={sent}>
          <option value="">Not assigned yet</option>
          {candidates.map(p => <option key={p.id} value={p.id}>{p.name} — {p.profession}</option>)}
        </select>
      </Field>
      <Field label="Profession / role"><input className="ff-input" value={f.role} onChange={set("role")} placeholder="Cocktail bartender" /></Field>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        <Field label="Start"><input className="ff-input" value={f.start} onChange={set("start")} placeholder="19:00" /></Field>
        <Field label="Finish"><input className="ff-input" value={f.finish} onChange={set("finish")} placeholder="23:00" /></Field>
      </div>
      <Field label="Requirements" hint="Separate with commas."><input className="ff-input" value={f.skills} onChange={set("skills")} placeholder="Cocktail mixology, flair" /></Field>
      <Field label="Pay rate" hint="Set by you and paid by you directly. FireFlair never sets or handles anyone's pay.">
        <input className="ff-input" value={f.pay} onChange={set("pay")} placeholder="Your rate for this shift" />
      </Field>
      <Field label="Dress code"><input className="ff-input" value={f.dress} onChange={set("dress")} placeholder="Smart black" /></Field>
      <Field label="Notes for this person"><textarea className="ff-input" rows={2} value={f.notes} onChange={set("notes")} /></Field>
      <Btn variant="primary wide" disabled={!f.role.trim()} onClick={save}><Check size={14} /> Save Shift Card</Btn>
    </Sheet>
  );
}

/* ---------------------------------------------------------------------------
   PICK PERSON — fill or replace the person on a Shift Card. The basket comes
   first; suggestions follow. The hirer always chooses.
   --------------------------------------------------------------------------- */
function PickPersonSheet({ open, shift, event, onClose }) {
  const { state, dispatch } = useStore();
  const all = useDirectory();
  if (!open || !shift) return null;
  const taken = state.shifts.filter(x => x.eventId === event.id && x.id !== shift.id).map(x => x.staffId);
  const asked = state.engagements.filter(e => e.shiftId === shift.id).map(e => e.staffId);
  const basket = state.selection.map(id => all.find(p => p.id === id)).filter(p => p && !taken.includes(p.id));
  const role = (shift.role || "").toLowerCase();
  const suggestions = all.filter(p => !taken.includes(p.id) && !asked.includes(p.id) && !state.selection.includes(p.id))
    .filter(p => role && (p.profession.toLowerCase().includes(role.split(" ").pop()) || role.includes(p.profession.toLowerCase().split(" ").pop())))
    .sort((a, b) => (b.rating || 0) - (a.rating || 0)).slice(0, 6);
  const pick = (p) => {
    dispatch({ type: "SHIFT_PATCH", id: shift.id, patch: { staffId: p.id } });
    dispatch({ type: "TOAST", toast: `${p.name.split(" ")[0]} assigned to this Shift Card` });
    onClose();
  };
  const Row = ({ p, tag }) => (
    <button className="ff-info" onClick={() => pick(p)} style={{ width: "100%", display: "flex", gap: 11, alignItems: "center", textAlign: "left" }}>
      <Portrait src={p.photo} name={p.name} size={38} tier={p.tier} />
      <span style={{ flex: 1, minWidth: 0 }}>
        <span className="ff-display" style={{ fontSize: 13, display: "block" }}>{p.name}</span>
        <span className="ff-body ff-muted" style={{ fontSize: 12 }}>{p.profession}{p.rating ? ` · ${p.rating}★` : ""}</span>
      </span>
      {tag && <Pill tone="gold">{tag}</Pill>}
    </button>
  );

  return (
    <Sheet open onClose={onClose} title={`Who for ${shift.role || "this shift"}?`}>
      <div className="ff-label" style={{ marginBottom: 8 }}>Your basket</div>
      {basket.length ? basket.map(p => <Row key={p.id} p={p} tag="Basket" />)
        : <p className="ff-body ff-muted" style={{ marginTop: 0, fontSize: 12.5 }}>Your basket is empty. Add people from any profile or the FF Staff home page.</p>}
      <div className="ff-label" style={{ margin: "16px 0 8px" }}>Suggestions</div>
      {suggestions.length ? suggestions.map(p => <Row key={p.id} p={p} tag="Suggested" />)
        : <p className="ff-body ff-muted" style={{ marginTop: 0, fontSize: 12.5 }}>No close matches for this role yet.</p>}
      <p className="ff-body ff-muted" style={{ fontSize: 11.5, marginBottom: 0 }}>Suggestions only. Nobody is assigned until you choose them.</p>
    </Sheet>
  );
}

/* ---------------------------------------------------------------------------

function EventPage() {
  const { state, dispatch } = useStore();

  const [buying, setBuying] = useState(false);
  const [, tick] = useState(0);
  useEffect(() => {
    const t = setInterval(() => { dispatch({ type: "EXPIRE_DUE" }); tick(n => n + 1); }, 30000);
    dispatch({ type: "EXPIRE_DUE" });
    return () => clearInterval(t);

  const ready = shifts.filter(x => canSend(state, x));

  const company = state.company;
  const questions = (company?.questions || []).filter(q2 => (event.questionIds || []).includes(q2.id));
  const engs = shifts.map(sh => ({ sh, e: latestEng(state, sh.id) })).filter(x => x.e);

/* FF AI for the Company Card. HONEST STATUS: no language model is wired up;
   a simple local reader proposes fields from free text and the location
   lookup proposes service locations. Nothing is saved until approved. */
function companyFromText(text) {
  const lines = String(text || "").split(/\n|\.\s/).map(x => x.trim()).filter(Boolean);
  const name = lines[0] ? lines[0].replace(/^(we are|we're|i run|i own)\s+/i, "").split(/,| - | — /)[0].trim() : "";
  const known = Object.keys(LOCATION_NEIGHBOURS).find(k => text.toLowerCase().includes(k));
  const email = (text.match(/[\w.+-]+@[\w-]+\.[\w.]+/) || [""])[0];
  const phone = (text.match(/(\+?\d[\d\s]{8,}\d)/) || [""])[0];
  const kindMatch = text.match(/(cocktail bar|event (?:company|agency)|catering|bar hire|mobile bar|wedding|private events)[^.,\n]*/i);
  return {
    name, kind: kindMatch ? kindMatch[0].trim().replace(/^\w/, c => c.toUpperCase()) : "",
    location: known ? known.replace(/\b\w/g, c => c.toUpperCase()) : "", email, phone: phone.trim(),
    description: lines.slice(1).join(". ").replace(email, "").replace(phone, "").replace(/\s{2,}/g, " ").replace(/^[\s.,]+|[\s.,]+$/g, ""),
  };
}

    logo: c.logo || null,
  });
  const [ai, setAi] = useState("");
  const [proposal, setProposal] = useState(null);
  const [locIn, setLocIn] = useState("");
  const [slugTouched, setSlugTouched] = useState(!!c.slug);
  const set = (k) => (e) => {
