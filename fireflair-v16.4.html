    setF(prev => ({ ...prev, [k]: v, ...(k === "name" && !slugTouched ? { slug: slugify(v) } : {}) }));
  };
  const sugg = suggestLocations(f.location).filter(l => !f.serviceLocations.includes(l));
  const addLoc = (l) => { const v = l.trim(); if (v && !f.serviceLocations.includes(v)) setF(prev => ({ ...prev, serviceLocations: [...prev.serviceLocations, v] })); };
  const slugOk = /^[a-z0-9-]{3,40}$/.test(f.slug);

  const onDoc = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setF(prev => ({ ...prev, documents: [...prev.documents, { id: uid("doc"), name: file.name, size: file.size, type: file.type || "application/pdf" }] }));
    e.target.value = "";
  };
  const onLogo = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = () => setF(prev => ({ ...prev, logo: r.result }));
    r.readAsDataURL(file);
  };
  const setQ = (id, patch) => setF(prev => ({ ...prev, questions: prev.questions.map(q2 => q2.id === id ? { ...q2, ...patch } : q2) }));

  const save = () => {
    dispatch({ type: "COMPANY_SAVE", company: { ...f, slug: slugify(f.slug), reviews: c.reviews || DEMO_COMPANY_REVIEWS } });
    dispatch({ type: "TOAST", toast: c.name ? "Company Card updated" : "Company Card created" });
    dispatch({ type: "TAB", tab: "profile", route: "staffHome" });
  };

  return (
    <div>
      <button className="ff-btn sm ghost" style={{ marginBottom: 14 }} onClick={() => dispatch(state.activeEventId ? { type: "GO", route: "eventPage" } : { type: "TAB", tab: "profile", route: "staffHome" })}><ChevronLeft size={13} /> Back</button>
      <div className="ff-eyebrow">FF Staff · Company Card</div>
      <h1 className="ff-h1" style={{ marginTop: 4 }}>{c.name ? "Edit your Company Card" : "Create your Company Card"}</h1>
      <p className="ff-body" style={{ marginTop: 8 }}>Set it up once. It goes with every Event Card you create.</p>

      {/* FF AI — describe the business, approve what it proposes */}
      <div className="ff-frame ff-lattice" style={{ padding: 14, margin: "14px 0" }}>
        <Corners />
        <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 10 }}>
          <Coin size={28} tier="gold" />
          <span><span className="ff-display" style={{ fontSize: 13, display: "block" }}>FF AI</span>
            <span className="ff-body ff-muted" style={{ fontSize: 12 }}>Tell us about your business — we'll propose your card.</span></span>
        </div>
        <textarea className="ff-input" rows={3} value={ai} onChange={(e) => setAi(e.target.value)}
          placeholder="The Loft Lounge, a cocktail bar and private events space in Enfield. bookings@loftlounge.co.uk" />
        <Btn variant="sm" style={{ marginTop: 8 }} disabled={!ai.trim()} onClick={() => setProposal(companyFromText(ai))}><Sparkles size={12} /> Propose my card</Btn>
        {proposal && (
          <div className="ff-info" style={{ marginTop: 10 }}>
            <div className="ff-label" style={{ marginBottom: 6 }}>Proposed — check before approving</div>
            {Object.entries(proposal).filter(([, v]) => v).map(([k, v]) => (
              <div key={k} className="ff-body" style={{ fontSize: 12.5 }}><b style={{ textTransform: "capitalize" }}>{k}:</b> {v}</div>
            ))}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 10 }}>
              <Btn variant="sm primary" onClick={() => {
                const p = proposal;
                setF(prev => ({ ...prev, ...Object.fromEntries(Object.entries(p).filter(([, v]) => v)), slug: slugTouched ? prev.slug : slugify(p.name || prev.name) }));
                setProposal(null);
              }}><Check size={12} /> Approve</Btn>
              <Btn variant="sm ghost" onClick={() => setProposal(null)}>Discard</Btn>
            </div>
          </div>
        )}
        <p className="ff-body ff-muted" style={{ fontSize: 10.5, margin: "8px 0 0" }}>Prototype: a simple local reader stands in for FF AI. Nothing is saved until you approve it.</p>
      </div>

      <CompanyLandscape company={{ ...f, slug: slugify(f.slug) }} />
      <Divider />

      <Field label="Company name" hint="Your full business name, as you want it on your card."><input className="ff-input" value={f.name} onChange={set("name")} placeholder="The Loft Lounge" /></Field>
      <Field label="Your page address" hint={slugOk ? `${CARD_DOMAIN}/${f.slug}` : "3–40 letters, numbers or hyphens."}>
        <div style={{ display: "flex", alignItems: "center", border: "1px solid var(--rule)", background: "#fff" }}>
          <span className="ff-body ff-muted" style={{ padding: "0 4px 0 12px", fontSize: 14 }}>{CARD_DOMAIN}/</span>
          <input className="ff-input" style={{ border: 0, paddingLeft: 2 }} value={f.slug}
            onChange={(e) => { setSlugTouched(true); setF(prev => ({ ...prev, slug: e.target.value.toLowerCase().replace(/[^a-z0-9-]/g, "") })); }} placeholder="the-loft-lounge" />
        </div>
      </Field>
      <Field label="What you do"><input className="ff-input" value={f.kind} onChange={set("kind")} placeholder="Cocktail bar · Private events" /></Field>
      <Field label="Description"><textarea className="ff-input" rows={3} value={f.description} onChange={set("description")} /></Field>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        <Field label="Email"><input className="ff-input" value={f.email} onChange={set("email")} /></Field>
        <Field label="Phone"><input className="ff-input" value={f.phone} onChange={set("phone")} /></Field>
      </div>
      <Field label="Logo or main image">
        <label className="ff-btn sm ghost" style={{ cursor: "pointer" }}><Upload size={12} /> {f.logo ? "Replace image" : "Upload image"}
          <input type="file" accept="image/*" onChange={onLogo} style={{ display: "none" }} /></label>
      </Field>

      <div className="ff-label" style={{ margin: "18px 0 8px" }}>Location and service locations</div>
      <Field label="Business location"><input className="ff-input" value={f.location} onChange={set("location")} placeholder="Enfield" /></Field>
      <div style={{ marginBottom: 8 }}>
        {f.serviceLocations.map(l => (
          <span key={l} className="ff-tagchip" style={{ marginRight: 6, marginBottom: 6 }}>{l}
            <button onClick={() => setF(prev => ({ ...prev, serviceLocations: prev.serviceLocations.filter(x => x !== l) }))} aria-label={`Remove ${l}`}><X size={11} /></button></span>
        ))}
      </div>
      {sugg.length > 0 && (
        <div className="ff-info">
          <div className="ff-label" style={{ marginBottom: 6, display: "flex", gap: 6, alignItems: "center" }}><Sparkles size={11} /> FF AI suggests — tap to approve</div>
          {sugg.map(l => <button key={l} className="ff-chip" onClick={() => addLoc(l)}>+ {l}</button>)}
        </div>
      )}
      <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
        <input className="ff-input" value={locIn} onChange={(e) => setLocIn(e.target.value)} placeholder="Add a named location"
          onKeyDown={(e) => { if (e.key === "Enter") { addLoc(locIn); setLocIn(""); } }} />
        <Btn variant="sm" onClick={() => { addLoc(locIn); setLocIn(""); }}><Plus size={12} /></Btn>
      </div>

      <div className="ff-label" style={{ margin: "18px 0 8px" }}>Website and social links</div>
      <Field label="Website"><input className="ff-input" value={f.website} onChange={set("website")} placeholder="https://" /></Field>
      <Field label="Instagram"><input className="ff-input" value={f.instagram} onChange={set("instagram")} placeholder="@yourbusiness" /></Field>

      <div className="ff-label" style={{ margin: "18px 0 8px" }}>Terms & Conditions and documents</div>
      <div className="ff-info">
        <label className="ff-check"><input type="radio" checked={f.tcMode === "template"} onChange={() => setF(prev => ({ ...prev, tcMode: "template" }))} />
          <span><span className="ff-body" style={{ display: "block" }}>Use the FireFlair five-section template</span>
            <span className="ff-body ff-muted" style={{ fontSize: 11.5 }}>{TC_TEMPLATE.map(x => x.label).join(" · ")}</span></span></label>
        <label className="ff-check"><input type="radio" checked={f.tcMode === "own"} onChange={() => setF(prev => ({ ...prev, tcMode: "own" }))} />
          <span className="ff-body">Use our own T&Cs</span></label>
        {f.tcMode === "own" && <textarea className="ff-input" rows={3} value={f.tcOwn} onChange={set("tcOwn")} placeholder="Paste your terms, or attach them as a PDF below" />}
        <label className="ff-check"><input type="checkbox" checked={f.nda} onChange={() => setF(prev => ({ ...prev, nda: !prev.nda }))} />
          <span className="ff-body">Add an NDA</span></label>
        <p className="ff-body ff-muted" style={{ fontSize: 11, margin: "6px 0 0" }}>FireFlair-drafted terms are solicitor reviewed before FF Staff leaves beta.</p>
      </div>
      {f.documents.map(d => (
        <div key={d.id} className="ff-info" style={{ display: "flex", gap: 10, alignItems: "center" }}>
          <FileText size={16} color="var(--gold-dk)" />
          <span className="ff-body" style={{ flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis" }}>{d.name}</span>
          <button onClick={() => setF(prev => ({ ...prev, documents: prev.documents.filter(x => x.id !== d.id) }))} aria-label="Remove document"><Trash2 size={14} color="#8C2130" /></button>
        </div>
      ))}
      <label className="ff-btn sm ghost" style={{ cursor: "pointer", marginBottom: 16 }}><Upload size={12} /> Add a PDF — onboarding, your T&Cs, forms
        <input type="file" accept="application/pdf,.pdf,.doc,.docx" onChange={onDoc} style={{ display: "none" }} /></label>

      <div className="ff-label" style={{ margin: "18px 0 4px" }}>Hiring questions</div>
      <p className="ff-body ff-muted" style={{ marginTop: 0, fontSize: 12 }}>Questions you want staff to answer with each Shift Card. Up to {QUESTION_MAX_OPTIONS} answers each, to fit WhatsApp's reply buttons.</p>
      {f.questions.map(q2 => (
        <div key={q2.id} className="ff-info">
          <input className="ff-input" value={q2.text} onChange={(e) => setQ(q2.id, { text: e.target.value })} placeholder="Your question" />
          <div style={{ display: "grid", gridTemplateColumns: `repeat(${QUESTION_MAX_OPTIONS},1fr)`, gap: 6, marginTop: 6 }}>
            {Array.from({ length: QUESTION_MAX_OPTIONS }).map((_, i) => (
              <input key={i} className="ff-input" style={{ padding: "9px 8px", fontSize: 14 }} value={q2.options[i] || ""} placeholder={`Answer ${i + 1}`}
                onChange={(e) => { const o = [...q2.options]; o[i] = e.target.value; setQ(q2.id, { options: o.filter((x, j) => x || j < i) }); }} />
            ))}
          </div>
          <button className="ff-btn sm ghost" style={{ marginTop: 6 }} onClick={() => setF(prev => ({ ...prev, questions: prev.questions.filter(x => x.id !== q2.id) }))}><Trash2 size={11} /> Remove</button>
        </div>
      ))}
      <Btn variant="sm" onClick={() => setF(prev => ({ ...prev, questions: [...prev.questions, { id: uid("hq"), text: "", options: ["Yes", "No"] }] }))}><Plus size={12} /> Add hiring question</Btn>

      <Divider />
      <Btn variant="primary wide" disabled={!f.name.trim() || !slugOk} onClick={save}><Check size={15} /> {c.name ? "Save Company Card" : "Create Company Card"}</Btn>
    </div>
  );
}

function StaffProfile() {
  const { state, dispatch } = useStore();

      onSubmit={() => dispatch({ type: "TAB", tab: "home", route: "companyEdit" })} />
  );

      <div style={{ marginTop: 16 }}><Btn variant="primary wide" onClick={() => dispatch({ type: "TAB", tab: "home", route: "companyEdit" })}><Briefcase size={15} /> Create Company Card</Btn></div>

      <h1 className="ff-h1" style={{ marginTop: 4, marginBottom: 14 }}>{c.name}</h1>
      {ai}
      <CompanyLandscape company={c} />
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 12 }}>
        <Btn onClick={() => dispatch({ type: "TAB", tab: "home", route: "companyEdit" })}><Pencil size={13} /> Edit card</Btn>
        <Btn variant="ghost" onClick={() => dispatch({ type: "TOAST", toast: `Link copied — ${CARD_DOMAIN}/${c.slug}` })}><Share2 size={13} /> Share</Btn>
      </div>

      {c.description && <p className="ff-serif" style={{ fontSize: 16, marginTop: 16, color: "#3A352D" }}>{c.description}</p>}

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginTop: 14 }}>
        {[["Confirmed", stat("confirmed")], ["Awaiting", stat("requested")], ["Credits", state.credits?.balance || 0]].map(([l, v]) => (
          <div key={l} className="ff-frame" style={{ padding: 11 }}>
            <div className="ff-display" style={{ fontSize: 22 }}>{v}</div>
            <div className="ff-label">{l}</div>
          </div>
        ))}
      </div>

      {(c.serviceLocations || []).length > 0 && (
        <section style={{ marginTop: 22 }}>
          <SectionHead icon={<MapPin size={15} color="var(--gold-dk)" strokeWidth={1.6} />} title="Service locations" count={c.serviceLocations.length} />
          <div>{c.serviceLocations.map(l => <span key={l} className="ff-chip">{l}</span>)}</div>
        </section>
      )}

      {(c.website || c.instagram || c.email || c.phone) && (
        <section style={{ marginTop: 22 }}>
          <SectionHead icon={<Globe size={15} color="var(--gold-dk)" strokeWidth={1.6} />} title="Contact and social" />
          <div className="ff-info">
            {c.email && <div className="ff-body">{c.email}</div>}
            {c.phone && <div className="ff-body">{c.phone}</div>}
            {c.website && <div className="ff-body"><Link2 size={12} /> {c.website}</div>}
            {c.instagram && <div className="ff-body">Instagram {c.instagram}</div>}
          </div>
        </section>
      )}

      <section style={{ marginTop: 22 }}>
        <SectionHead icon={<FileText size={15} color="var(--gold-dk)" strokeWidth={1.6} />} title="Sent with every booking" />
        <div className="ff-info">
          <div className="ff-body"><b>T&Cs:</b> {c.tcMode === "own" ? "Your own terms" : "FireFlair five-section template"}{c.nda ? " + NDA" : ""}</div>
          <div className="ff-body"><b>Documents:</b> {(c.documents || []).length ? c.documents.map(d => d.name).join(", ") : "None yet"}</div>
          <div className="ff-body"><b>Hiring questions:</b> {(c.questions || []).length}</div>
        </div>
      </section>

      <section style={{ marginTop: 22 }}>
        <SectionHead icon={<Award size={15} color="var(--gold-dk)" strokeWidth={1.6} />} title={`Reviews${avg ? ` · ${avg}★` : ""}`} count={reviews.length}
          action={<button className="ff-btn sm ghost" onClick={() => setReviewOpen(true)}>Leave a review</button>} />
        {reviews.map(r => (
          <div key={r.id} className="ff-info">
            <div style={{ display: "flex", justifyContent: "space-between" }}>
              <span className="ff-display" style={{ fontSize: 12.5 }}>{r.byName}</span>
              <span style={{ color: "var(--gold)" }}>{"★".repeat(r.rating)}</span>
            </div>
            <p className="ff-body" style={{ margin: "4px 0 0" }}>{r.text}</p>
          </div>
        ))}
        <ComingSoonTile item={roadmapItem("gmaps")} width="100%" />
      </section>

      <section style={{ marginTop: 22 }}>
        <SectionHead icon={<Users size={15} color="var(--gold-dk)" strokeWidth={1.6} />} title="Regular team" count={team.length}
          action={<button className="ff-btn sm ghost" onClick={() => dispatch({ type: "TAB", tab: "home", route: "staffHome" })}>Find more</button>} />
        <HScroll label="Team">
          {team.map(p => <PlayerTile key={p.id} person={p} onClick={() => dispatch({ type: "VIEW", id: p.id })} />)}
        </HScroll>
      </section>

      <section style={{ marginTop: 22 }}>
        <SectionHead icon={<MapPin size={15} color="var(--gold-dk)" strokeWidth={1.6} />} title="Venues" count={VENUES.length} />
        <HScroll label="Venues">
          {VENUES.map(v => <VenueCard key={v.id} venue={v} onClick={() => dispatch({ type: "TOAST", toast: `${v.name} — ${v.kind}, ${v.area}` })} />)}
        </HScroll>
      </section>

      <ComingSoonRow ids={["svc_co", "ch", "party"]} title="Coming to Company Cards" />

      <Sheet open={reviewOpen} onClose={() => setReviewOpen(false)} title={`Review ${c.name}`}>
        <Field label="Rating">
          <div style={{ display: "flex", gap: 6 }}>
            {Array.from({ length: REVIEW_MAX }).map((_, i) => (
              <button key={i} aria-label={`${i + 1} stars`} onClick={() => setRRating(i + 1)} style={{ padding: 4, color: i < rRating ? "var(--gold)" : "#C9C3B4" }}>
                <Award size={22} strokeWidth={i < rRating ? 0 : 1.5} fill={i < rRating ? "currentColor" : "none"} />
              </button>
            ))}
          </div>
        </Field>
        <Field label="Review"><textarea className="ff-input" rows={4} value={rText} onChange={(e) => setRText(e.target.value)} /></Field>
        <Btn variant="primary wide" disabled={!rText.trim()} onClick={() => {
          dispatch({ type: "COMPANY_REVIEW_ADD", review: { id: uid("crev"), byName: state.profile.name || "You", rating: rRating, text: rText.trim(), at: Date.now() } });
          setRText(""); setReviewOpen(false);
          dispatch({ type: "TOAST", toast: "Review posted" });
        }}><Award size={14} /> Post review</Btn>
      </Sheet>
    </div>
  );
}

const MAP_EVENTS = [
  { id: "mev_lcw", name: "London Cocktail Week", note: "3–9 October · bar takeovers", area: "Central London", event: true },
  { id: "mev_wws", name: "Winter Wedding Showcase", note: "18 October · Charlotte House", area: "West London", event: true },

  { id: "mev_autumn", name: "Autumn Cocktail Party", note: "The Loft Lounge", area: "Enfield", event: true },
  { id: "mev_lunch", name: "Riverside Seated Lunch", note: "Riverside Pavilion", area: "South London", event: true },
];
const MAP_LAYER = {
  person: { label: "Profile Cards" },
  business: { label: "Event businesses" },
  venue: { label: "Venues", color: "#C6C8CC" },
  event: { label: "Events", color: "#2F8A7E" },

/* mode="network": only where Profile Cards are. mode="home": people,
   businesses, venues and events, each in its own colour. */
function FFMap({ mode = "home" }) {
  const { dispatch } = useStore();
  const directory = useDirectory();
  const [sel, setSel] = useState(null);
  const home = mode === "home";

  const pins = useMemo(() => {
    const people = directory.map(p => ({ ...p, kind: "person", area: (p.locations || []).find(l => MAP_AREAS[l]) }))
      .filter(p => p.area);
    const all = home
      ? [...people, ...MAP_BUSINESSES.map(b => ({ ...b, kind: "business" })),
         ...VENUES.map(v => ({ ...v, kind: "venue", venue: true })), ...MAP_EVENTS.map(e => ({ ...e, kind: "event" }))]
      : people;
    const seen = {};
    const RING = [[0, 0], [7, -6], [-7, 5], [8, 7], [-8, -6], [0, 9], [0, -9], [11, 0], [-11, 0], [10, -9], [-10, 9]];
    return all.map(p => {
      const [bx, by] = MAP_AREAS[p.area];
      const n = (seen[p.area] = (seen[p.area] || 0) + 1) - 1;
      const ring = RING[n % RING.length];
      return { ...p, x: Math.max(4, Math.min(96, bx + ring[0])), y: Math.max(5, Math.min(95, by + ring[1])) };
    });
  }, [home, directory.length]);

  /* Real map layer (Leaflet + CARTO/OpenStreetMap tiles). Pins keep the same
     area-only placement as before: the old 0–100 grid is mapped onto London
     coordinates, so positions stay approximate, never addresses. If Leaflet or
     the tiles cannot load, the original stylised map is shown instead. */
  const boxRef = useRef(null);
  const [fallback, setFallback] = useState(!window.L);
  const [hosts, setHosts] = useState(null);
  const toLL = (x, y) => [51.654 - 0.002957 * (y - 9), -0.4045 + 0.00525 * x];
  useEffect(() => {
    if (fallback || !boxRef.current || !window.L) return;
    const L = window.L;
    let map;
    try {
      map = L.map(boxRef.current, { zoomControl: false, scrollWheelZoom: false, dragging: !L.Browser.mobile, minZoom: 9, maxZoom: 15, attributionControl: true });
      map.attributionControl.setPrefix(false);
      map.setView([51.54, -0.14], 10);
      let loaded = 0, errs = 0;
      const tl = L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
        subdomains: "abcd", maxZoom: 19,
        attribution: "© OpenStreetMap contributors © CARTO",
      }).addTo(map);
      tl.on("tileload", () => { loaded++; });
      tl.on("tileerror", () => { errs++; if (!loaded && errs >= 4) setFallback(true); });
      const t = setTimeout(() => { if (!loaded) setFallback(true); }, 8000);
      L.control.zoom({ position: "topright" }).addTo(map);
      Object.entries(MAP_AREAS).forEach(([area, [x, y]]) => {
        L.marker(toLL(x, y), { interactive: false, keyboard: false,
          icon: L.divIcon({ className: "ff-llbl", html: `<span>${area}</span>`, iconSize: [0, 0] }) }).addTo(map);
      });
      const h = {};
      pins.forEach(p => {
        const m = L.marker(toLL(p.x, p.y), { interactive: false, keyboard: false, zIndexOffset: p.kind === "person" ? 100 : 0,
          icon: L.divIcon({ className: "ff-lpin", html: "<div></div>", iconSize: [0, 0] }) }).addTo(map);
        h[p.kind + p.id] = m.getElement().firstChild;
      });
      setHosts(h);
      return () => { clearTimeout(t); setHosts(null); map.remove(); };
    } catch (e) {
      setFallback(true);
      if (map) map.remove();
    }
  }, [fallback, pins]);

  const renderPin = (p, pos) => {
    const on = sel && sel.id === p.id && sel.kind === p.kind;
    return (
            <button key={p.kind + p.id} className="ff-pin" style={{ ...pos, zIndex: on ? 3 : 1 }}
              onClick={() => setSel(p)} aria-label={`${MAP_LAYER[p.kind].label}: ${p.name}`}>
              {p.kind === "event" ? (
                <span style={{ display: "block", width: on ? 18 : 14, height: on ? 18 : 14, transform: "rotate(45deg)", background: MAP_LAYER.event.color, border: "1.5px solid #EAD79C", boxShadow: on ? "0 0 10px rgba(47,138,126,.9)" : "none" }} />
              ) : p.kind === "venue" ? (
                <span style={{ display: "block", width: on ? 17 : 13, height: on ? 17 : 13, borderRadius: 2, background: MAP_LAYER.venue.color, border: "1.5px solid #141416", boxShadow: on ? "0 0 10px rgba(198,200,204,.9)" : "none" }} />
              ) : (<>
                {p.kind === "business" && <span style={{ position: "absolute", inset: -7, borderRadius: "50%", border: "1px solid rgba(140,21,38,.9)", background: "rgba(92,18,32,.5)" }} />}
                <span style={{ position: "relative", display: "block", filter: on ? "drop-shadow(0 0 8px rgba(201,162,39,.9))" : "none" }}>
                  <Coin size={on ? 30 : 24} tier={p.tier} flat />
                </span>
              </>)}
            </button>
    );
  };

  return (
    <div>
      {!fallback ? (
        <div className="ff-map ff-map-real" style={{ height: 380, isolation: "isolate" }}>
          <div ref={boxRef} style={{ position: "absolute", inset: 0, background: "#0B0B0C" }} />
          {hosts && pins.map(p => {
            const host = hosts[p.kind + p.id];
            return host ? ReactDOM.createPortal(renderPin(p, { left: 0, top: 0 }), host, p.kind + p.id) : null;
          })}
        </div>
      ) : (
      <div className="ff-map ff-lattice" style={{ height: 380 }}>
        <svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none" style={{ position: "absolute", inset: 0 }} aria-hidden="true">
          {[15, 30, 45, 60, 75, 90].map(y => <line key={`h${y}`} x1="0" y1={y} x2="100" y2={y} stroke="#C9A227" strokeOpacity=".08" strokeWidth=".25" />)}
          {[15, 30, 45, 60, 75, 90].map(x => <line key={`v${x}`} x1={x} y1="0" x2={x} y2="100" stroke="#C9A227" strokeOpacity=".08" strokeWidth=".25" />)}
          <path d="M -2 62 C 20 56, 32 70, 50 64 C 68 58, 80 70, 102 63" fill="none" stroke="#C9A227" strokeOpacity=".38" strokeWidth="1.2" />
          <path d="M -2 62 C 20 56, 32 70, 50 64 C 68 58, 80 70, 102 63" fill="none" stroke="#8C1526" strokeOpacity=".35" strokeWidth="3" />
          <circle cx="48" cy="51" r="17" fill="none" stroke="#C9A227" strokeOpacity=".16" strokeWidth=".3" />
          <circle cx="48" cy="51" r="30" fill="none" stroke="#C9A227" strokeOpacity=".10" strokeWidth=".3" />
        </svg>

        {Object.entries(MAP_AREAS).map(([area, [x, y]]) => (
          <span key={area} style={{ position: "absolute", left: `${x}%`, top: `${y}%`, transform: "translate(-50%,-260%)", fontSize: 8, letterSpacing: ".16em", textTransform: "uppercase", color: "rgba(234,215,156,.45)", whiteSpace: "nowrap", pointerEvents: "none" }}>{area}</span>
        ))}

        {pins.map(p => renderPin(p, { left: `${p.x}%`, top: `${p.y}%` }))}
      </div>
      )}

      <div style={{ display: "flex", gap: 14, alignItems: "center", justifyContent: "center", margin: "10px 0 14px", flexWrap: "wrap" }}>
        <span className="ff-body ff-muted" style={{ fontSize: 11, display: "flex", gap: 6, alignItems: "center" }}><Coin size={14} tier="gold" flat /> Profile Cards</span>
        {home && <>
          <span className="ff-body ff-muted" style={{ fontSize: 11, display: "flex", gap: 6, alignItems: "center" }}>
            <span style={{ width: 14, height: 14, borderRadius: "50%", border: "1px solid rgba(140,21,38,.9)", background: "rgba(92,18,32,.5)", display: "block" }} /> Event businesses
          </span>
          <span className="ff-body ff-muted" style={{ fontSize: 11, display: "flex", gap: 6, alignItems: "center" }}>
            <span style={{ width: 11, height: 11, borderRadius: 2, background: MAP_LAYER.venue.color, border: "1px solid #141416", display: "block" }} /> Venues
          </span>
          <span className="ff-body ff-muted" style={{ fontSize: 11, display: "flex", gap: 6, alignItems: "center" }}>
            <span style={{ width: 10, height: 10, transform: "rotate(45deg)", background: MAP_LAYER.event.color, display: "block" }} /> Events
          </span>
        </>}
      </div>

      {sel ? (
        <div>
          {sel.kind === "business" ? <OrgCard org={{ ...sel, kind: sel.profession }} kindLabel="Company" width="100%" />
            : sel.kind === "venue" ? <VenueCard venue={sel} width="100%" />
            : sel.kind === "event" ? (
              <div className="ff-tile dark" style={{ width: "100%", minHeight: 0, gap: 6 }}>
                <Corners />
                <span className="ff-label" style={{ color: "#7FC7BC" }}>Event · {sel.area}</span>
                <span className="ff-display" style={{ fontSize: 15, color: "#F2ECE0" }}>{sel.name}</span>
                <span className="ff-serif" style={{ fontSize: 13.5, color: "rgba(242,236,224,.75)" }}>{sel.note}</span>
              </div>
            ) : (<>
              <PlayerCard person={{ ...sel, tag: sel.tag, photo: sel.photo, level: sel.level || 3 }} format="mini" themeKey={sel.theme || "onyx"} />
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 10 }}>
                <span className="ff-label" style={{ color: "var(--gold-dk)" }}>{TIERS[sel.tier] ? TIERS[sel.tier].name : ""} · {sel.area}</span>
                <span style={{ flex: 1, height: 1, background: "var(--rule)" }} />
                <button onClick={() => { dispatch({ type: "VIEW", id: sel.id }); window.scrollTo(0, 0); }} className="ff-btn sm ghost">View profile</button>
              </div>
            </>)}
        </div>
      ) : (
        <p className="ff-body ff-muted" style={{ textAlign: "center", fontSize: 12, margin: 0 }}>
          {home ? "Tap a marker to see who or what is there." : "Tap a coin to see who works there."} Areas only, never addresses.
        </p>
      )}
    </div>
  );
}

/* XP Beta timeline — the current and next quarterly period, generated from
   XP_TIMELINE rather than hand-written, so a future quarter is a data change
   to XP_CURRENT_PERIOD/XP_TIMELINE, not a UI rewrite. */
function XPTimeline() {
  const idx = XP_TIMELINE.findIndex(p => p.year === XP_CURRENT_PERIOD.year && p.q === XP_CURRENT_PERIOD.q);
  const visible = XP_TIMELINE.slice(Math.max(0, idx), idx + 2);
  return (
    <div style={{ marginBottom: 16 }}>
      <div style={{ textAlign: "center", marginBottom: 8 }}>
        <span className="ff-eyebrow" style={{ fontSize: 10 }}>FF XP Beta</span>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        {visible.map((p, i) => {
          const isCurrent = p.year === XP_CURRENT_PERIOD.year && p.q === XP_CURRENT_PERIOD.q;
          return (
            <React.Fragment key={xpPeriodKey(p)}>
              <div style={{ textAlign: "center", flex: "none" }}>
                <div className="ff-display" style={{
                  fontSize: isCurrent ? 15 : 12, color: isCurrent ? "var(--ink)" : "#8C857A",
                  letterSpacing: ".06em",
                }}>{quarterLabel(p)}</div>
                <div className="ff-body ff-muted" style={{ fontSize: 9, marginTop: 2 }}>
                  {isCurrent ? "Current" : "Next"}
                </div>
              </div>
              {i < visible.length - 1 && (
                <div style={{ flex: 1, height: 2, background: "linear-gradient(90deg, var(--gold), rgba(201,162,39,.15))" }} />
              )}
            </React.Fragment>
          );
        })}
      </div>
      <p className="ff-body ff-muted" style={{ fontSize: 10.5, textAlign: "center", marginTop: 8, marginBottom: 0 }}>
        FireFlair XP runs in quarterly performance periods. Your progress resets each quarter — nothing you've earned is lost.
      </p>
    </div>
  );
}

/* THE FF COIN — "What do I need to do next?"
   The existing XP tasks, incomplete first, each one a shortcut into the part
   of Profile where it gets done. XP and tiers sit underneath as the reward. */
function XPSheet({ open, onClose }) {
  const { state, dispatch } = useStore();
  if (!open) return null;
  const info = xpProgress(state.profile.xp);
  const claimed = state.profile.xpClaimed || [];
  const qsAll = allQuestions(state);
  const answered = qsAll.filter(q => isAnswered(answerOf(state, q))).length;
  const live = !!state.profile.live;

  const tasks = [
    ...XP_TASKS.map(t => ({ ...t, done: claimed.includes(t.id), reward: `+${t.xp} XP` })),
    {
      id: "questions", label: "Answer Question Cards", hint: `${answered} of ${qsAll.length} answered`,
      done: answered >= qsAll.length, reward: `+${XP_VALUES.question} XP each`,
    },
  ];
  const todo = tasks.filter(t => !t.done);
  const done = tasks.filter(t => t.done);

  /* Send the person to where the task is done. Reuses the Profile routes:
     card editor, review screen (all categories + Question Cards), tag,
     verification, and — once live — the profile's own sections. */
  const goTask = (id) => {
    onClose();
    let focus = null;
    if (id === "create_card") focus = "card";
    else if (id === "publish_profile") focus = live ? "card" : "share";
    else if (id === "first_review") {
      if (live) focus = "reviews";
      else { focus = "share"; dispatch({ type: "TOAST", toast: "Share your Profile Card first — then ask people you've worked with for a review." }); }
    }
    else if (id === "questions") focus = "questions";
    else if (id.startsWith("add_")) focus = id.slice(4);
    if (state.role !== "team") dispatch({ type: "ROLE", role: "team" });
    dispatch({ type: "TAB", tab: "profile", route: "home" });
    if (focus) dispatch({ type: "FOCUS", focus: { target: focus } });
    else window.scrollTo(0, 0);
  };

  const Task = ({ t }) => {
    const body = (<>
      <span className="dot">{t.done && <Check size={13} strokeWidth={2.6} />}</span>
      <span style={{ flex: 1, minWidth: 0 }}>
        <span className="ff-serif" style={{ fontSize: 15.5, display: "block", color: "#1D1B18", lineHeight: 1.2, textDecoration: t.done ? "line-through" : "none", textDecorationColor: "rgba(126,97,29,.5)" }}>{t.label}</span>
        <span className="ff-body ff-muted" style={{ fontSize: 11.5 }}>{t.hint}</span>
      </span>
      {t.done ? <Pill tone="ok">Earned</Pill> : <Pill tone="gold">{t.reward}</Pill>}
      {!t.done && <ChevronRight size={16} color="var(--gold-dk)" style={{ flex: "none" }} />}
    </>);
    return t.done
      ? <div className="ff-task done">{body}</div>
      : <button className="ff-task" onClick={() => goTask(t.id)}>{body}</button>;
  };

  return (
    <Sheet open onClose={onClose} title="Your FireFlair">
      {/* XP summary — compact, the reward behind the list */}
      <div className="ff-frame ff-lattice" style={{ padding: "14px 14px 12px", marginBottom: 18, display: "flex", gap: 14, alignItems: "center" }}>
        <Corners />
        <Coin size={52} tier={info.currentTier} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: "flex", alignItems: "baseline", gap: 10 }}>
            <span className="ff-display" style={{ fontSize: 24 }}>{info.xp} XP</span>
            <span className="ff-label">{TIERS[info.currentTier].name}</span>
          </div>
          <div className="ff-xptrack" style={{ margin: "8px 0 6px", background: "rgba(20,20,22,.12)" }}>
            <div className="ff-xpfill" style={{ width: `${info.pct}%` }} />
          </div>
          <div className="ff-body ff-muted" style={{ fontSize: 11.5 }}>
            {info.next ? `${info.nextXp - info.xp} XP to ${info.next.label}` : "Top numbered tier reached"} · {state.profile.xpPeriod || 0} XP this quarter
          </div>
        </div>
      </div>

      <div style={{ display: "flex", alignItems: "baseline", gap: 10, marginBottom: 10 }}>
        <h3 className="ff-h2" style={{ fontSize: 16, flex: 1 }}>{todo.length ? "Next steps" : "All done"}</h3>
        <span className="ff-label">{done.length} of {tasks.length} done</span>
      </div>
      {todo.length === 0 && <p className="ff-body ff-muted" style={{ marginTop: 0 }}>Every task is complete. New ones arrive as FireFlair grows.</p>}
      {todo.map(t => <Task key={t.id} t={t} />)}
      {done.length > 0 && <>
        <div className="ff-label" style={{ margin: "16px 0 8px", opacity: .8 }}>Completed</div>
        {done.map(t => <Task key={t.id} t={t} />)}
      </>}

      <Divider />
      <XPTimeline />
      <div className="ff-label" style={{ marginBottom: 8 }}>Levels</div>
      {XP_LEVELS.map(l => {
        const isGold = l.tier === "gold";
        const reached = isGold ? false : info.xp >= l.xp;
        return (
          <div key={l.tier} className="ff-frame" style={{ padding: 12, marginBottom: 8, display: "flex", gap: 11, alignItems: "center", opacity: reached ? 1 : .62 }}>
            <Coin size={30} tier={l.tier} />
            <span style={{ flex: 1, minWidth: 0 }}>
              <span className="ff-display" style={{ fontSize: 13, display: "block" }}>
                {l.label} · {isGold ? `Top performers — ${quarterLabel(XP_CURRENT_PERIOD)}` : `${l.xp} XP`}
              </span>
              <span className="ff-body ff-muted" style={{ fontSize: 11.5 }}>{l.unlocks}</span>
            </span>
            {isGold ? <Pill tone="warn">Quarterly</Pill> : reached ? <Pill tone="ok"><Check size={10} /> Unlocked</Pill> : <Pill>Locked</Pill>}
          </div>
        );
      })}
      <p className="ff-body ff-muted" style={{ fontSize: 11.5, margin: "12px 0 0" }}>
        Wallet, earnings and rewards will live here too — this is your FireFlair account area.
      </p>
    </Sheet>
  );
}

/* LOG IN — FF Tag + WhatsApp code (every account), or FF Tag + password
   (accounts that chose to create one). Talks only to AUTH_ADAPTER; a
   successful result becomes AUTH_SIGNED_IN, which is the one thing the nav
   button reads. */
function LoginSheet({ open, onClose }) {
  const { dispatch } = useStore();
  const [mode, setMode] = useState("otp");
  const [tag, setTag] = useState("");
  const [pw, setPw] = useState("");
  const [phone, setPhone] = useState("");
  const [code, setCode] = useState("");
  const [sent, setSent] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  useEffect(() => { if (open) { setMode("otp"); setPw(""); setCode(""); setSent(false); setErr(null); setBusy(false); } }, [open]);
  if (!open) return null;

  const clean = AUTH_ADAPTER.cleanTag(tag);
  const tagOk = AUTH_ADAPTER.tagOk(clean);
  const run = async (fn) => {
    setBusy(true); setErr(null);
    try { return await fn(); } catch (e) { setErr(e.message); return null; } finally { setBusy(false); }
  };
  const done = (res) => {
    if (!res) return;
    const demo = res.tag === "sam42";
    if (demo) dispatch({ type: "SEED_DEMO" });
    else if (res.method === "otp") dispatch({ type: "SESSION", patch: { tag: res.tag, phone, verified: true } });
    else dispatch({ type: "SESSION", patch: { tag: res.tag } });
    dispatch({ type: "AUTH_SIGNED_IN", tag: demo ? "SAM42" : res.tag, method: res.method });
    dispatch({ type: "TOAST", toast: `Logged in as ${demo ? "SAM42" : res.tag}` });
    onClose();
  };
  const switchTo = (m) => { setMode(m); setErr(null); setSent(false); setCode(""); };
  const loginPw = () => run(() => AUTH_ADAPTER.loginWithPassword(clean, pw)).then(done);
  const sendCode = () => run(() => AUTH_ADAPTER.sendCode(clean, phone)).then(r => { if (r) setSent(true); });
  const verify = () => run(() => AUTH_ADAPTER.verifyCode(clean, phone, code)).then(done);

  return (
    <Sheet open onClose={onClose} title="Log in">
      <div className="ff-authtabs" role="tablist" aria-label="How to log in">
        <button type="button" role="tab" aria-selected={mode === "otp"} className={mode === "otp" ? "on" : ""} onClick={() => switchTo("otp")}>
          <WhatsAppIcon size={12} /> WhatsApp code
        </button>
        <button type="button" role="tab" aria-selected={mode === "password"} className={mode === "password" ? "on" : ""} onClick={() => switchTo("password")}>
          <Lock size={11} /> Password
        </button>
      </div>

      <Field label="FF Tag">
        <TagInput value={clean} onChange={setTag} />
      </Field>

      {mode === "password" ? (<>
        <Field label="Password">
          <input className="ff-input" type="password" autoComplete="current-password" value={pw}
            onChange={(e) => setPw(e.target.value)} onKeyDown={(e) => e.key === "Enter" && tagOk && pw && !busy && loginPw()} />
        </Field>
        <Btn variant="primary wide" disabled={busy || !tagOk || !pw} onClick={loginPw}>
          {busy ? <Loader2 size={14} className="ff-spin" /> : <ShieldCheck size={14} />} Log in
        </Btn>
        <div style={{ height: 8 }} />
        <Btn variant="ghost wide" onClick={() => switchTo("otp")}><WhatsAppIcon size={13} /> Use a WhatsApp code instead</Btn>
      </>) : (<>
        <Field label="Phone number" hint="The mobile number on your FireFlair account. We'll send a code on WhatsApp.">
          <input className="ff-input" type="tel" autoComplete="tel" placeholder="+44 7700 900000" value={phone} disabled={sent}
            onChange={(e) => setPhone(e.target.value)} />
        </Field>
        {!sent ? (
          <Btn variant="primary wide" disabled={busy || !tagOk || phone.replace(/\D/g, "").length < 9} onClick={sendCode}>
            {busy ? <Loader2 size={14} className="ff-spin" /> : <WhatsAppIcon size={14} />} Send WhatsApp code
          </Btn>
        ) : (<>
          <Field label="Code from WhatsApp" hint={`Sent to ${phone}.`}>
            <input className="ff-input ff-tagin" inputMode="numeric" autoComplete="one-time-code" maxLength={6} value={code}
              onChange={(e) => setCode(e.target.value.replace(/\D/g, ""))} placeholder="000000" aria-label="Code from WhatsApp" />
          </Field>
          <Btn variant="primary wide" disabled={busy || code.length < 6} onClick={verify}>
            {busy ? <Loader2 size={14} className="ff-spin" /> : <ShieldCheck size={14} />} Verify & log in
          </Btn>
          <div style={{ height: 8 }} />
          <Btn variant="ghost wide" onClick={() => { setSent(false); setCode(""); }}>Change number</Btn>
        </>)}
        <div style={{ height: 8 }} />
        <Btn variant="ghost wide" onClick={() => switchTo("password")}><Lock size={13} /> Use your password instead</Btn>
        <p className="ff-body ff-muted" style={{ fontSize: 11.5, margin: "8px 0 0", textAlign: "center" }}>Only if you created one — passwords are optional.</p>
      </>)}

      {err && <p className="ff-body" role="alert" style={{ color: "var(--bad)", fontSize: 12.5, margin: "12px 0 0" }}>{err}</p>}
      <p className="ff-body ff-muted" style={{ fontSize: 11, margin: "14px 0 0" }}>
        {AUTH_ADAPTER.note} Any FF Tag with a six-digit code, or a six-character password, logs in — SAM42 opens the demo profile.
        New to FireFlair? Create your FF Tag at the top of the Profile page.
      </p>
    </Sheet>
  );
}

function Shell({ children }) {
  const { state, dispatch } = useStore();
  const [act, setAct] = useState(false);
  const [xpOpen, setXpOpen] = useState(false);
  const [shareOpen, setShareOpen] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const [loginOpen, setLoginOpen] = useState(false);
  const [acctOpen, setAcctOpen] = useState(false);
  useEffect(() => { const h = () => setLoginOpen(true); window.addEventListener("ff-login", h); return () => window.removeEventListener("ff-login", h); }, []);
  useEffect(() => { const h = () => setShareOpen(true); window.addEventListener("ff-add", h); return () => window.removeEventListener("ff-add", h); }, []);
  const authed = !!state.auth && state.auth.status === "signedIn";
  const logout = async () => {
    setMenuOpen(false);
    try { await AUTH_ADAPTER.logout(); } catch (e) { /* signed out locally either way */ }
    dispatch({ type: "SIGN_OUT" });
    window.scrollTo(0, 0);
  };
  const isTeam = state.role === "team";
  const isStaff = state.role === "staff";
  const goTab = (tab) => {
    if (!state.role && tab === "profile") { dispatch({ type: "ROLE", role: "team" }); dispatch({ type: "TAB", tab: "profile" }); return; }
    if (!state.role) { dispatch({ type: "TAB", tab }); return; }
    if (isTeam) dispatch({ type: "TAB", tab, route: state.profile.live ? "home" : state.route });
    else dispatch({ type: "TAB", tab, route: tab === "home" ? "staffHome" : state.route });
  };

  useEffect(() => {
    if (!state.toast) return;
    const t = setTimeout(() => dispatch({ type: "TOAST", toast: null }), 2400);
    return () => clearTimeout(t);
  }, [state.toast, dispatch]);

  /* The basket is FireFlair-wide: people can be added from any profile, in
     either role, and it persists until they're on an Event Card. */
  const basket = !!state.role && state.selection.length > 0;
  const buildTeam = () => {
    if (!isStaff) dispatch({ type: "ROLE", role: "staff" });
    dispatch({ type: "TAB", tab: "home", route: state.activeEventId ? "eventPage" : "eventNew" });
  };
  const xpInfo = isTeam && state.profile.live ? xpProgress(state.profile.xp) : null;
  const bottomBarUp = basket || xpInfo;
  const bothBars = basket && xpInfo;

  return (
    <div className="ff-shell">
      <header className="ff-topbar ff-lattice">
        <div className="ff-topbar-in">
          <div className="ff-acct">
            <button type="button" className="ff-acct-btn" disabled={!state.role}
              aria-haspopup="menu" aria-expanded={menuOpen} aria-label={state.role ? "Account menu" : "FireFlair"}
              onClick={() => setMenuOpen(o => !o)}>
              <Coin size={30} tier={isTeam ? state.profile.tier : "gold"} />
              <span style={{ lineHeight: 1.1, textAlign: "left" }}>
                <Wordmark size={13} />
                <span style={{ display: "block", fontSize: 9, letterSpacing: ".2em", color: "rgba(234,215,156,.7)", textTransform: "uppercase" }}>
                  {isTeam ? "Team" : isStaff ? "Staff" : "Welcome"}
                </span>
              </span>
              {state.role && <span aria-hidden="true" className="ff-acct-caret">▾</span>}
            </button>
            {menuOpen && state.role && (
              <>
                <button type="button" className="ff-acct-scrim" aria-label="Close menu" onClick={() => setMenuOpen(false)} />
                <div className="ff-acct-menu" role="menu">
                  <div className="ff-acct-who">
                    <div className="ff-acct-name">{(isTeam && state.profile.name) || (isTeam ? "Your profile" : "FF Staff")}</div>
                    <div className="ff-acct-sub">
                      {isTeam ? "FF Team" : "FF Staff"}{state.session.tag ? ` · ${state.session.tag}` : ""}
                    </div>
                  </div>
                  {authed && state.session.tag && (
                    <button type="button" role="menuitem" className="ff-acct-item" onClick={() => { setMenuOpen(false); setAcctOpen(true); }}>
                      FF Tag &amp; sign-in
                    </button>
                  )}
                  <button type="button" role="menuitem" className="ff-acct-item"
                    onClick={() => { setMenuOpen(false); dispatch({ type: "ROLE", role: isTeam ? "staff" : "team" }); window.scrollTo(0, 0); }}>
                    Switch to {isTeam ? "FF Staff" : "FF Team"}
                  </button>
                </div>
              </>
            )}
          </div>
          <nav className="ff-desknav">
            {NAV.filter(n => n.key !== "__ff").map(n => (
              <button key={n.key} className={state.tab === n.key ? "on" : ""} onClick={() => goTab(n.key)}>{n.label}</button>
            ))}
            <button onClick={() => setXpOpen(true)} style={{ marginLeft: 10 }} aria-label="What to do next (desktop)"><Coin size={30} tier="gold" /></button>
            {state.role && (
              <button onClick={() => isTeam ? setShareOpen(true) : setAct(true)}
                aria-label={isTeam ? "Share your FireFlair card" : "Add FireFlair"}
                style={{ marginLeft: 6, display: "flex", alignItems: "center", gap: 7, fontSize: 11, letterSpacing: ".14em", textTransform: "uppercase", color: "rgba(234,215,156,.8)" }}>
                Add <AddFireFlairMark size={16} />
              </button>
            )}
          </nav>
          <button type="button" className={`ff-authbtn${authed ? " out" : ""}`} onClick={() => authed ? logout() : setLoginOpen(true)}>
            {authed ? "Log out" : "Log in"}
          </button>
        </div>
        {/* Desktop companion row: XP + booking status, same information as the
            mobile bottom bars, laid out for the header instead of floating
            fixed at the bottom of a wide viewport. */}
        {(xpInfo || basket) && (
          <div className="ff-topbar-extras">
            {xpInfo && (
              <button onClick={() => setXpOpen(true)} style={{ display: "flex", alignItems: "center", gap: 10, flex: 1, minWidth: 0 }} aria-label="Your FireFlair XP">
                <Coin size={24} tier={xpInfo.currentTier} />
                <span style={{ flex: 1, minWidth: 0 }}>
                  <span style={{ display: "flex", justifyContent: "space-between", fontSize: 10, letterSpacing: ".1em", textTransform: "uppercase", color: "#EAD79C", marginBottom: 3 }}>
                    <span>{xpInfo.xp} XP</span>
                    <span style={{ color: "rgba(244,239,228,.55)" }}>{xpInfo.next ? `Next: ${xpInfo.next.label}` : "Top tier"}</span>
                  </span>
                  <span className="ff-xptrack" style={{ height: 5 }}><span className="ff-xpfill" style={{ width: `${xpInfo.pct}%` }} /></span>
                </span>
              </button>
            )}
            {basket && (
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ fontSize: 11, letterSpacing: ".1em", textTransform: "uppercase", color: "#EAD79C" }}>Basket · {state.selection.length}</span>
                <button onClick={() => dispatch({ type: "CLEAR_SELECTION" })} style={{ color: "rgba(244,239,228,.6)", fontSize: 11, letterSpacing: ".08em", textTransform: "uppercase" }}>Clear</button>
                <button onClick={buildTeam}
                  style={{ border: "1px solid var(--gold)", color: "#EAD79C", padding: "7px 12px", fontSize: 10, letterSpacing: ".1em", textTransform: "uppercase" }}>
                  Build team
                </button>
              </div>
            )}
          </div>
        )}
      </header>

      <main className="ff-main" style={{ paddingBottom: bothBars ? 240 : bottomBarUp ? 190 : undefined }}>{children}</main>

      {basket && (
        <div className="ff-basket" style={bothBars ? { bottom: "calc(116px + env(safe-area-inset-bottom,0px))" } : undefined}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, maxWidth: 560, margin: "0 auto" }}>
            <Coin size={26} />
            <span style={{ flex: 1, fontSize: 11, letterSpacing: ".12em", textTransform: "uppercase", color: "#EAD79C" }}>
              Basket · {state.selection.length}
            </span>
            <button onClick={() => dispatch({ type: "CLEAR_SELECTION" })} style={{ color: "rgba(244,239,228,.6)", fontSize: 11, letterSpacing: ".1em", textTransform: "uppercase" }}>Clear</button>
            <button onClick={buildTeam}
              style={{ border: "1px solid var(--gold)", color: "#EAD79C", padding: "9px 13px", fontSize: 11, letterSpacing: ".12em", textTransform: "uppercase" }}>
              Build team
            </button>
          </div>
        </div>
      )}

      {xpInfo && <XPBar info={xpInfo} />}

      {state.toast && (
        <div style={{ position: "fixed", left: 14, right: 14, bottom: bothBars ? 200 : bottomBarUp ? 150 : 90, zIndex: 55, display: "flex", justifyContent: "center" }}>
          <span style={{ background: "#141416", color: "#EAD79C", border: "1px solid var(--gold-dk)", padding: "10px 16px", fontSize: 12, letterSpacing: ".06em", maxWidth: 420, textAlign: "center" }}>{state.toast}</span>
        </div>
      )}

      <nav className="ff-bottomnav ff-lattice">
        <div className="ff-bottomnav-in">
          {NAV.map(n => n.key === "__ff" ? (
            <div key="ff" className="ff-navcentre">
              <button className="ff-coinbtn" onClick={() => setXpOpen(true)} aria-label="What to do next">
                <Coin size={56} tier={isTeam ? xpProgress(state.profile.xp).currentTier : "gold"} />
              </button>
            </div>
          ) : (
            <button key={n.key} className={`ff-navbtn ${state.tab === n.key ? "on" : ""}`}
              onClick={() => goTab(n.key)} aria-label={n.label} title={n.label}>
              <NavMark shape={n.mark} size={23} tone={state.tab === n.key ? "#EAD79C" : "#D8D6D0"} />
            </button>
          ))}
        </div>
      </nav>

      <ActionSheet open={act} onClose={() => setAct(false)} />
      <XPSheet open={xpOpen} onClose={() => setXpOpen(false)} />
      <ShareCardSheet open={shareOpen} onClose={() => setShareOpen(false)} />
      <LoginSheet open={loginOpen} onClose={() => setLoginOpen(false)} />
      <Sheet open={acctOpen} onClose={() => setAcctOpen(false)} title="FF Tag & sign-in">
        <AccountSettings />
      </Sheet>
    </div>
  );
}

/* PROFILE PAGE — everything about "me" on one page. Before sharing: FF Tag
   first, then the card, FF AI, CV, the full profile, then Save & Share — no
   separate screens. After sharing: the card and profile. Either way the
   profile saves itself once the account exists. */
function ProfilePage() {
  const { state } = useStore();
  useState(() => { resetQuestionOrder(); return 0; });   // new question order per visit
  useAutoSave();
  return state.profile.live ? <TeamProfile /> : <ProfileBuilder />;
}

/* The card editor wired straight to the profile records: the card always
   shows what the profile holds, and every edit writes to it immediately, so
   the card and the sections below can never disagree. */
function CardBuilder() {
  const { state, dispatch } = useStore();
  const d = draftFromProfile(state);
  const CATS = ["professions", "skills", "interests", "locations", "languages"];
  const setD = (next) => {
    const nd = typeof next === "function" ? next(d) : next;
    const changed = CATS.filter(c => JSON.stringify(nd[c] || []) !== JSON.stringify(d[c] || []));
    if (changed.length) syncCardRecords(state, dispatch, nd, changed);
    if (nd.name !== d.name || nd.photo !== d.photo) dispatch({ type: "PROFILE", patch: { name: nd.name, photo: nd.photo } });
    if (String(nd.name || "").trim() && (nd.professions || []).length && !(state.profile.xpClaimed || []).includes("create_card")) {
      dispatch({ type: "CARD_CREATED_XP" });
      dispatch({ type: "TOAST", toast: `Profile Card created · +${XP_VALUES.task} XP` });
    }
  };
  return (
    <>
      <EditablePlayerCard draft={d} setDraft={setD} themeKey={state.profile.theme}
        tag={state.session.tag || "username"} tier={state.profile.tier} level={state.profile.level}
        onPhoto={(url) => setD(x => ({ ...x, photo: url }))} />
      <div style={{ display: "flex", gap: 10, justifyContent: "center", flexWrap: "wrap", margin: "16px 0 4px" }}>
        {Object.entries(THEMES).map(([k, th]) => (
          <button key={k} onClick={() => dispatch({ type: "PROFILE", patch: { theme: k } })} aria-label={`${th.name} card`} title={th.name}
            style={{ width: 30, height: 30, borderRadius: "50%", background: th.swatch, border: state.profile.theme === k ? "2px solid var(--gold)" : "1px solid var(--rule)" }} />
        ))}
      </div>
    </>
  );
}

/* CV upload, in place. The CV itself is kept as the first Qualification
   card (cv: true); once it's there this prompt goes away. Extraction
   proposals (when a service is connected) land in the sections below. */
const hasCV = (profile) => recsOf(profile, "qualifications").some(r => r.cv);
function CVPanel() {
  const { state, dispatch } = useStore();
  const ref = useRef(null);
  const [st, setSt] = useState(null);
  const cvRec = recsOf(state.profile, "qualifications").find(r => r.cv);
  const onFile = async (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    e.target.value = "";
    if (f.size > MAX_MEDIA_BYTES) { setSt({ msg: `That file is ${prettyBytes(f.size)} — keep it under ${prettyBytes(MAX_MEDIA_BYTES)}.` }); return; }
    setSt({ busy: true, msg: `Saving ${f.name}…` });
    let dataUrl = null;
    try { dataUrl = await readFileAsDataUrl(f); } catch (err) { setSt({ msg: err.message }); return; }
    const cv = makeRecord("qualifications", "CV", {
      cv: true, description: `Uploaded ${new Date().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" })}.`,
      document: { name: f.name, size: f.size, type: f.type, dataUrl },
    });
    dispatch({ type: "REC_BULK", category: "qualifications", list: [cv, ...recsOf(state.profile, "qualifications").filter(r => !r.cv)] });
    dispatch({ type: "TOAST", toast: cvRec ? "CV replaced" : "CV saved under Qualifications" });
    setSt(null);
    CV_ADAPTER.extract(f)
      .then(x => dispatch({ type: "RECORDS_MERGE", byCategory: recordsFromExtraction(x) }))
      .catch(() => {});
  };
  const input = <input ref={ref} type="file" accept=".pdf,.docx,.txt,.md,image/*" onChange={onFile} style={{ display: "none" }} />;
  const status = st && <span className="ff-body" style={{ fontSize: 12, display: "flex", gap: 6, alignItems: "center", marginTop: 6 }}>
    {st.busy && <Loader2 size={13} className="ff-spin" />}{st.msg}</span>;

  /* Uploaded: stays on the page, calm — done, but still there to replace. */
  if (cvRec) return (
    <div id="ff-sec-cv" className="ff-cvdone" style={{ padding: "14px 18px", marginTop: 14, display: "flex", gap: 14, alignItems: "center", flexWrap: "wrap" }}>
      <span style={{ width: 40, height: 40, flex: "none", borderRadius: 12, display: "grid", placeItems: "center", background: "rgba(255,255,255,.7)", border: "1px solid rgba(126,97,29,.25)" }}>
        <Check size={20} color="var(--ok)" strokeWidth={2.2} />
      </span>
      <span style={{ flex: 1, minWidth: 160 }}>
        <span style={{ fontSize: 16, fontWeight: 700, display: "block", color: "#16130F" }}>CV uploaded</span>
        <span className="ff-body ff-muted" style={{ fontSize: 12.5, display: "block", overflowWrap: "anywhere" }}>{(cvRec.document && cvRec.document.name) || "Saved under Qualifications"}</span>
        {status}
      </span>
      {input}
      <Btn variant="sm ghost" disabled={st && st.busy} onClick={() => ref.current && ref.current.click()}><Upload size={13} /> Replace</Btn>
    </div>
  );
  return (
    <div id="ff-sec-cv" className="ff-cvask" style={{ padding: "14px 18px", marginTop: 14, display: "flex", gap: 14, alignItems: "center", flexWrap: "wrap" }}>
      <span style={{ flex: 1, minWidth: 160 }}>
        <span style={{ fontSize: 16, fontWeight: 700, display: "block", color: "#4A0F1C" }}>Have a CV?</span>
        <span className="ff-body" style={{ fontSize: 12.5, color: "#5A474B" }}>FF AI fills in your profile from it.</span>
        {status}
      </span>
      {input}
      <Btn variant="wine" disabled={st && st.busy} onClick={() => ref.current && ref.current.click()}><Upload size={14} /> Upload CV</Btn>
    </div>
  );
}

/* ==========================================================================
   FF TEAM JOURNEY — one page, short headings, the UI does the explaining:
   1 JOIN THE TEAM   FF Tag + phone -> WhatsApp code -> account       TagSection
                     then an optional password                       PasswordSheet
   2 PROFILE CARD    the card itself — saves automatically            useAutoSave
   3 FF AI & CV      fill the profile from a description or a CV
   4 YOUR PROFILE    every section + Q&A, then Save & Share           SaveShareCard
   …                 marks that one more section exists
   5 WELCOME TO THE TEAM   revealed by Save: the finished Profile Card
   Creating a Tag or a card never makes anything public; sharing does.
   ========================================================================== */

const timeOf = (ms) => new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

/* Auto-save. Once the account exists every change to the card or profile
   is saved with no button. The profile's parts are watched by reference, so
   recording the save time never triggers another save. */
function useAutoSave() {
  const { state, dispatch } = useStore();
  const p = state.profile;
  const signedIn = state.auth.status === "signedIn";
  const prev = useRef(null);
  useEffect(() => {
    const was = prev.current;
    prev.current = { h: state._hydrated };
    if (!was || was.h !== state._hydrated) return;   // first look, or just loaded — nothing new
    if (!signedIn) return;
    const t = setTimeout(() => {
      PROFILE_ADAPTER.save(state.session.tag, p).then(r => dispatch({ type: "PROFILE", patch: { saved: true, savedAt: r.savedAt } }));
    }, 600);
    return () => clearTimeout(t);
  }, [p.name, p.photo, p.theme, p.records, p.answers, p.categories, p.aiQuestions, signedIn, state._hydrated]);
}

/* Share = send the Profile Card to the person on their verified WhatsApp
   number. It's the deliberate step that turns their card link on. */
function useShareCard() {
  const { state, dispatch } = useStore();
  const [busy, setBusy] = useState(false);
  const tag = state.auth.status === "signedIn" ? (state.auth.tag || state.session.tag) : null;
  const share = async () => {
    if (!tag || busy) return;
    setBusy(true);
    try {
      const r = await PROFILE_ADAPTER.share(tag, state.session.phone);
      const fresh = !(state.profile.xpClaimed || []).includes("publish_profile");
      const first = !state.profile.live;
      const now = Date.now();
      dispatch({ type: "PROFILE", patch: { live: true, saved: true, savedAt: now, sharedAt: now, publishedAt: state.profile.publishedAt || now } });
      dispatch({ type: "PUBLISH_XP" });
      dispatch({ type: "TOAST", toast: `Profile Card sent to you on WhatsApp${fresh ? ` · +${XP_VALUES.task} XP` : ""}` });
      if (first) window.scrollTo(0, 0);
    } finally { setBusy(false); }
  };
  return { share, busy, tag };
}

/* The FF Tag field: the address in front, the username after it, and a
   tick or cross for availability. Nothing else to read. */
function TagInput({ value, onChange, placeholder = "username", current, check, autoFocus, label = "FF Tag" }) {
  const clean = AUTH_ADAPTER.cleanTag(value);
  const ok = AUTH_ADAPTER.isAvailable(clean, current);
  const show = check && clean.length >= AUTH_ADAPTER.TAG_MIN;
  return (
    <span className="ff-userfield">
      <span className="pre">{CARD_DOMAIN}/</span>
      <input value={clean} maxLength={AUTH_ADAPTER.TAG_MAX} onChange={(e) => onChange(e.target.value)} placeholder={placeholder}
        aria-label={label} autoComplete="username" autoCapitalize="none" spellCheck={false} autoFocus={autoFocus} />
      {show && <span className="st" title={ok ? "Available" : "Taken"}>{ok ? <Check size={18} color="var(--ok)" strokeWidth={2.6} /> : <X size={18} color="var(--bad)" strokeWidth={2.6} />}</span>}
    </span>
  );
}
function TagNote({ clean, current }) {
  if (clean.length >= AUTH_ADAPTER.TAG_MIN && !AUTH_ADAPTER.isAvailable(clean, current))
    return <span className="ff-body" style={{ display: "block", fontSize: 12.5, color: "var(--bad)", fontWeight: 600, marginTop: 5 }}>{clean} is taken</span>;
  return null;
}

/* Optional password, offered straight after the WhatsApp code is verified
   (and any time later from FF Tag & sign-in). Skipping or closing it never
   blocks anything — the person signs in with a WhatsApp code instead. */
function PasswordSheet({ open, onClose, change }) {
  const { state, dispatch } = useStore();
  const [pw, setPw] = useState("");
  const [show, setShow] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  useEffect(() => { if (open) { setPw(""); setShow(false); setBusy(false); setErr(null); } }, [open]);
  if (!open) return null;
  const tag = state.auth.tag || state.session.tag;
  const create = async () => {
    setBusy(true); setErr(null);
    try {
      await AUTH_ADAPTER.setPassword(tag, pw);
      dispatch({ type: "SESSION", patch: { passwordSet: true } });
      dispatch({ type: "TOAST", toast: change ? "Password changed" : `Password created — sign in with ${tag} and your password` });
      onClose();
    } catch (e) { setErr(e.message); } finally { setBusy(false); }
  };
  const skip = () => {
    if (!change) dispatch({ type: "TOAST", toast: "No password — you'll sign in with a WhatsApp code" });
    onClose();
  };
  return (
    <Sheet open onClose={skip} title={change ? "Change your password" : "Create a password?"}>
      <p className="ff-body" style={{ marginTop: 0, fontSize: 15 }}>Create a password to sign in with your FF Tag and password on your next visit.</p>
      <Field label="Password">
        <span style={{ position: "relative", display: "block" }}>
          <input className="ff-input" type={show ? "text" : "password"} autoComplete="new-password" value={pw} autoFocus
            onChange={(e) => setPw(e.target.value)} placeholder="At least six characters" style={{ paddingRight: 50 }}
            onKeyDown={(e) => e.key === "Enter" && pw.length >= 6 && !busy && create()} />
          <button type="button" onClick={(e) => { e.preventDefault(); setShow(v => !v); }} aria-label={show ? "Hide password" : "Show password"}
            style={{ position: "absolute", right: 12, top: "50%", transform: "translateY(-50%)", color: "var(--gold-dk)", display: "flex", padding: 4 }}>
            {show ? <EyeOff size={17} /> : <Eye size={17} />}
          </button>
        </span>
      </Field>
      <Btn variant="primary wide" disabled={busy || pw.length < 6} onClick={create}>
        {busy ? <Loader2 size={14} className="ff-spin" /> : <Lock size={14} />} {change ? "Change password" : "Create Password"}
      </Btn>
      <div style={{ height: 8 }} />
      <Btn variant="ghost wide" onClick={skip}>{change ? "Cancel" : "Skip for now"}</Btn>
      {err && <p className="ff-body" role="alert" style={{ color: "var(--bad)", fontSize: 12.5, margin: "10px 0 0" }}>{err}</p>}
    </Sheet>
  );
}

/* The signed-in account: Tag, verified number, sign-in methods. Used in
   Section 1 once the Tag exists, and in the account menu (FF Tag &
   sign-in), so the Tag can be changed later from either place. */
function AccountSettings() {
  const { state, dispatch } = useStore();
  const tag = state.auth.tag || state.session.tag;
  const [editing, setEditing] = useState(false);
  const [next, setNext] = useState(tag || "");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const [pwOpen, setPwOpen] = useState(false);
  const clean = AUTH_ADAPTER.cleanTag(next);
  const ok = AUTH_ADAPTER.isAvailable(clean, tag) && clean !== String(tag || "").toLowerCase();
  const phone = state.session.phone;
  const hasPw = !!state.session.passwordSet;

  const save = async () => {
    setBusy(true); setErr(null);
    try {
      const r = await AUTH_ADAPTER.changeTag(tag, clean);
      dispatch({ type: "SESSION", patch: { tag: r.tag } });
      dispatch({ type: "AUTH_SIGNED_IN", tag: r.tag, method: state.auth.method });
      dispatch({ type: "TOAST", toast: `Your FF Tag is now ${r.tag} · ${CARD_DOMAIN}/${r.tag}` });
      setEditing(false);
    } catch (e) { setErr(e.message); } finally { setBusy(false); }
  };

  return (
    <div>
      <div style={{ display: "flex", gap: 14, alignItems: "center" }}>
        <span className="ff-tagbadge">{tag}</span>
        <span style={{ minWidth: 0, display: "flex", flexDirection: "column", gap: 3 }}>
          <span className="ff-body" style={{ fontWeight: 700, color: "var(--ink)", overflowWrap: "anywhere" }}>{CARD_DOMAIN}/{tag}</span>
          <span className="ff-body ff-muted" style={{ fontSize: 12.5, display: "flex", gap: 5, alignItems: "center" }}>
            <Check size={13} color="var(--ok)" strokeWidth={2.6} /> {phone || "Number verified"}{hasPw ? " · password set" : ""}
          </span>
        </span>
      </div>
      {editing ? (
        <div style={{ marginTop: 16 }}>
          <Field label="New FF Tag" hint="3 to 8 letters or numbers.">
            <TagInput value={next} onChange={setNext} current={tag} check autoFocus label="New FF Tag" />
            <TagNote clean={clean} current={tag} />
          </Field>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            <Btn variant="primary" disabled={busy || !ok} onClick={save}>{busy ? <Loader2 size={13} className="ff-spin" /> : <Check size={13} />} Save new Tag</Btn>
            <Btn variant="ghost" onClick={() => { setEditing(false); setNext(tag); setErr(null); }}>Cancel</Btn>
          </div>
        </div>
      ) : (
        <div style={{ display: "flex", gap: 18, flexWrap: "wrap", marginTop: 12 }}>
          <button type="button" className="ff-linkbtn" onClick={() => { setNext(tag); setErr(null); setEditing(true); }}>Change Tag</button>
          <button type="button" className="ff-linkbtn" onClick={() => setPwOpen(true)}>{hasPw ? "Change password" : "Add a password"}</button>
        </div>
      )}
      {err && <p className="ff-body" role="alert" style={{ color: "var(--bad)", fontSize: 12.5, margin: "10px 0 0", fontWeight: 600 }}>{err}</p>}
      <PasswordSheet open={pwOpen} change={hasPw} onClose={() => setPwOpen(false)} />
    </div>
  );
}

/* SECTION 1 — Create your FF Tag. FF Tag + phone number -> WhatsApp code ->
   account created -> optional password. The Tag field holds a suggestion
   from the person's name until they type their own. */
function TagSection() {
  const { state, dispatch } = useStore();
  const signedIn = state.auth.status === "signedIn" && !!(state.auth.tag || state.session.tag);
  const suggestion = useMemo(() => AUTH_ADAPTER.suggestTag(state.profile.name), [state.profile.name]);
  const [typed, setTyped] = useState(null);           // null = still showing the suggestion
  const [phone, setPhone] = useState(state.session.phone || "");
  const [stage, setStage] = useState("details");      // details -> code
  const [code, setCode] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const [pwOpen, setPwOpen] = useState(false);
  const clean = AUTH_ADAPTER.cleanTag(typed === null ? suggestion : typed);
  const available = AUTH_ADAPTER.isAvailable(clean);
  const phoneOk = phone.replace(/\D/g, "").length >= 9;

  const run = async (fn) => {
    setBusy(true); setErr(null);
    try { return await fn(); } catch (e) { setErr(e.message); return null; } finally { setBusy(false); }
  };
  const send = () => run(() => AUTH_ADAPTER.sendSignupCode(clean, phone)).then(r => { if (r) { setStage("code"); setCode(""); } });
  const verify = () => run(() => AUTH_ADAPTER.verifySignupCode(clean, phone, code)).then(r => {
    if (!r) return;
    dispatch({ type: "SESSION", patch: { tag: r.tag, phone: r.phone, verified: true } });
    dispatch({ type: "AUTH_SIGNED_IN", tag: r.tag, method: r.method });
    dispatch({ type: "TOAST", toast: `${CARD_DOMAIN}/${r.tag} is yours` });
    setStage("details"); setCode("");
    setPwOpen(true);
  });

  return (
    <div id="ff-sec-tag" className="ff-tagsection">
      {signedIn ? <AccountSettings /> : stage === "details" ? (<>
        <div className="ff-tagrow">
          <Field label="FF Tag">
            <TagInput value={clean} onChange={setTyped} check />
            <TagNote clean={clean} />
          </Field>
          <Field label="Phone number">
            <input className="ff-input" type="tel" inputMode="tel" autoComplete="tel" placeholder="+44 7700 900000" value={phone}
              onChange={(e) => setPhone(e.target.value)} onKeyDown={(e) => e.key === "Enter" && available && phoneOk && !busy && send()} />
          </Field>
        </div>
        <Btn variant="primary wide" disabled={busy || !available || !phoneOk} onClick={send}>
          {busy ? <Loader2 size={14} className="ff-spin" /> : <WhatsAppIcon size={15} />} Continue
        </Btn>
        <p className="ff-body" style={{ fontSize: 13, margin: "10px 0 0", textAlign: "center" }}>
          <button type="button" className="ff-linkbtn" onClick={() => window.dispatchEvent(new Event("ff-login"))}>I already have a Tag</button></p>
      </>) : (<>
        <Field label="WhatsApp code" hint={`Sent to ${phone} · any six digits in this preview`}>
          <input className="ff-input ff-tagin" inputMode="numeric" autoComplete="one-time-code" maxLength={6} value={code} autoFocus
            onChange={(e) => setCode(e.target.value.replace(/\D/g, ""))} placeholder="000000" aria-label="Code from WhatsApp"
            onKeyDown={(e) => e.key === "Enter" && code.length === 6 && !busy && verify()} />
        </Field>
        <Btn variant="primary wide" disabled={busy || code.length < 6} onClick={verify}>
          {busy ? <Loader2 size={14} className="ff-spin" /> : <Check size={14} />} Create
        </Btn>
        <div style={{ display: "flex", justifyContent: "space-between", gap: 10, marginTop: 10, flexWrap: "wrap" }}>
          <button type="button" className="ff-linkbtn" onClick={() => { setStage("details"); setCode(""); setErr(null); }}>Change</button>
          <button type="button" className="ff-linkbtn" disabled={busy} onClick={send}>Resend code</button>
        </div>
      </>)}
      {err && <p className="ff-body" role="alert" style={{ color: "var(--bad)", fontSize: 13, margin: "10px 0 0", fontWeight: 600 }}>{err}</p>}
      <PasswordSheet open={pwOpen} onClose={() => setPwOpen(false)} />
    </div>
  );
}

/* SAVE & SHARE — at the foot of the profile. The profile already saves
   itself; Save is the explicit "done" that opens Section 5. Share sends
   the finished card to the person on WhatsApp. */
function SaveShareCard({ onSaved }) {
  const { state, dispatch } = useStore();
  const p = state.profile;
  const signedIn = state.auth.status === "signedIn";
  const { share, busy, tag } = useShareCard();
  const cardReady = !!String(p.name || "").trim() && recsOf(p, "professions").some(r => !r.proposed);
  const save = () => {
    if (!signedIn) {
      const el = document.getElementById("ff-sec-tag");
      if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
      setTimeout(() => { const i = document.querySelector('#ff-sec-tag input'); if (i) i.focus({ preventScroll: true }); }, 400);
      dispatch({ type: "TOAST", toast: "Create your FF Tag first" });
      return;
    }
    PROFILE_ADAPTER.save(tag, p).then(r => {
      dispatch({ type: "PROFILE", patch: { saved: true, savedAt: r.savedAt, finishedAt: p.finishedAt || r.savedAt } });
      dispatch({ type: "TOAST", toast: "Saved" });
      if (onSaved) onSaved();
    });
  };
  const blocker = !signedIn ? "Create your FF Tag first."
    : !cardReady ? "Add your name and a profession to share." : null;

  return (
    <div id="ff-sec-share" className="ff-publishcard" style={{ marginTop: 26 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 14 }}>
        <Coin size={30} tier="gold" />
        <span className="ff-h2" style={{ fontSize: 19, color: "var(--gold-lt)", flex: 1 }}>Save &amp; Share</span>
      </div>
      <div className="ff-sharerow">
        <button className="ff-publish-btn" onClick={save}><Check size={17} /> Save</button>
        <button className="ff-wa-btn" disabled={!!blocker || busy} onClick={share}>
          {busy ? <Loader2 size={17} className="ff-spin" /> : <WhatsAppIcon size={20} />} Share
        </button>
      </div>
      {blocker && signedIn && <p style={{ margin: "10px 0 0", fontSize: 12.5, color: "rgba(244,239,228,.72)", textAlign: "center" }}>{blocker}</p>}
      {signedIn && p.savedAt && <p style={{ margin: "10px 0 0", fontSize: 12, color: "rgba(244,239,228,.66)", display: "flex", gap: 5, alignItems: "center", justifyContent: "center" }}>
        <Check size={13} color="#8FDCAE" strokeWidth={2.4} /> Saved {timeOf(p.savedAt)}</p>}
    </div>
  );
}
