/* XP bar — same footprint as the basket bar, filling as the person earns XP
   toward their next FireFlair tier. The reward on the right is the same Coin
   used everywhere else, in that tier's metal, so "reaching Bronze" always
   looks like the same coin the rest of the app already shows for Bronze. */
/* ==========================================================================
   XP AREA — opened by the central FireFlair coin.
   Today it holds XP, level and tasks. It is deliberately the person's whole
   progression/account area, so Wallet, earnings and rewards can be added as
   further blocks here without touching the navigation.
   ========================================================================== */
/* XP Beta timeline — the current and next quarterly period, generated from
   XP_TIMELINE rather than hand-written, so a future quarter is a data change
   to XP_CURRENT_PERIOD/XP_TIMELINE, not a UI rewrite. */
function XPTimeline() {
  const idx = XP_TIMELINE.findIndex(p => p.year === XP_CURRENT_PERIOD.year && p.q === XP_CURRENT_PERIOD.q);
  const visible = XP_TIMELINE.slice(Math.max(0, idx), idx + 2);
  return (
    <div style={{ marginBottom: 16 }}>
      <div style={{ textAlign: "center", marginBottom: 8 }}>
        <span className="ff-eyebrow" style={{ fontSize: 10 }}>FF XP Beta</span>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        {visible.map((p, i) => {
          const isCurrent = p.year === XP_CURRENT_PERIOD.year && p.q === XP_CURRENT_PERIOD.q;
          return (
            <React.Fragment key={xpPeriodKey(p)}>
              <div style={{ textAlign: "center", flex: "none" }}>
                <div className="ff-display" style={{
                  fontSize: isCurrent ? 15 : 12, color: isCurrent ? "var(--ink)" : "#8C857A",
                  letterSpacing: ".06em",
                }}>{quarterLabel(p)}</div>
                <div className="ff-body ff-muted" style={{ fontSize: 9, marginTop: 2 }}>
                  {isCurrent ? "Current" : "Next"}
                </div>
              </div>
              {i < visible.length - 1 && (
                <div style={{ flex: 1, height: 2, background: "linear-gradient(90deg, var(--gold), rgba(201,162,39,.15))" }} />
              )}
            </React.Fragment>
          );
        })}
      </div>
      <p className="ff-body ff-muted" style={{ fontSize: 10.5, textAlign: "center", marginTop: 8, marginBottom: 0 }}>
        FireFlair XP runs in quarterly performance periods. Your progress resets each quarter — nothing you've earned is lost.
      </p>
    </div>
  );
}

/* THE FF COIN — "What do I need to do next?"
   The existing XP tasks, incomplete first, each one a shortcut into the part
   of Profile where it gets done. XP and tiers sit underneath as the reward. */
function XPSheet({ open, onClose }) {
  const { state, dispatch } = useStore();
  if (!open) return null;
  const info = xpProgress(state.profile.xp);
  const claimed = state.profile.xpClaimed || [];
  const qsAll = allQuestions(state);
  const answered = qsAll.filter(q => isAnswered(answerOf(state, q))).length;
  const live = !!state.profile.live;

  const tasks = [
    ...XP_TASKS.map(t => ({ ...t, done: claimed.includes(t.id), reward: `+${t.xp} XP` })),
    {
      id: "questions", label: "Answer Question Cards", hint: `${answered} of ${qsAll.length} answered`,
      done: answered >= qsAll.length, reward: `+${XP_VALUES.question} XP each`,
    },
  ];
  const todo = tasks.filter(t => !t.done);
  const done = tasks.filter(t => t.done);

  /* Send the person to where the task is done. Reuses the Profile routes:
     card editor, review screen (all categories + Question Cards), tag,
     verification, and — once live — the profile's own sections. */
  const goTask = (id) => {
    onClose();
    let focus = null;
    if (id === "create_card") focus = "card";
    else if (id === "publish_profile") focus = live ? "card" : "publish";
    else if (id === "first_review") {
      if (live) focus = "reviews";
      else { focus = "publish"; dispatch({ type: "TOAST", toast: "Publish your profile first — then ask people you've worked with for a review." }); }
    }
    else if (id === "questions") focus = "questions";
    else if (id.startsWith("add_")) focus = id.slice(4);
    if (state.role !== "team") dispatch({ type: "ROLE", role: "team" });
    dispatch({ type: "TAB", tab: "profile", route: "home" });
    if (focus) dispatch({ type: "FOCUS", focus: { target: focus } });
    else window.scrollTo(0, 0);
  };

  const Task = ({ t }) => {
    const body = (<>
      <span className="dot">{t.done && <Check size={13} strokeWidth={2.6} />}</span>
      <span style={{ flex: 1, minWidth: 0 }}>
        <span className="ff-serif" style={{ fontSize: 15.5, display: "block", color: "#1D1B18", lineHeight: 1.2, textDecoration: t.done ? "line-through" : "none", textDecorationColor: "rgba(126,97,29,.5)" }}>{t.label}</span>
        <span className="ff-body ff-muted" style={{ fontSize: 11.5 }}>{t.hint}</span>
      </span>
      {t.done ? <Pill tone="ok">Earned</Pill> : <Pill tone="gold">{t.reward}</Pill>}
      {!t.done && <ChevronRight size={16} color="var(--gold-dk)" style={{ flex: "none" }} />}
    </>);
    return t.done
      ? <div className="ff-task done">{body}</div>
      : <button className="ff-task" onClick={() => goTask(t.id)}>{body}</button>;
  };

  return (
    <Sheet open onClose={onClose} title="Your FireFlair">
      {/* XP summary — compact, the reward behind the list */}
      <div className="ff-frame ff-lattice" style={{ padding: "14px 14px 12px", marginBottom: 18, display: "flex", gap: 14, alignItems: "center" }}>
        <Corners />
        <Coin size={52} tier={info.currentTier} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: "flex", alignItems: "baseline", gap: 10 }}>
            <span className="ff-display" style={{ fontSize: 24 }}>{info.xp} XP</span>
            <span className="ff-label">{TIERS[info.currentTier].name}</span>
          </div>
          <div className="ff-xptrack" style={{ margin: "8px 0 6px", background: "rgba(20,20,22,.12)" }}>
            <div className="ff-xpfill" style={{ width: `${info.pct}%` }} />
          </div>
          <div className="ff-body ff-muted" style={{ fontSize: 11.5 }}>
            {info.next ? `${info.nextXp - info.xp} XP to ${info.next.label}` : "Top numbered tier reached"} · {state.profile.xpPeriod || 0} XP this quarter
          </div>
        </div>
      </div>

      <div style={{ display: "flex", alignItems: "baseline", gap: 10, marginBottom: 10 }}>
        <h3 className="ff-h2" style={{ fontSize: 16, flex: 1 }}>{todo.length ? "Next steps" : "All done"}</h3>
        <span className="ff-label">{done.length} of {tasks.length} done</span>
      </div>
      {todo.length === 0 && <p className="ff-body ff-muted" style={{ marginTop: 0 }}>Every task is complete. New ones arrive as FireFlair grows.</p>}
      {todo.map(t => <Task key={t.id} t={t} />)}
      {done.length > 0 && <>
        <div className="ff-label" style={{ margin: "16px 0 8px", opacity: .8 }}>Completed</div>
        {done.map(t => <Task key={t.id} t={t} />)}
      </>}

      <Divider />
      <XPTimeline />
      <div className="ff-label" style={{ marginBottom: 8 }}>Levels</div>
      {XP_LEVELS.map(l => {
        const isGold = l.tier === "gold";
        const reached = isGold ? false : info.xp >= l.xp;
        return (
          <div key={l.tier} className="ff-frame" style={{ padding: 12, marginBottom: 8, display: "flex", gap: 11, alignItems: "center", opacity: reached ? 1 : .62 }}>
            <Coin size={30} tier={l.tier} />
            <span style={{ flex: 1, minWidth: 0 }}>
              <span className="ff-display" style={{ fontSize: 13, display: "block" }}>
                {l.label} · {isGold ? `Top performers — ${quarterLabel(XP_CURRENT_PERIOD)}` : `${l.xp} XP`}
              </span>
              <span className="ff-body ff-muted" style={{ fontSize: 11.5 }}>{l.unlocks}</span>
            </span>
            {isGold ? <Pill tone="warn">Quarterly</Pill> : reached ? <Pill tone="ok"><Check size={10} /> Unlocked</Pill> : <Pill>Locked</Pill>}
          </div>
        );
      })}
      <p className="ff-body ff-muted" style={{ fontSize: 11.5, margin: "12px 0 0" }}>
        Wallet, earnings and rewards will live here too — this is your FireFlair account area.
      </p>
    </Sheet>
  );
}

}

/* PROFILE PAGE — everything about "me" on one page. Not live: FF AI, the
   card (saving as you type), CV, the full profile underneath, then publish
   (tag + verification) — no separate screens. Live: the card and profile. */
function ProfilePage() {
  const { state } = useStore();
  return state.profile.live ? <TeamProfile /> : <ProfileBuilder />;
}

/* The card editor wired straight to the profile records: the card always
   shows what the profile holds, and every edit writes to it immediately, so
   the card and the sections below can never disagree. */
function CardBuilder() {
  const { state, dispatch } = useStore();
  const d = draftFromProfile(state);
  const CATS = ["professions", "skills", "interests", "locations", "languages"];
  const setD = (next) => {
    const nd = typeof next === "function" ? next(d) : next;
    const changed = CATS.filter(c => JSON.stringify(nd[c] || []) !== JSON.stringify(d[c] || []));
    if (changed.length) syncCardRecords(state, dispatch, nd, changed);
    if (nd.name !== d.name || nd.photo !== d.photo) dispatch({ type: "PROFILE", patch: { name: nd.name, photo: nd.photo } });
    if (String(nd.name || "").trim() && (nd.professions || []).length && !(state.profile.xpClaimed || []).includes("create_card")) {
      dispatch({ type: "CARD_CREATED_XP" });
      dispatch({ type: "TOAST", toast: `Profile Card created · +${XP_VALUES.task} XP` });
    }
  };
  return (
    <>
      <EditablePlayerCard draft={d} setDraft={setD} themeKey={state.profile.theme}
        tag={state.session.tag || "-----"} tier={state.profile.tier} level={state.profile.level}
        onPhoto={(url) => setD(x => ({ ...x, photo: url }))} />
      <ProfessionPicker selected={d.professions}
        onPick={(n) => setD(x => {
          const on = (x.professions || []).some(v => v.toLowerCase() === n.toLowerCase());
          return { ...x, professions: on ? x.professions.filter(v => v.toLowerCase() !== n.toLowerCase()) : [...(x.professions || []), n] };
        })} />
      <div style={{ display: "flex", gap: 10, justifyContent: "center", flexWrap: "wrap", margin: "16px 0 4px" }}>
        {Object.entries(THEMES).map(([k, th]) => (
          <button key={k} onClick={() => dispatch({ type: "PROFILE", patch: { theme: k } })} aria-label={`${th.name} card`} title={th.name}
            style={{ width: 30, height: 30, borderRadius: "50%", background: th.swatch, border: state.profile.theme === k ? "2px solid var(--gold)" : "1px solid var(--rule)" }} />
        ))}
      </div>
    </>
  );
}

/* CV upload, in place. Honest about the extraction service not being
   connected; proposals (when there is one) land in the sections below. */
function CVPanel() {
  const { dispatch } = useStore();
  const ref = useRef(null);
  const [st, setSt] = useState(null);
  const onFile = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    e.target.value = "";
    setSt({ busy: true, msg: `Reading ${f.name}…` });
    CV_ADAPTER.extract(f)
      .then(x => { dispatch({ type: "RECORDS_MERGE", byCategory: recordsFromExtraction(x) }); setSt({ msg: "Proposed cards added below — accept, edit or reject each one." }); })
      .catch(err => setSt({ msg: err.message }));
  };
  return (
    <div id="ff-sec-cv" className="ff-frame" style={{ padding: 12, marginTop: 14, display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap" }}>
      <FileText size={20} color="var(--gold-dk)" strokeWidth={1.5} style={{ flex: "none" }} />
      <span style={{ flex: 1, minWidth: 180 }}>
        <span className="ff-display" style={{ fontSize: 13, display: "block" }}>Have a CV?</span>
        <span className="ff-body ff-muted" style={{ fontSize: 12 }}>Upload it and FireFlair proposes Information Cards below. You accept, edit or reject each one.</span>
        {st && <span className="ff-body" style={{ fontSize: 12, display: "flex", gap: 6, alignItems: "center", marginTop: 6 }}>
          {st.busy && <Loader2 size={13} className="ff-spin" />}{st.msg}</span>}
      </span>
      <input ref={ref} type="file" accept=".pdf,.docx,.txt,.md,image/*" onChange={onFile} style={{ display: "none" }} />
      <Btn variant="sm" disabled={st && st.busy} onClick={() => ref.current && ref.current.click()}><Upload size={12} /> Upload CV</Btn>
    </div>
  );
}

/* Publish, in place: tag + phone verification at the bottom of the page. */
function PublishPanel() {
  const { state, dispatch } = useStore();
  const p = state.profile;
  const cardReady = !!String(p.name || "").trim() && recsOf(p, "professions").some(r => !r.proposed);
  const [tag, setTag] = useState(state.session.tag || "");
  const clean = tag.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 5);
  const taken = TAKEN_TAGS.includes(clean) && clean !== state.session.tag;
  const tagOk = clean.length === 5 && !taken;
  const [phone, setPhone] = useState(state.session.phone || "");
  const [sent, setSent] = useState(false);
  const [code, setCode] = useState("");
  const phoneOk = phone.replace(/\D/g, "").length >= 9;

  const publish = () => {
    dispatch({ type: "SESSION", patch: { tag: clean, phone, verified: true } });
    dispatch({ type: "PROFILE", patch: { live: true } });
    const fresh = !(p.xpClaimed || []).includes("publish_profile");
    dispatch({ type: "PUBLISH_XP" });
    dispatch({ type: "TOAST", toast: `Your profile is live at ${CARD_DOMAIN}/${clean}${fresh ? ` · +${XP_VALUES.task} XP` : ""}` });
    window.scrollTo(0, 0);
  };

  return (
    <div id="ff-sec-publish" className="ff-frame" style={{ padding: 16 }}>
      <Corners />
      {!cardReady && (
        <p className="ff-body" style={{ marginTop: 0, display: "flex", gap: 8, alignItems: "flex-start" }}>
          <AlertCircle size={15} color="var(--gold-dk)" style={{ flex: "none", marginTop: 3 }} /> Add your name and at least one profession to your card first.
        </p>
      )}
      <Field label="Your tag" hint="Five characters, chosen by you. It becomes your profile address, your referral code and how people find you.">
        <input className="ff-input ff-tagin" maxLength={5} value={clean} onChange={(e) => setTag(e.target.value)} placeholder="ALEXG" aria-label="Your tag" />
      </Field>
      <div style={{ textAlign: "center", margin: "-6px 0 12px", minHeight: 22 }}>
        {clean.length === 5 && (taken
          ? <span className="ff-pill bad"><X size={11} /> {clean} is taken</span>
          : <span className="ff-pill ok"><Check size={11} /> {CARD_DOMAIN}/{clean} is yours</span>)}
      </div>
      <Field label="Mobile number" hint="We send one code. Nothing is published until you verify.">
        <input className="ff-input" type="tel" placeholder="+44 7700 900000" value={phone} disabled={sent} onChange={(e) => setPhone(e.target.value)} />
      </Field>
      {!sent ? (
        <Btn variant="primary wide" disabled={!cardReady || !tagOk || !phoneOk} onClick={() => setSent(true)}><Phone size={15} /> Send my code</Btn>
      ) : (<>
        <Field label="Six-digit code" hint={`Sent to ${phone}. In this preview any six digits will do.`}>
          <input className="ff-input ff-tagin" inputMode="numeric" maxLength={6} value={code}
            onChange={(e) => setCode(e.target.value.replace(/\D/g, ""))} placeholder="000000" aria-label="Six-digit code" />
        </Field>
        <Btn variant="primary wide" disabled={code.length < 6 || !tagOk} onClick={publish}><ShieldCheck size={15} /> Verify and publish</Btn>
        <div style={{ height: 8 }} />
        <Btn variant="ghost wide" onClick={() => { setSent(false); setCode(""); }}>Change number</Btn>
      </>)}
    </div>
  );
}

function ProfileBuilder() {
  const { state } = useStore();
  const p = state.profile;
  const me = meAsStaff(p, state.session);
  const cardReady = !!String(p.name || "").trim() && recsOf(p, "professions").some(r => !r.proposed);
  const filled = categoryOrder(p).filter(k => recsOf(p, k).some(r => !r.proposed)).length;
  return (
    <div>
      <div className="ff-eyebrow">FF Team · Profile</div>
      <h1 className="ff-h1" style={{ marginTop: 4 }}>Build your Profile Card</h1>

      </p>

      <AIProfileCompletion />

      <StepHead n={1} title="Your Profile Card" note="Type straight onto it — it saves to your profile as you go." done={cardReady} />

      <StepHead n={2} title="Your profile" done={filled >= 5}

      <ProfileSections person={me} isMe />

      <StepHead n={3} title="Publish" note="Choose your tag and verify your number — the only point we ask for it." />

  );
}

/* PROFILE — "build and manage me". Before the profile is live this IS the
   card-building journey (card → review → tag → verify); afterwards it's the
   card, its information cards and Question Cards. Same records throughout. */
function ProfileTab() {
  const { state } = useStore();
  const { route, profile } = state;
  if (route === "build") return <BuildScreen />;
  if (route === "extract") return <ExtractScreen />;
  if (route === "manual") return <ManualBuild />;
  if (route === "review") return <ReviewScreen />;
  if (!profile.live) {
    if (route === "tag") return <TagScreen />;
    if (route === "phone") return <PhoneScreen />;
    return <ManualBuild />;
  }
  if (route === "live") return <LiveScreen />;
  return <TeamProfile />;
}

function TeamRouter() {
  const { state } = useStore();
  const { tab } = state;
  if (state.viewing) return <PersonProfile />;
  if (tab === "network") return <NetworkScreen />;
  if (tab === "bookings") return <TeamBookings />;
  if (tab === "profile") return <ProfilePage />;
  return <TeamHome />;
}

function StaffRouter() {
  const { state } = useStore();
  const { route, tab } = state;
  if (state.viewing) return <PersonProfile />;
  if (tab === "network") return <StaffRoster />;
  if (tab === "bookings") return <StaffBookings />;
  if (tab === "profile") return <StaffProfile />;
  if (route === "eventNew") return <EventNew />;
  if (route === "eventPage" || route === "shiftNew" || route === "shiftSend") return state.activeEventId ? <EventPage /> : <EventNew />;
  if (route === "companyEdit") return <CompanyEdit />;
  return <StaffHome />;
}

/* ==========================================================================
   ROOT — persistence via the `db` capability.
   Each viewer's own state (role, session, profile, connections, invitations,
   events, shifts, engagements, selection) lives under their private
   data/users/{self} subtree, so a reload or a later visit picks up where
   they left off. Demo directory/venues/services stay static — not persisted.
   ========================================================================== */

const PERSIST_KEYS = ["feedback", "role", "route", "tab", "session", "profile", "connections", "invitations", "reviews", "reviewRequests", "events", "shifts", "engagements", "selection", "categoryVisibility", "credits", "company", "activeEventId"];

function pickPersisted(state) {
  const out = {};
  PERSIST_KEYS.forEach(k => { out[k] = state[k]; });
  return out;
}

function FireFlair() {
  const [state, baseDispatch] = useReducer(reducer, initialState);
  const dbDocRef = useRef(null);
  const saveTimer = useRef(null);
  const hydratedRef = useRef(false);

  const dispatch = React.useCallback((action) => {
    baseDispatch(action);
  }, []);

  const store = useMemo(() => ({ state, dispatch }), [state, dispatch]);

  // Capture the FireFlair referral tag once, on load.
  useEffect(() => { dispatch({ type: "SESSION", patch: { refTag: "SAM42" } }); }, []);

  // Hydrate from db on mount.
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const db = await (window.claude && window.claude.use ? window.claude.use("db") : Promise.resolve(null));
        if (!db || cancelled) return;
        const ref = db.doc("fireflair/state");
        dbDocRef.current = ref;
        const snap = await ref.get();
        if (!cancelled && snap.exists) {
          const saved = snap.data() || {};
          /* Schema guard: discard a snapshot saved by an earlier build whose
             profile shape this version no longer understands, rather than
             hydrate into a broken state. */
          const stale = saved.profile && (!saved.profile.records || typeof saved.profile.xp === "undefined");
          if (stale) { hydratedRef.current = true; return; }
          const patch = {};
          PERSIST_KEYS.forEach(k => { if (saved[k] !== undefined) patch[k] = saved[k]; });
          /* Bookings saved before FF Staff 1.0 used multi-person shifts. Start
             those viewers on the new one-person Shift Card demo data instead. */
          if (Array.isArray(saved.shifts) && saved.shifts.length && !saved.shifts.some(x => x && "staffId" in x)) {
            delete patch.events; delete patch.shifts; delete patch.engagements;
            if (patch.route === "shiftNew" || patch.route === "shiftSend") patch.route = "staffHome";
          }
          if (patch.profile) {
            patch.profile = { ...patch.profile, records: { ...emptyRecords(), ...(patch.profile.records || {}) }, xp: patch.profile.xp || 0, media: patch.profile.media || [] };
            patch.profile = rollXPPeriodIfNeeded(patch.profile);
          }
          if (Object.keys(patch).length) dispatch({ type: "HYDRATE", patch });
        }
      } catch (e) {
        // No db available, or hydration failed — carry on with in-memory state.
      } finally {
        hydratedRef.current = true;
      }
    })();
    return () => { cancelled = true; };
  }, []);

  // Debounced save on every change, once hydration has had its chance to run.
  useEffect(() => {
    if (!dbDocRef.current) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      dbDocRef.current.set(pickPersisted(state)).catch(() => {});
    }, 500);
    return () => { if (saveTimer.current) clearTimeout(saveTimer.current); };
  }, [state]);

  return (
    <Store.Provider value={store}>
      <style>{CSS}</style>
      <div className="ff">
        <Shell>{state.viewing ? <PersonProfile /> : state.role === "team" ? <TeamRouter /> : state.role === "staff" ? <StaffRouter /> : <Landing />}</Shell>
      </div>
    </Store.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<FireFlair />);
</script>
