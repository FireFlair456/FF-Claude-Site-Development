/* XP ladder — each rung names the tier metal it unlocks, so the reward badge
   is always drawn from the same Coin/FFEmblem art used everywhere else in
   the card system, never a separate gamification graphic. Extensible: add a
   rung here and the XP bar, profile badge and level-up state all follow. */
/* XP ladder. Bronze and Silver are fixed thresholds; Gold is NOT a number —
   it's awarded to the current quarter's top performers, so it can never be
   invented as a fixed XP figure. xpProgress() treats Gold as "reached" only
   when the caller says so (goldEligible), never from the xp value alone. */
const XP_LEVELS = [
  { tier: "bronze", xp: 100, label: "Bronze", unlocks: "First level of profile customisation" },
  { tier: "silver", xp: 500, label: "Silver", unlocks: "Additional profile customisation" },
  { tier: "gold",   xp: null, label: "Gold",   unlocks: "Premium profile customisation", earnedBy: "quarter-top-performers" },
];
const XP_NUMERIC_LEVELS = XP_LEVELS.filter(l => typeof l.xp === "number");

/* ==========================================================================
   XP PERIODS — professional quarterly structure.
   One generator, not months hand-written across the UI: give it a start
   quarter and a count, and it produces the sequence with each quarter's
   months derived from its number. Extending the beta into more quarters is
   a config change here, not a UI change.
   ========================================================================== */
const QUARTER_MONTHS = [
  ["January", "February", "March"], ["April", "May", "June"],
  ["July", "August", "September"], ["October", "November", "December"],
];

function quarterAfter(year, q) { return q === 4 ? { year: year + 1, q: 1 } : { year, q: q + 1 }; }
function quarterLabel(p) { return `${p.year} Q${p.q}`; }
function quarterMonths(p) { return QUARTER_MONTHS[p.q - 1]; }

function generateQuarters(startYear, startQ, count) {
  const out = [];
  let cur = { year: startYear, q: startQ };
  for (let i = 0; i < count; i++) { out.push(cur); cur = quarterAfter(cur.year, cur.q); }
  return out;
}

/* The single source of truth for "what quarter is it": change these two
   numbers and the whole XP Beta timeline, labels and reset behaviour move
   with it — nothing else in the app hardcodes a quarter. */
const XP_BETA_START = { year: 2026, q: 4 };
const XP_CURRENT_PERIOD = { year: 2026, q: 4 };
const XP_TIMELINE = generateQuarters(XP_BETA_START.year, XP_BETA_START.q, 5);
const xpPeriodKey = (p) => `${p.year}Q${p.q}`;

function xpProgress(xp) {
  const cur = xp || 0;
  const next = XP_NUMERIC_LEVELS.find(l => cur < l.xp);
  const prevXp = (() => {
    const i = next ? XP_NUMERIC_LEVELS.indexOf(next) : XP_NUMERIC_LEVELS.length;
    return i > 0 ? XP_NUMERIC_LEVELS[i - 1].xp : 0;
  })();
  const reached = XP_NUMERIC_LEVELS.filter(l => cur >= l.xp);
  const currentTier = reached.length ? reached[reached.length - 1].tier : "standard";
  if (!next) return { xp: cur, next: null, pct: 100, currentTier, prevXp, nextXp: cur || 1 };
  const span = next.xp - prevXp;
  const pct = span > 0 ? Math.min(100, Math.max(0, ((cur - prevXp) / span) * 100)) : 0;
  return { xp: cur, next, pct, currentTier, prevXp, nextXp: next.xp };
}

/* PROFESSIONS — FF Team Profession & Question Reference v1.6.
   People choose professions, never categories. The system assigns each
   profession to one of seven display categories; the person's top (first)
   profession decides where they appear on Network. Five suggestions per
   category for quick picking; any profession can be typed in. */
const PROFESSION_CATEGORIES = [
  { key: "Bar",            suggested: ["Barback", "Bartender", "Cocktail Bartender", "Flair Bartender", "Mixologist"] },
  { key: "Front of House", suggested: ["Waiter", "Host", "Front of House", "Event Host", "Catering Assistant"] },
  { key: "Chefs",          suggested: ["Chef", "Private Chef", "Event Chef", "Sous Chef", "Caterer"] },
  { key: "Management",     suggested: ["Event Manager", "Event Planner", "Bar Manager", "Floor Manager", "Kitchen Manager"] },
  { key: "Entertainment",  suggested: ["DJ", "Saxophonist", "Violinist", "Singer", "Magician"] },
  { key: "Services",       suggested: ["Photographer", "Videographer", "Content Creator", "Influencer", "Event Stylist"] },
  { key: "Back of House",  suggested: ["Stock Manager", "Stock Controller", "Kitchen Porter", "Kitchen Assistant", "Logistics Assistant"] },
];
const CATEGORY_ORDER = [...PROFESSION_CATEGORIES.map(c => c.key), "Other"];
/* Assignment for professions outside the suggestion lists. Checked in this
   order, so "Bar Manager" is Management and "Kitchen Porter" Back of House. */
const PROFESSION_RULES = [
  ["Management", /\b(manager|planner|coordinator|director|supervisor)\b/],
  ["Back of House", /\b(stock|porter|kitchen assistant|logistics|cellar)\b/],
  ["Bar", /\b(bar|bartend\w*|mixolog\w*|barback|barista|sommelier)\b/],
  ["Chefs", /\b(chef|cook|caterer|pastry|baker)\b/],
  ["Front of House", /\b(waiter|waitress|host|hostess|front of house|server|catering assistant|usher|runner)\b/],
  ["Entertainment", /\b(dj|music\w*|singer|sax\w*|violin\w*|magician|mc|band|performer|dancer|entertainer)\b/],
  ["Services", /\b(photo\w*|video\w*|content|influencer|stylist|florist|make-?up|decor\w*)\b/],
];
/* Category for one profession; null when it can't be determined (FF AI then
   asks the person to confirm). An explicit override always wins. */
function professionCategory(name, override) {
  if (override) return override;
  const n = String(name || "").trim().toLowerCase();
  if (!n) return null;
  const exact = PROFESSION_CATEGORIES.find(c => c.suggested.some(x => x.toLowerCase() === n));
  if (exact) return exact.key;
  const rule = PROFESSION_RULES.find(([, re]) => re.test(n));
  return rule ? rule[0] : null;
}
const personCategory = (p) => professionCategory(p.profession, p.categoryOverride) || "Other";

/* ==========================================================================
   3. DATA MODEL — records, not value-blobs.
   A profile is a set of Information Records grouped by category. Each record
   has its own identity, so the Profile Card can REFERENCE the primaries
   rather than duplicating their content. Categories live in a registry so
   new ones can be added later without redesigning the profile.
   ========================================================================== */

const uid = (p = "id") => `${p}_${Math.random().toString(36).slice(2, 8)}`;

/* Field capabilities per category. A category declares what it needs;
   nothing gets fields it has no use for. */
const BASE_CATEGORIES = {
  professions: {
    label: "Professions", singular: "Profession", icon: "profession",
    onCard: true, cardLimit: 3, fields: ["description", "media"],
    placeholder: "Cocktail Bartender",
  },
  qualifications: {
    label: "Qualifications", singular: "Qualification", icon: "qualification",
    onCard: false, fields: ["description", "document"],
    placeholder: "Personal Licence",
  },
  skills: {
    label: "Skills", singular: "Skill", icon: "skills",
    onCard: true, cardLimit: 3, fields: ["description", "media"],
    placeholder: "Cocktail Mixology",
  },
  interests: {
    label: "Interests", singular: "Interest", icon: "interests",
    onCard: true, cardLimit: 3, fields: ["description", "media"],
    placeholder: "Music",
  },
  locations: {
    label: "Work locations", singular: "Location", icon: "location",
    onCard: true, cardLimit: 3, fields: ["description"],
    placeholder: "Central London",
  },
  languages: {
    label: "Languages", singular: "Language", icon: "languages",
    onCard: true, cardLimit: 5, fields: ["proficiency", "description", "media"],
    placeholder: "Spanish",
  },
  reviews: {
    label: "Reviews & References", singular: "Review", icon: "review",
    onCard: false, fields: ["rating", "description"], system: true,
    placeholder: "Reliable, great with guests",
  },
  experience: {
    label: "Experience", singular: "Experience", icon: "experience",
    onCard: false, fields: ["description", "media"],
    placeholder: "The Loft Lounge — Head Bartender",
  },
};

const REVIEW_MAX = 5;

/* Categories shown on the Profile Card, in card order. */
const CARD_CATEGORIES = ["professions", "skills", "interests", "locations", "languages"];

const PROFICIENCY = ["Native", "Fluent", "Professional", "Conversational", "Basic"];

/* Merge built-in categories with any the user has added at runtime. */
const allCategories = (profile) => ({ ...BASE_CATEGORIES, ...(profile.categories || {}) });
const categoryDef = (profile, key) => allCategories(profile)[key] || { label: key, singular: key, icon: "skills", fields: ["description", "media"] };
const categoryOrder = (profile) => Object.keys(allCategories(profile));
const catHas = (def, field) => (def.fields || []).includes(field);

const makeRecord = (category, name, extra = {}) => ({
  id: uid("rec"),
  category,
  name: String(name || "").trim(),
  description: "",
  media: [],          // [{ id, name, dataUrl }]
  document: null,     // { name, size, type, dataUrl }
  proficiency: "",
  primary: false,
  proposed: false,    // true while awaiting user review (CV adapter)
  source: { origin: "manual", location: null, confidence: "confirmed" },
  ...extra,
});

const recsOf = (profile, cat) => (profile.records && profile.records[cat]) || [];

/* The Profile Card reads primaries. If nothing is flagged primary we fall
   back to the first few, so a fresh profile still renders a usable card. */
/* v1.6: ORDER decides what's on the card — the first items in each
   category (three; five for language flags). A display order, not a rank. */
function primaryNames(profile, cat, limit) {
  return recsOf(profile, cat).filter(r => !r.proposed).slice(0, limit).map(r => r.name).filter(Boolean);
}
function primaryNamesByFlag(profile, cat, limit) {
  const all = recsOf(profile, cat);
  const flagged = all.filter(r => r.primary && !r.proposed);
  const live = all.filter(r => !r.proposed);
  return (flagged.length ? flagged : live).slice(0, limit).map(r => r.name).filter(Boolean);
}

const emptyRecords = () => Object.keys(BASE_CATEGORIES).reduce((m, k) => { m[k] = []; return m; }, {});

/* Read-only records synthesised for directory people, so that opening
   someone else's profile uses the same Information Card components. */
/* Reviews written ABOUT a person, newest first, shaped as records so they
   render through the same Information Card as everything else. */
function reviewRecordsFor(state, personId) {
  return (state.reviews || [])
    .filter(r => r.aboutId === personId)
    .sort((a, b) => b.at - a.at)
    .map(r => ({
      ...makeRecord("reviews", `${r.rating}★ from ${r.byName}`),
      id: r.id, description: r.text, rating: r.rating, primary: true, readOnly: true,
    }));
}

function recordsForPerson(state, person) {
  if (person.id === "me") return { ...state.profile.records, reviews: reviewRecordsFor(state, "me") };
  const mk = (cat, arr) => (arr || []).filter(Boolean).map(n => ({
    ...makeRecord(cat, n), id: `${person.id}_${cat}_${String(n).replace(/\W+/g, "")}`,
    primary: true, readOnly: true,
  }));
  return {
    professions: mk("professions", [person.profession]),
    skills: mk("skills", person.skills),
    interests: mk("interests", person.interests),
    locations: mk("locations", person.locations),
    languages: mk("languages", person.languages),
    qualifications: [], reviews: reviewRecordsFor(state, person.id), experience: [],
  };
}

const THEME_KEYS = ["ivory", "onyx", "oxblood", "ivory"];
const themeFor = (seed) => {
  let h = 0; for (let i = 0; i < String(seed).length; i++) h = (h * 31 + String(seed).charCodeAt(i)) >>> 0;
  return THEME_KEYS[h % THEME_KEYS.length];
};

const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const monthKey = (iso) => (iso ? iso.slice(0, 7) : "unscheduled");
const monthLabel = (key) => key === "unscheduled" ? "Not yet dated" : `${MONTHS[Number(key.slice(5, 7)) - 1]} ${key.slice(0, 4)}`;

function byMonth(items) {
  const groups = {};
  [...items].sort((a, b) => String(a.iso || "9").localeCompare(String(b.iso || "9")))
    .forEach(i => { const k = monthKey(i.iso); (groups[k] = groups[k] || []).push(i); });
  return Object.entries(groups);
}

const withRecords = (s, cat, list) => ({
  ...s, profile: { ...s.profile, records: { ...s.profile.records, [cat]: list } },
});

/* Claim a task once. Re-claiming is a no-op, so XP can never be farmed by
   repeating the same action. Every award lands in xpLog for Core to read. */
/* Quarter rollover — if the profile's stored xpPeriodKey no longer matches
   the live current quarter, archive that period's final total into history
   and start the new quarter at 0. All-time xp/xpLog are untouched: this
   only ever resets the CURRENT-period counter. */
function rollXPPeriodIfNeeded(profile) {
  const liveKey = xpPeriodKey(XP_CURRENT_PERIOD);
  if (profile.xpPeriodKey === liveKey) return profile;
  const closed = { period: profile.xpPeriodKey, xp: profile.xpPeriod || 0 };
  return {
    ...profile,
    xpPeriod: 0,
    xpPeriodKey: liveKey,
    xpHistory: [...(profile.xpHistory || []), closed],
  };
}

function claimXP(s, taskId, amount) {
  const claimed = s.profile.xpClaimed || [];
  if (claimed.includes(taskId)) return s;
  const xp = amount === undefined ? XP_VALUES.task : amount;
  return {
    ...s,
    profile: {
      ...s.profile,
      xp: (s.profile.xp || 0) + xp,
      xpPeriod: (s.profile.xpPeriod || 0) + xp,
      xpClaimed: [...claimed, taskId],
      xpLog: [...(s.profile.xpLog || []), { id: taskId, xp, at: Date.now() }],
    },
  };
}

/* Claim the matching "Add …" task once a category holds real (non-proposed)
   records, however they were added — card editor, review screen or CV. Uses
   the existing claim-once system, so XP can never be awarded twice. */
function claimListXP(s, cat, list) {
  const id = xpTaskFor(cat);
  if (!XP_TASKS.some(t => t.id === id)) return s;
  if (!(list || []).some(r => r && !r.proposed && String(r.name || "").trim())) return s;
  return claimXP(s, id);
}

function reducer(s, a) {
  switch (a.type) {
    case "FOCUS":     return { ...s, focus: a.focus };
    case "NET_QUERY": return { ...s, netQuery: a.q || "" };
    case "ROLE":      return { ...s, viewing: null, role: a.role, tab: "home", route: a.role === "team" ? (s.profile.live ? "live" : "entry") : "staffHome" };
    case "GO":        return { ...s, route: a.route };
    case "TAB":       return { ...s, viewing: null, tab: a.tab, route: a.route ?? s.route };
    case "SESSION":   return { ...s, session: { ...s.session, ...a.patch } };
    case "PROFILE":   return { ...s, profile: { ...s.profile, ...a.patch } };

    case "REC_ADD":   return claimXP(withRecords(s, a.category, [...recsOf(s.profile, a.category), a.record]), xpTaskFor(a.category));
    case "REC_PATCH":
      return withRecords(s, a.category, recsOf(s.profile, a.category).map(r => r.id === a.id ? { ...r, ...a.patch } : r));
    case "REC_DELETE":
      return withRecords(s, a.category, recsOf(s.profile, a.category).filter(r => r.id !== a.id));
    case "REC_PRIMARY": {
      const def = categoryDef(s.profile, a.category);
      const limit = def.cardLimit || 3;
      const list = recsOf(s.profile, a.category);
      const current = list.filter(r => r.primary).length;
      if (a.primary && current >= limit) return { ...s, toast: `Your card shows ${limit} ${def.label.toLowerCase()} at a time. Unpick one first.` };
      return withRecords(s, a.category, list.map(r => r.id === a.id ? { ...r, primary: a.primary } : r));
    }
    case "REC_ACCEPT": {
      const list = recsOf(s.profile, a.category).map(r => r.id === a.id ? { ...r, proposed: false } : r);
      return claimListXP(withRecords(s, a.category, list), a.category, list);
    }
    case "REC_MOVE": {
      const list = [...recsOf(s.profile, a.category)];
      const i = list.findIndex(r => r.id === a.id), j = i + a.dir;
      if (i < 0 || j < 0 || j >= list.length) return s;
      [list[i], list[j]] = [list[j], list[i]];
      return withRecords(s, a.category, list);
    }
    case "REC_BULK":  return claimListXP(withRecords(s, a.category, a.list), a.category, a.list);
    case "RECORDS_MERGE": {
      const next = { ...s.profile.records };
      Object.entries(a.byCategory).forEach(([cat, list]) => { next[cat] = [...(next[cat] || []), ...list]; });
      let out = { ...s, profile: { ...s.profile, records: next } };
      Object.keys(a.byCategory).forEach(cat => { out = claimListXP(out, cat, next[cat]); });
      return out;
    }
    case "CATEGORY_ADD": {
      const key = a.key;
      if (allCategories(s.profile)[key]) return { ...s, toast: "That category already exists." };
      return {
        ...s, profile: {
          ...s.profile,
          categories: { ...(s.profile.categories || {}), [key]: a.def },
          records: { ...s.profile.records, [key]: [] },
        },
        toast: `${a.def.label} added as a category`,
      };
    }

    case "SELECT": {
      const on = s.selection.includes(a.id);
      return { ...s, selection: on ? s.selection.filter(x => x !== a.id) : [...s.selection, a.id] };
    }
    case "CLEAR_SELECTION": return { ...s, selection: [] };
    case "TOGGLE_CATEGORY":
      return { ...s, categoryVisibility: { ...s.categoryVisibility, [a.key]: a.visible ?? !(s.categoryVisibility[a.key] !== false) } };
    case "MEDIA_ADD":    return { ...s, profile: { ...s.profile, media: [...(s.profile.media || []), a.item] } };
    case "MEDIA_DELETE": return { ...s, profile: { ...s.profile, media: (s.profile.media || []).filter(m => m.id !== a.id) } };

    case "EVENT_ADD":  return { ...s, events: [...s.events, a.event], activeEventId: a.event.id };
    case "EVENT_PATCH": return { ...s, events: s.events.map(e => e.id === a.id ? { ...e, ...a.patch } : e) };
    case "ACTIVE_EVENT": return { ...s, activeEventId: a.id, viewing: null };
    case "SHIFT_ADD":  return { ...s, shifts: [...s.shifts, a.shift] };
    case "SHIFT_PATCH": return { ...s, shifts: s.shifts.map(x => x.id === a.id ? { ...x, ...a.patch } : x) };
    case "SHIFT_DELETE": return { ...s, shifts: s.shifts.filter(x => x.id !== a.id) };
    case "SHIFT_DUPLICATE": {
      const src = s.shifts.find(x => x.id === a.id);
      if (!src) return s;
      const copy = { ...src, id: uid("shf"), staffId: a.staffId || "", skills: [...(src.skills || [])] };
      const i = s.shifts.findIndex(x => x.id === a.id);
      const shifts = [...s.shifts]; shifts.splice(i + 1, 0, copy);
      return { ...s, shifts, toast: "Shift Card duplicated — amend it and assign someone" };
    }

    case "CREDITS_BUY": return {
      ...s, credits: {
        balance: (s.credits?.balance || 0) + a.n,
        log: [...(s.credits?.log || []), { kind: "bought", n: a.n, at: Date.now() }],
      },
    };

    /* Send one Availability Card per Shift Card, each to the person assigned
       to it. Each request reserves a credit; nothing is used until they confirm. */
    case "SEND_REQUESTS": {
      const now = Date.now();
      const made = a.shiftIds.map(id => {
        const sh = s.shifts.find(x => x.id === id);
        return {
          id: uid("eng"), shiftId: id, staffId: sh.staffId, state: "requested", credit: true,
          sentAt: now, expiresAt: now + RESPONSE_MS, questions: a.questions || [],
          history: [{ state: "requested", at: now }],
        };
      });
      const sentStaff = made.map(m => m.staffId);
      return { ...s, engagements: [...s.engagements, ...made], selection: s.selection.filter(x => !sentStaff.includes(x)) };
    }
    case "REQUESTS": {
      const made = a.staffIds.map(sid => ({
        id: uid("eng"), shiftId: a.shiftId, staffId: sid,
        state: "requested", history: [{ state: "requested", at: Date.now() }],
      }));
      return { ...s, engagements: [...s.engagements, ...made], selection: [] };
    }
    case "ENG_STATE": {
      let credits = s.credits || { balance: 0, log: [] };
      const engagements = s.engagements.map(e => {
        if (e.id !== a.id) return e;
        let next = { ...e, state: a.state, history: [...e.history, { state: a.state, at: Date.now() }] };
        /* A credit is used only on a confirmed response, and only once. */
        if (a.state === "confirmed" && e.credit && !e.creditUsed) {
          next.creditUsed = true;
          credits = { balance: Math.max(0, credits.balance - 1), log: [...credits.log, { kind: "used", n: 1, shiftId: e.shiftId, at: Date.now() }] };
        }
        return next;
      });
      return { ...s, engagements, credits };
    }
    /* Requests with no reply inside the response window expire; their
       credit is released back for a replacement or a future booking. */
    case "EXPIRE_DUE": {
      const now = Date.now();
      const due = s.engagements.some(e => e.state === "requested" && e.credit && e.expiresAt && e.expiresAt <= now);
      if (!due) return s;
      return {
        ...s, engagements: s.engagements.map(e => e.state === "requested" && e.credit && e.expiresAt && e.expiresAt <= now
          ? { ...e, state: "expired", history: [...e.history, { state: "expired", at: now }] } : e),
      };
    }
    case "COMPANY_SAVE": return { ...s, company: { ...(s.company || {}), ...a.company } };
    case "COMPANY_REVIEW_ADD": return { ...s, company: { ...s.company, reviews: [a.review, ...((s.company && s.company.reviews) || [])] } };

    case "PUBLISH_XP": return claimXP(s.profile.name ? claimXP(s, "create_card") : s, "publish_profile");
    case "CARD_CREATED_XP": return claimXP(s, "create_card");
    case "ANSWER": {
      const q = QUESTIONS.find(x => x.id === a.qid);
      const aiList = s.profile.aiQuestions || [];
      let prevVal, next;
      if (q && q.group === "feedback") {
        /* Feedback is product research — kept apart from the profile. */
        prevVal = (s.feedback || {})[a.qid];
        next = { ...s, feedback: { ...(s.feedback || {}), [a.qid]: a.value } };
      } else if (!q && aiList.some(x => x.id === a.qid)) {
        prevVal = aiList.find(x => x.id === a.qid).answer;
        next = { ...s, profile: { ...s.profile, aiQuestions: aiList.map(x => x.id === a.qid ? { ...x, answer: a.value } : x) } };
      } else {
        const prev = s.profile.answers || {};
        prevVal = prev[a.qid];
        const patch = { answers: { ...prev, [a.qid]: a.value } };
        /* The travel answer drives the card's car glyph. */
        if (a.qid === "g_travel") patch.hasCar = a.value === "I drive";
        next = { ...s, profile: { ...s.profile, ...patch } };
      }
      /* +1 XP the first time a question is answered, never on edits. */
      return isAnswered(prevVal) ? next : claimXP(next, `question_${a.qid}`, XP_VALUES.question);
    }
    case "AI_QUESTION_ADD": {
      const list = s.profile.aiQuestions || [];
      if (list.some(x => x.text.toLowerCase() === a.q.text.toLowerCase())) return s;
      const next = { ...s, profile: { ...s.profile, aiQuestions: [...list, a.q] } };
      return isAnswered(a.q.answer) ? claimXP(next, `question_${a.q.id}`, XP_VALUES.question) : next;
    }
    case "CONNECT":   return { ...s, connections: [...s.connections, ...a.people] };
    case "REVIEW_ADD": {
      const next = { ...s, reviews: [...s.reviews, a.review] };
      return a.review.aboutId === "me" ? claimXP(next, "first_review") : next;
    }
    case "REVIEW_REQUEST": return { ...s, reviewRequests: [...s.reviewRequests, a.request] };
    case "INVITE":    return { ...s, invitations: [...s.invitations, ...a.people] };
    case "VIEW":      return { ...s, viewing: a.id };
    case "SEED_DEMO": {
      /* The demo profile is complete, so it carries the XP its data has earned. */
      let n = {
      ...s, role: "team", tab: "home", route: "home", viewing: null,
      session: { ...s.session, tag: "SAM42", phone: "+44 7700 900412", verified: true },
      profile: { ...s.profile, name: "Sam Morgan", live: true, theme: "ivory", tier: "gold", level: 5, hasCar: true, photo: avatarFor("Sam Morgan"), records: DEMO_RECORDS(), categories: {} },
      connections: [
        { id: "stf_ava", name: "Ava Clarke", note: "Senior Bartender", onFF: true, tag: "AVA03" },
        { id: "stf_tom", name: "Tom Beatson", note: "DJ & Music Producer", onFF: true, tag: "TOMBE" },
        { id: "stf_mia", name: "Mia Santos", note: "Silver Service Waiter", onFF: true, tag: "MIAS1" },
        { id: "stf_pri", name: "Priya Raman", note: "MC & Event Host", onFF: true, tag: "PRIYA" },
        { id: "stf_idr", name: "Idris Bello", note: "Head Chef", onFF: true, tag: "IDRIS" },
      ],
      reviews: [
        { id: "rev_1", aboutId: "me", byId: "stf_ava", byName: "Ava Clarke", rating: 5, text: "Ran the bar for our launch night without a single hiccup — fast, clean, and great with the guests.", at: Date.now() - 12 * 864e5 },
        { id: "rev_2", aboutId: "me", byId: "stf_pri", byName: "Priya Raman", rating: 5, text: "One of the most reliable bartenders I've worked events with. Always early, always prepped.", at: Date.now() - 40 * 864e5 },
      ],
      };
      ["create_card", "publish_profile", "first_review"].forEach(id => { n = claimXP(n, id); });
      Object.keys(n.profile.records).forEach(cat => { n = claimListXP(n, cat, n.profile.records[cat]); });
      return n;
    }
    case "TOAST":     return { ...s, toast: a.toast };
    case "RESET":     return { ...initialState, role: s.role, route: s.role === "team" ? "entry" : "staffHome" };
    /* Sign out: back to the signed-out home page with no role, no profile and
       no demo data, so the full sign-up flow can be walked through again.
       The referral tag from the link is kept. */
    case "SIGN_OUT":  return { ...initialState, session: { ...initialState.session, refTag: s.session.refTag }, toast: "Signed out" };
    case "HYDRATE":   return { ...s, ...a.patch, _hydrated: true };
    default:          return s;
  }
}

/* The signed-in professional, presented in the same shape as a directory
   person, so one PlayerCard renderer serves both. Card values are READ from
   the primary records — never a second copy of them. */
function meAsStaff(profile, session) {
  return {
    id: "me", name: profile.name || "Your profile", tag: session.tag || "-----",
    professions: primaryNames(profile, "professions", 3),
    profession: primaryNames(profile, "professions", 1)[0] || "Professional",
    group: "Your profile",
    tier: profile.tier, level: profile.level, years: null, rating: null, reviews: 0,
    skills: primaryNames(profile, "skills", 3),
    interests: primaryNames(profile, "interests", 3),
    languages: primaryNames(profile, "languages", 5).length ? primaryNames(profile, "languages", 5) : ["English"],
    locations: primaryNames(profile, "locations", 3).length ? primaryNames(profile, "locations", 3) : ["London"],
    hasCar: profile.hasCar, availability: "open", photo: profile.photo, theme: profile.theme,
    /* Top profession's confirmed display category, if the person set one. */
    categoryOverride: (recsOf(profile, "professions").filter(r => !r.proposed)[0] || {}).displayCategory,
    /* Display-only: where they've worked, read from Experience records. */
    experience: recsOf(profile, "experience").filter(r => !r.proposed).map(r => String(r.name).split(" — ")[0]).slice(0, 2),
  };
}

/* ==========================================================================
   4. SERVICES — CV extraction adapter.
   --------------------------------------------------------------------------
   The adapter boundary is deliberate: `CV_ADAPTER.extract(file)` is the ONLY
   place the rest of the app touches extraction. Swap its body for a real
   Core API call and nothing above it changes.

   HONEST STATUS: no extraction service is wired up in this prototype. The
   adapter reports `available: false` and the UI says so plainly rather than
   pretending a CV was read. The review/accept/reject data flow below is real
   and is what a live adapter would feed.
   ========================================================================== */

const CV_ADAPTER = {
  available: false,
  note: "CV reading is not connected in this prototype. The review flow below is the one a live extraction service would feed.",

  /* Contract a live adapter must satisfy:
     -> { name, professions[], skills[], interests[], locations[],
          languages[], qualifications[], experience[] }
        where each item is { value, description?, source, confidence }.
     Nothing is invented; anything not evidenced in the document is omitted. */
  async extract(file) {
    await new Promise(r => setTimeout(r, 700));
    const err = new Error(CV_ADAPTER.note);
    err.notConnected = true;
    throw err;
  },
};

/* Apple Wallet adapter — same honesty pattern as CV_ADAPTER. No pass-signing
   service is connected in this prototype, so passKit() reports that plainly
   rather than faking a .pkpass download. A live adapter would generate and
   sign a real pass from the same profile/booking data passed in here. */
const WALLET_ADAPTER = {
  available: false,
  note: "Apple Wallet isn't connected in this prototype — passes need to be signed by a real Wallet service. This is where that request would go.",

  /* Contract a live adapter must satisfy: given { kind: "profile"|"booking", ...data },
     -> a signed .pkpass file (or a URL to one) for the browser to open. */
  async passFor(payload) {
    await new Promise(r => setTimeout(r, 500));
    const err = new Error(WALLET_ADAPTER.note);
    err.notConnected = true;
    throw err;
  },
};

/* ==========================================================================
   PROFILE AI — free text -> proposed Question Card answers.
   No language model is wired up: this is a keyword/phrase matcher against
   the QUESTIONS library, honestly labelled as such. A live adapter would
   swap this function's body for a real model call and keep the same
   { qid, value, matchedOn } output shape, so nothing downstream changes.
   The caller is always responsible for confirming proposals before they
   touch the profile — this function only ever proposes, never writes.
   ========================================================================== */
function proposeAnswersFromText(text) {
  const t = (text || "").toLowerCase();
  const out = [];
  const add = (qid, value) => { if (!out.some(p => p.qid === qid)) out.push({ qid, value }); };
  if (/\b(i drive|own car|have a car|my car|driving licen[cs]e|drive myself)\b/.test(t)) add("g_travel", "I drive");
  else if (/\b(public transport|tube|train|bus|underground|overground)\b/.test(t)) add("g_travel", "Public transport");
  if (/\bfreelanc/.test(t)) add("g_freelance", "Yes");
  if (/\b(own (kit|equipment|tools|bar tools|shaker)|cocktail equipment|bar equipment|my (kit|equipment|tools))\b/.test(t)) add("g_equipment", "Yes");
  if (/\b(last[- ]minute|short notice)\b/.test(t)) add("g_notice", "Yes");
  if (/\b(weddings?|corporate|festivals?|private (parties|party|events?)|events?)\b/.test(t)) add("g_events", "Yes");

  /* Information that fits no profile category becomes a NEW Question Card
     (v1.6 §7), answered from what was given and confirmed by the person. */
  const AI_RULES = [
    [/\b(trained|training|train) (new |junior )?(staff|bartenders|teams?|people|others|waiters)\b|\btrainer\b/, "Have you trained other hospitality staff?"],
    [/\b(managed|managing|led|leading|ran|running) (a |the |my )?(team|bar team|staff|crew)\b/, "Have you managed a team?"],
    [/\bcompetitions?\b/, "Have you competed in cocktail competitions?"],
  ];
  AI_RULES.forEach(([re, q]) => { if (re.test(t)) out.push({ ai: true, qid: "new_" + q.toLowerCase().replace(/[^a-z]+/g, "_"), text: q, value: "Yes" }); });
  return out;
}

/* Extraction result -> proposed records, flagged `proposed` so nothing
   reaches the profile until the user accepts it. */
function recordsFromExtraction(x) {
  const byCategory = {};
  const src = (o) => ({ origin: "CV", location: o?.source || "document", confidence: o?.confidence || "medium" });
  const many = (cat, arr) => {
    const list = (arr || []).filter(i => i && i.value);
    if (!list.length) return;
    byCategory[cat] = list.map(i => ({
      ...makeRecord(cat, i.value),
      description: i.description || "",
      proposed: true,
      source: src(i),
    }));
  };
  many("professions", x.professions);
  many("skills", x.skills);
  many("interests", x.interests);
  many("locations", x.locations);
  many("languages", x.languages);
  many("qualifications", x.qualifications);
  many("experience", x.experience);
  return byCategory;
}

/* ---- media helpers ------------------------------------------------------
   Files are held as data URLs so they survive a reload alongside the rest of
   the saved profile. Kept modest on purpose — this is prototype storage. */
const MAX_MEDIA_BYTES = 1.6 * 1024 * 1024;

function readFileAsDataUrl(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result));
    r.onerror = () => rej(new Error("Could not read that file."));
    r.readAsDataURL(file);
  });
}

const prettyBytes = (n) => n >= 1048576 ? `${(n / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1024))} KB`;

  const sz = full

      <div className="ff-pc-in">

        <div style={{
          marginTop: cq(full ? 5 : 4), width: cq(sz.photo), aspectRatio: "1", flex: "none", borderRadius: "50%",
          padding: cq(sz.photo * 0.04), background: metalEdge(tier, 145),
          boxShadow: "0 1.4cqw 3.6cqw rgba(0,0,0,.38), inset 0 0 0 1px rgba(255,255,255,.35)",
        }}>
          <div style={{
            width: "100%", height: "100%", borderRadius: "50%", overflow: "hidden", position: "relative",
            border: "1px solid rgba(8,8,10,.85)", display: "grid", placeItems: "center",
            background: person.photo ? `url("${person.photo}") center/cover` : "radial-gradient(circle at 38% 30%,#26262B,#0A0A0C)",
          }}>
            {!person.photo && <span style={{ fontFamily: "var(--display)", color: m.ink, fontSize: cq(sz.photo * 0.3) }}>
              {(person.name || "").split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase()}</span>}
            <span style={{ position: "absolute", inset: 0, borderRadius: "50%", background: "radial-gradient(64% 46% at 30% 16%, rgba(255,255,255,.18), transparent 62%)" }} />
          </div>
        </div>

        <div className="ff-pc-name" style={{ color: ink, fontSize: cq(sz.name), marginTop: cq(full ? 3.4 : 3.2) }}>{person.name}</div>
        <div className="ff-pc-title" style={{ color: acc, fontSize: cq(sz.title), marginTop: cq(full ? 1.3 : 1) }}>{professions[0] || "Professional"}</div>

        {/* Gold rule; the diamonds are the person's level, 1–5 */}
        <div className="ff-pc-rule" style={{ margin: full ? "2.4cqw 0 3cqw" : "2.2cqw 0 2.6cqw" }} title={`Level ${person.level || 1} of 5`}>
          <i style={{ background: `linear-gradient(90deg, transparent, ${acc})` }} />
          {[1, 2, 3, 4, 5].map(i => (
            <span key={i} style={{

              background: i <= (person.level || 1) ? acc : "transparent", border: `1px solid ${acc}`, opacity: i <= (person.level || 1) ? 1 : .45,
            }} />

          <i style={{ background: `linear-gradient(270deg, transparent, ${acc})` }} />

          {rows.map(([k, label, vals]) => <Row key={k} kind={k} label={label}><Vals items={vals} /></Row>)}

/* Time left on a request's response window, e.g. "47h 12m left". */
function timeLeft(expiresAt) {
  const ms = (expiresAt || 0) - Date.now();
  if (ms <= 0) return "Expired";
  const h = Math.floor(ms / 36e5), m = Math.floor((ms % 36e5) / 6e4);
  return `${h}h ${String(m).padStart(2, "0")}m left`;
}

/* Add-to-Apple-Wallet button — same shape wherever it appears, on a profile
   card or a booking card. Honest about the adapter status rather than
   pretending a pass downloads. */
/* ==========================================================================
   FFAI — one shared chat-style entry point.
   Reused wherever the app needs "tell us what you're looking for": FF Staff
   today, FF Team/FF Party/FF VIP later. It wraps the EXISTING search logic
   (directory filtering by name/skill/area) rather than replacing it, and
   offers the existing event/shift creation as quick actions for anyone who'd
   rather describe a booking than search. No real language model is wired up
   here — a typed line either matches people directly (search) or is handed
   to the person as a prompt to create an event/shift card, honestly, same
   pattern as the CV and Wallet adapters elsewhere in the app.
   ========================================================================== */
function FFAI({ query, onQuery, onSubmit, onEvent, onShift, placeholder, context = "FireFlair", title, purpose, actions, hero = false }) {
  const [val, setVal] = useState(query || "");
  useEffect(() => setVal(query || ""), [query]);
  const looksLikeBooking = /\b(need|looking for|wedding|event|shift|hire|staff|party|corporate)\b/i.test(val) && val.trim().split(/\s+/).length > 3;

  const submit = () => {
    const v = val.trim();
    if (!v) return;
    if (onSubmit) onSubmit(v); else if (onQuery) onQuery(v);
  };

  return (
    <div className="ff-frame ff-lattice" style={{ padding: hero ? 18 : 14, margin: "14px 0" }}>
      <Corners />
      <div style={{ display: "flex", gap: hero ? 14 : 10, alignItems: "center", marginBottom: 10 }}>

        </span>
      </div>
      <div style={{ position: "relative" }}>
        <Search size={16} color="#A9A296" style={{ position: "absolute", left: 12, top: 15 }} />
        <input className="ff-input" style={{ paddingLeft: 36, paddingRight: val ? 84 : 14 }}
          placeholder={placeholder || "Name, skill, area, or describe your event…"}
          value={val} onChange={(e) => { setVal(e.target.value); if (onQuery) onQuery(e.target.value); }}
          onKeyDown={(e) => e.key === "Enter" && submit()} aria-label={title || "FF AI"} />
        {val && (
          <button onClick={submit} className="ff-btn sm primary" style={{ position: "absolute", right: 5, top: 6, padding: "7px 10px" }}>Go</button>
        )}
      </div>
      {looksLikeBooking && (onEvent || onShift) && (
        <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap", alignItems: "center" }}>
          <span className="ff-body ff-muted" style={{ fontSize: 11.5 }}>Sounds like a booking —</span>

        </div>

        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginTop: 10 }}>
          {actions.map(a => <Btn key={a.label} variant={a.primary ? "sm primary" : "sm"} onClick={a.onClick}>{a.label}</Btn>)}
        </div>
      )}
      {!val && (onEvent || onShift) && (
        <div style={{ display: "grid", gridTemplateColumns: onEvent && onShift ? "1fr 1fr" : "1fr", gap: 8, marginTop: 12 }}>
          {onEvent && <Btn variant="primary" onClick={onEvent}><Calendar size={14} /> Tell us about an event</Btn>}

  );
}

/* Home's FF AI — "Welcome to FireFlair". Routes what someone types to the
   right main page: work → Profile, hiring → FF Staff, a question → the
   FireFlair information, anything else → a Network search. */
function HomeFFAI() {
  const { state, dispatch } = useStore();
  const isTeam = state.role === "team";
  const goProfile = () => { if (!isTeam) dispatch({ type: "ROLE", role: "team" }); dispatch({ type: "TAB", tab: "profile", route: "home" }); window.scrollTo(0, 0); };
  const goStaff = () => { dispatch({ type: "ROLE", role: "staff" }); window.scrollTo(0, 0); };
  const goNetwork = (q = "") => { dispatch({ type: "NET_QUERY", q }); dispatch({ type: "TAB", tab: "network" }); window.scrollTo(0, 0); };
  const onSubmit = (v) => {
    const t = v.toLowerCase();
    if (/\b(hire|hiring|need|book|booking)\b|looking for (a|an|some|staff)/.test(t)) {
      goStaff(); dispatch({ type: "TOAST", toast: "FF Staff — find and book event professionals" }); return;
    }
    if (/\b(bartender|bartending|waiter|chef|dj|host|photographer|work|job|jobs|shifts?|join|card|profile|sign ?up)\b/.test(t)) {
      goProfile(); dispatch({ type: "TOAST", toast: "Let's build your Profile Card" }); return;
    }
    if (/\?|^(what|why|how|who|is|can|does|tell)\b/.test(t)) {
      const el = document.getElementById("ff-why");
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      dispatch({ type: "TOAST", toast: "Here's what FireFlair is about" }); return;
    }
    goNetwork(v); dispatch({ type: "TOAST", toast: `Searching the network for “${v}”` });
  };
  return (
    <FFAI hero title="Welcome to FireFlair"
      purpose="Ask about FireFlair, or tell us what you're here to do — find work, hire staff or find someone."
      placeholder="I'm a bartender · I need staff · Shoreditch…" onSubmit={onSubmit}
      actions={[
        { label: isTeam ? "My Profile Card" : "Join FF Team", primary: true, onClick: goProfile },
        { label: "Hire staff", onClick: goStaff },
        { label: "Explore the network", onClick: () => goNetwork("") },
      ]} />
  );
}

function QuestionSheet({ open, q, onClose }) {
  const { state, dispatch } = useStore();
  const [val, setVal] = useState("");
  const [choice, setChoice] = useState("");
  const [detail, setDetail] = useState("");
  useEffect(() => {
    if (!open || !q) return;
    const ex = String(answerOf(state, q) || "");
    setVal(ex);
    if (q.detail && ex.startsWith(q.detail.option)) { setChoice(q.detail.option); setDetail(ex.slice(q.detail.option.length).replace(/^\s*—\s*/, "")); }
    else { setChoice(ex); setDetail(""); }
  }, [open, q && q.id]);
  if (!open || !q) return null;
  const existing = answerOf(state, q);
  const isNew = !isAnswered(existing);

  const save = (v) => {
    dispatch({ type: "ANSWER", qid: q.id, value: v });
    dispatch({ type: "TOAST", toast: isNew ? `Answered · +${q.xp} XP` : "Answer updated" });
    onClose();
  };
  const pick = (o) => { if (q.detail && o === q.detail.option) { setChoice(o); return; } save(o); };
  const needsDetail = q.detail && choice === q.detail.option;
  const note = q.group === "feedback"
    ? "Feedback goes to the FireFlair team to improve FF Team. It's kept separately from your profile and never shown on it."
    : q.group === "ai"
      ? "FF AI created this Question Card from information you gave it. It isn't shown on your public card."
      : "Answers help FireFlair match you to work. They don't appear on your public card.";

  return (
    <Sheet open onClose={onClose} title={q.group === "feedback" ? "Feedback" : q.group === "ai" ? "FF AI question" : "Question"}>
      <p className="ff-serif" style={{ fontSize: 19, lineHeight: 1.35, marginTop: 0 }}>{q.text}</p>
      {q.type === "choice" && (
        <div style={{ display: "grid", gap: 8 }}>
          {q.options.map(o => (
            <Btn key={o} variant={choice === o ? "primary" : ""} onClick={() => pick(o)}>{o}</Btn>
          ))}
        </div>
      )}
      {needsDetail && (<>
        <div style={{ height: 12 }} />
        <Field label={q.detail.label}>
          <input className="ff-input" value={detail} onChange={(e) => setDetail(e.target.value)} placeholder={q.detail.placeholder || ""} autoFocus />
        </Field>
        <Btn variant="primary wide" disabled={!q.detail.optional && !detail.trim()}
          onClick={() => save(detail.trim() ? `${choice} — ${detail.trim()}` : choice)}>
          {isNew ? `Save · +${q.xp} XP` : "Save answer"}
        </Btn>
      </>)}
      {q.type === "text" && (<>
        <Field label="Your answer">
          <textarea className="ff-input" rows={3} value={val} onChange={(e) => setVal(e.target.value)} placeholder={q.placeholder || ""} />
        </Field>
        <Btn variant="primary wide" disabled={!val.trim()} onClick={() => save(val.trim())}>
          {isNew ? `Save · +${q.xp} XP` : "Save answer"}
        </Btn>
      </>)}
      <p className="ff-body ff-muted" style={{ fontSize: 11.5, marginTop: 14, marginBottom: 0 }}>{note}</p>
    </Sheet>
  );
}

/* A group of Question Cards — used for logistics, availability, experience,
   and for the dream-opportunity questions that become Job Request data. */
/* ONE unified Question Cards carousel — every category's questions in a
   single left/right swipeable collection, each card carrying its own
   category name and colour so the category stays legible while swiping. */
function QuestionCardsCollection() {
  const { state } = useStore();
  const [openId, setOpenId] = useState(null);
  const qs = allQuestions(state);
  const done = qs.filter(q => isAnswered(answerOf(state, q))).length;
  const openQ = qs.find(q => q.id === openId) || null;
  const present = QUESTION_GROUPS.filter(g => qs.some(q => q.group === g.key));

  return (
    <>
      <p className="ff-body ff-muted" style={{ fontSize: 11.5, margin: "-4px 0 8px" }}>
        {done}/{qs.length} answered · +{XP_VALUES.question} XP each · Question Cards never appear on your public card
      </p>
      <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 10 }}>
        {present.map(g => (
          <span key={g.key} className="ff-body ff-muted" style={{ fontSize: 11, display: "flex", gap: 6, alignItems: "center" }}>
            <span style={{ width: 12, height: 12, borderRadius: 2, background: questionGroupColor(g.key).bg, border: `1px solid ${questionGroupColor(g.key).sub}`, display: "block" }} />
            {g.label}{g.key === "feedback" ? " (kept off your profile)" : ""}
          </span>
        ))}
      </div>
      <HScroll label="Question Cards" snap>
        {qs.map(q => (
          <QuestionCard key={q.id} q={q} answer={answerOf(state, q)} onClick={() => setOpenId(q.id)} />
        ))}
      </HScroll>
      <QuestionSheet open={!!openQ} q={openQ} onClose={() => setOpenId(null)} />
    </>
  );
}

/* Share Card — FF Team's Add FireFlair action. Enter a number, send the
   card. Deliberately simple: no new send infrastructure, just the flow the
   spec asks for, using the existing tag/session data already on the card. */
/* Media — photos and videos on the profile itself, not tucked inside one
   skill. Photos are stored as data URLs, same as everywhere else media is
   handled in this prototype; video is a linked URL rather than an uploaded
   file, since a video blob would blow the size budget this app works within. */
/* ==========================================================================
   AI PROFILE COMPLETION — reuses the FFAI visual language, purpose-built to
   feed the Question Cards. Text, pasted CV, or (where the browser supports
   it) speech all funnel into proposeAnswersFromText(), and every proposal
   sits unconfirmed until the person picks it — the existing ANSWER action
   and its claim-once XP protection is the only thing that ever writes to
   the profile, so nothing here bypasses that.
   ========================================================================== */
function AIProfileCompletion() {
  const { state, dispatch } = useStore();
  const [text, setText] = useState("");
  const [proposals, setProposals] = useState(null);
  const [picked, setPicked] = useState({});
  const [listening, setListening] = useState(false);
  const recogRef = useRef(null);

  const questionFor = (qid) => QUESTIONS.find(q => q.id === qid);
  const already = (p) => p.ai
    ? (state.profile.aiQuestions || []).some(x => x.text.toLowerCase() === p.text.toLowerCase())
    : isAnswered(answerOf(state, questionFor(p.qid)));

  const process = () => {
    const found = proposeAnswersFromText(text).filter(p => !already(p));
    setProposals(found);
    setPicked(Object.fromEntries(found.map(p => [p.qid, true])));
  };

  const confirm = () => {
    const chosen = proposals.filter(p => picked[p.qid]);
    chosen.forEach(p => p.ai
      ? dispatch({ type: "AI_QUESTION_ADD", q: { id: uid("aiq"), text: p.text, options: ["Yes", "No"], answer: p.value, source: "FF AI" } })
      : dispatch({ type: "ANSWER", qid: p.qid, value: p.value }));
    dispatch({ type: "TOAST", toast: `${chosen.length} question${chosen.length === 1 ? "" : "s"} answered · +${chosen.length * XP_VALUES.question} XP` });
    setProposals(null); setText(""); setPicked({});
  };

  const toggleMic = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { dispatch({ type: "TOAST", toast: "Voice input isn't available in this browser." }); return; }
    if (listening) { recogRef.current?.stop(); return; }
    const r = new SR();
    r.lang = "en-GB"; r.interimResults = false; r.continuous = false;
    r.onresult = (e) => setText(x => (x ? x + " " : "") + e.results[0][0].transcript);
    r.onend = () => setListening(false);
    r.onerror = () => setListening(false);
    recogRef.current = r; r.start(); setListening(true);
  };

  return (
    <div className="ff-frame ff-lattice" style={{ padding: 14, margin: "16px 0" }}>
      <Corners />
      <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 10 }}>
        <Coin size={30} tier="gold" />
        <span style={{ minWidth: 0 }}>
          <span className="ff-display" style={{ fontSize: 13, display: "block" }}>FF AI · Profile</span>
          <span className="ff-body ff-muted" style={{ fontSize: 12 }}>
            Build your profile with AI — type, speak or paste your CV. I answer your Question Cards and turn anything that fits nowhere else into new ones; you confirm before anything is saved.
          </span>
        </span>
      </div>

      {proposals === null ? (<>
        <div style={{ position: "relative" }}>
          <textarea className="ff-input" rows={4} style={{ paddingRight: 44 }}
            placeholder="Tell us about yourself — how you travel, your kit, the events you've worked, anything else you've done…"
            value={text} onChange={(e) => setText(e.target.value)} />
          <button onClick={toggleMic} aria-label={listening ? "Stop listening" : "Answer by voice"}
            style={{ position: "absolute", right: 8, top: 8, color: listening ? "var(--bad)" : "var(--gold-dk)", padding: 4 }}>
            <Mic size={18} />
          </button>
        </div>
        <Btn variant="primary wide" disabled={!text.trim()} onClick={process} style={{ marginTop: 10 }}>
          <Award size={14} /> Find my answers
        </Btn>
        <p className="ff-body ff-muted" style={{ fontSize: 11, marginTop: 8, marginBottom: 0 }}>
          This can use the info to fill in your Question Cards — you confirm before anything is saved.
        </p>
      </>) : proposals.length === 0 ? (
        <div>
          <p className="ff-body" style={{ margin: "0 0 10px" }}>Nothing new in there — try adding a bit more detail, or answer the cards directly below.</p>
          <Btn variant="ghost wide" onClick={() => setProposals(null)}>Try again</Btn>
        </div>
      ) : (
        <div>
          <p className="ff-body" style={{ margin: "0 0 10px" }}>Found {proposals.length} answer{proposals.length === 1 ? "" : "s"} — pick which to confirm.</p>
          {proposals.map(p => {
            const q = p.ai ? { text: p.text } : questionFor(p.qid);
            if (!q) return null;
            return (
              <label key={p.qid} className="ff-frame" style={{ padding: 11, marginBottom: 8, display: "flex", gap: 11, alignItems: "flex-start", cursor: "pointer" }}>
                <input type="checkbox" checked={!!picked[p.qid]} style={{ marginTop: 3 }}
                  onChange={(e) => setPicked(x => ({ ...x, [p.qid]: e.target.checked }))} />
                <span>
                  <span className="ff-serif" style={{ fontSize: 14, display: "block" }}>{q.text}</span>
                  <span className="ff-body ff-muted" style={{ fontSize: 12 }}>{p.ai ? "New Question Card from FF AI · " : ""}Proposed: <b>{p.value}</b></span>
                </span>
              </label>
            );
          })}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 4 }}>
            <Btn variant="primary" disabled={!Object.values(picked).some(Boolean)} onClick={confirm}>
              <Check size={13} /> Confirm selected
            </Btn>
            <Btn variant="ghost" onClick={() => { setProposals(null); setText(""); }}>Discard</Btn>
          </div>
        </div>
      )}
    </div>
  );
}

function MediaSection({ isMe, media }) {
  const { state, dispatch } = useStore();
  const [adding, setAdding] = useState(false);
  const [videoUrl, setVideoUrl] = useState("");
  const fileRef = useRef(null);
  const [busy, setBusy] = useState(null);

  const addPhoto = async (file) => {
    if (!file) return;
    if (file.size > MAX_MEDIA_BYTES) { setBusy(`That image is ${prettyBytes(file.size)} — keep it under ${prettyBytes(MAX_MEDIA_BYTES)}.`); return; }
    setBusy("Adding…");
    try {
      const dataUrl = await readFileAsDataUrl(file);
      dispatch({ type: "MEDIA_ADD", item: { id: uid("med"), kind: "photo", name: file.name, dataUrl } });
      setBusy(null);
    } catch (e) { setBusy(e.message); }
  };

  const addVideo = () => {
    const v = videoUrl.trim();
    if (!v) return;
    dispatch({ type: "MEDIA_ADD", item: { id: uid("med"), kind: "video", url: v } });
    setVideoUrl(""); setAdding(false);
  };

  const visible = state.categoryVisibility.media !== false;

  if (!isMe && !media.length) return null;

  return (
    <section style={{ marginTop: 22 }}>
      <SectionHead icon={<Camera size={15} color="var(--gold-dk)" strokeWidth={1.6} />} title="Media" count={media.length}
        action={
          <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
            {isMe && <button className="ff-btn sm ghost" onClick={() => setAdding(x => !x)}>Add</button>}
            <CategoryToggle sectionKey="media" />
          </span>
        } />
      {visible && (<>
      {isMe && adding && (
        <div className="ff-frame" style={{ padding: 12, marginBottom: 12 }}>
          <input ref={fileRef} type="file" accept="image/*" style={{ display: "none" }}
            onChange={(e) => { addPhoto(e.target.files?.[0]); e.target.value = ""; }} />
          <Btn variant="sm wide" onClick={() => fileRef.current?.click()}><Camera size={12} /> Add a photo</Btn>
          <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
            <input className="ff-input" style={{ flex: 1 }} placeholder="Paste a video link" value={videoUrl} onChange={(e) => setVideoUrl(e.target.value)} />
            <Btn variant="sm" disabled={!videoUrl.trim()} onClick={addVideo}>Add</Btn>
          </div>
          {busy && <p className="ff-body ff-muted" style={{ fontSize: 11.5, marginTop: 8 }}>{busy}</p>}
        </div>
      )}
      {media.length ? (
        <HScroll label="Media">
          {media.map(m => (
            <div key={m.id} className="ff-tile" style={{ width: CARD_W.tile, minHeight: 120, padding: 0, overflow: "hidden", position: "relative" }}>
              {m.kind === "photo" ? (
                <div style={{ width: "100%", height: "100%", background: `url("${m.dataUrl}") center/cover` }} />
              ) : (
                <a href={m.url} target="_blank" rel="noopener noreferrer" style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 6, height: "100%", padding: 10, textAlign: "center" }}>
                  <Camera size={20} color="var(--gold-dk)" strokeWidth={1.5} />
                  <span className="ff-body ff-muted" style={{ fontSize: 10, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", width: "100%" }}>{m.url}</span>
                </a>
              )}
              {isMe && (
                <button aria-label="Remove" onClick={() => dispatch({ type: "MEDIA_DELETE", id: m.id })}
                  style={{ position: "absolute", top: 4, right: 4, background: "rgba(12,12,14,.82)", color: "#EAD79C", width: 20, height: 20, display: "grid", placeItems: "center" }}>
                  <X size={12} />
                </button>
              )}
            </div>
          ))}
        </HScroll>
      ) : isMe && !adding ? (
        <p className="ff-body ff-muted" style={{ margin: 0 }}>No photos or videos yet.</p>
      ) : null}
      </>)}
    </section>
  );
}

function ShareCardSheet({ open, onClose }) {

  const [phone, setPhone] = useState("");
  const [sent, setSent] = useState(false);
  useEffect(() => { if (open) { setPhone(""); setSent(false); } }, [open]);
  if (!open) return null;

  const send = () => {
    setSent(true);
    dispatch({ type: "TOAST", toast: `Card sent to ${phone}` });
  };

  return (
    <Sheet open onClose={onClose} title="Share your card">
      <p className="ff-body" style={{ marginTop: 0 }}>
        Send your FireFlair card — {CARD_DOMAIN}/{state.session.tag} — straight to someone's phone.
      </p>
      {sent ? (
        <div className="ff-frame" style={{ padding: 16, textAlign: "center" }}>
          <Check size={22} color="var(--ok)" style={{ marginBottom: 8 }} />
          <p className="ff-body" style={{ margin: 0 }}>Sent to {phone}.</p>
        </div>
      ) : (<>
        <Field label="Their mobile number">
          <input className="ff-input" type="tel" placeholder="+44 7700 900000" value={phone} onChange={(e) => setPhone(e.target.value)} />
        </Field>
        <Btn variant="primary wide" disabled={phone.replace(/\D/g, "").length < 9} onClick={send}>
          <Send size={14} /> Send my card
        </Btn>
      </>)}
