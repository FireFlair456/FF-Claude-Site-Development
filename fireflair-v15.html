  );
}

function ReviewSheet({ open, person, shiftId, onClose }) {
  const { state, dispatch } = useStore();
  const [rating, setRating] = useState(5);
  const [text, setText] = useState("");
  useEffect(() => { if (open) { setRating(5); setText(""); } }, [open, person && person.id]);
  if (!open || !person) return null;

  const submit = () => {
    dispatch({
      type: "REVIEW_ADD",
      review: {
        id: uid("rev"), aboutId: person.id, byId: "me", shiftId: shiftId || null,
        byName: state.company?.name || state.profile.name || "You", rating, text: text.trim(), at: Date.now(),
      },
    });
    dispatch({ type: "TOAST", toast: `Review posted for ${person.name.split(" ")[0]}` });
    onClose();
  };

  return (
    <Sheet open onClose={onClose} title={`Review ${person.name.split(" ")[0]}`}>
      <div style={{ display: "flex", alignItems: "center", gap: 11, marginBottom: 16 }}>
        <Portrait src={person.photo} name={person.name} size={44} tier={person.tier} />
        <div>
          <div className="ff-display" style={{ fontSize: 15 }}>{person.name}</div>
          <div className="ff-serif" style={{ fontSize: 12.5, color: "var(--gold-dk)", fontStyle: "italic" }}>{person.profession}</div>
        </div>
      </div>
      <Field label="Rating">
        <div style={{ display: "flex", gap: 6 }}>
          {Array.from({ length: REVIEW_MAX }).map((_, i) => (
            <button key={i} aria-label={`${i + 1} star${i ? "s" : ""}`} onClick={() => setRating(i + 1)}
              style={{ padding: 4, color: i < rating ? "var(--gold)" : "#C9C3B4" }}>
              <Award size={22} strokeWidth={i < rating ? 0 : 1.5} fill={i < rating ? "currentColor" : "none"} />
            </button>
          ))}
        </div>
      </Field>
      <Field label="Review" hint="How they were to work with — this goes on their profile.">
        <textarea className="ff-input" rows={4} value={text} onChange={(e) => setText(e.target.value)}
          placeholder="Reliable, great with guests, always on time…" />
      </Field>
      <Btn variant="primary wide" disabled={!text.trim()} onClick={submit}><Award size={14} /> Post review</Btn>
    </Sheet>
  );
}

/* Ask anyone in your network for a review/reference. If they don't have one
   posted yet, the fallback is simply to share your card with them. */
function AskForReviewSheet({ open, onClose }) {
  const { state, dispatch } = useStore();
  const all = useDirectory();
  const [picked, setPicked] = useState(null);
  useEffect(() => { if (open) setPicked(null); }, [open]);
  if (!open) return null;

  const asked = (id) => state.reviewRequests.some(r => r.fromId === id && r.aboutId === "me");
  const network = state.connections.map(c => all.find(p => p.id === c.id)).filter(Boolean);

  const ask = (person) => {
    dispatch({ type: "REVIEW_REQUEST", request: { id: uid("req"), aboutId: "me", fromId: person.id, fromName: person.name, at: Date.now() } });
    dispatch({ type: "TOAST", toast: `Asked ${person.name.split(" ")[0]} for a review` });
  };

  return (
    <Sheet open onClose={onClose} title="Ask for a review">
      <p className="ff-body" style={{ marginTop: 0 }}>
        Anyone in your network can leave you a review or a reference, whether or not you've worked an event
        together on FireFlair — most people you'd ask have worked with you somewhere.
      </p>
      {network.length === 0 ? (
        <div className="ff-frame" style={{ padding: 14, marginTop: 10 }}>
          <p className="ff-body" style={{ margin: "0 0 10px" }}>Nobody in your network yet. Share your card instead — they can send you a review once they have it.</p>
          <Btn variant="primary wide" onClick={() => { dispatch({ type: "TOAST", toast: "Link copied" }); onClose(); }}>
            <Share2 size={14} /> Share my card
          </Btn>
        </div>
      ) : network.map(p => (
        <div key={p.id} className="ff-frame" style={{ padding: 11, marginBottom: 8, display: "flex", gap: 11, alignItems: "center" }}>
          <Portrait src={p.photo} name={p.name} size={36} tier={p.tier} />
          <span style={{ flex: 1, minWidth: 0 }}>
            <span className="ff-display" style={{ fontSize: 13, display: "block" }}>{p.name}</span>
            <span className="ff-body ff-muted" style={{ fontSize: 12 }}>{p.profession}</span>
          </span>
          {asked(p.id)
            ? <Pill tone="ok">Asked</Pill>
            : <Btn variant="sm" onClick={() => ask(p)}><Send size={12} /> Ask</Btn>}
        </div>
      ))}
    </Sheet>
  );
}

function InfoCardSheet({ open, record, def, category, readOnly, onClose }) {
  const { state, dispatch } = useStore();
  const [draft, setDraft] = useState(record);
  const [busy, setBusy] = useState(null);
  const mediaRef = useRef(null);
  const docRef = useRef(null);

  useEffect(() => { setDraft(record); }, [record && record.id]);
  if (!open || !record || !draft) return null;

  const patch = (p) => {
    setDraft(d => ({ ...d, ...p }));
    if (!readOnly) dispatch({ type: "REC_PATCH", category, id: record.id, patch: p });
  };

  const addMedia = async (file) => {
    if (!file) return;
    if (file.size > MAX_MEDIA_BYTES) { setBusy(`That image is ${prettyBytes(file.size)} — keep it under ${prettyBytes(MAX_MEDIA_BYTES)}.`); return; }
    setBusy("Adding…");
    try {
      const dataUrl = await readFileAsDataUrl(file);
      patch({ media: [...(draft.media || []), { id: uid("med"), name: file.name, dataUrl }] });
      setBusy(null);
    } catch (e) { setBusy(e.message); }
  };

  const addDoc = async (file) => {
    if (!file) return;
    setBusy("Attaching…");
    try {
      const big = file.size > MAX_MEDIA_BYTES;
      const dataUrl = big ? null : await readFileAsDataUrl(file);
      patch({ document: { name: file.name, size: file.size, type: file.type || "application/pdf", dataUrl } });
      setBusy(big ? "Attached by reference — too large to store in this prototype, so it can't be reopened here." : null);
    } catch (e) { setBusy(e.message); }
  };

  const doc = draft.document;

  return (
    <Sheet open onClose={onClose} title={def.singular}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
        <CatBadge kind={def.icon} size={34} tone="light" />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div className="ff-label">{def.label}</div>
          {readOnly
            ? <div className="ff-display" style={{ fontSize: 17 }}>{draft.name}</div>
            : <input className="ff-input" style={{ fontSize: 17, padding: "8px 10px" }} value={draft.name}
                onChange={(e) => patch({ name: e.target.value })} placeholder={def.placeholder || def.singular} />}
        </div>
      </div>

      {draft.proposed && (
        <div className="ff-frame" style={{ padding: 12, marginBottom: 14 }}>
          <p className="ff-body" style={{ margin: "0 0 10px" }}>Proposed from your CV — nothing is on your profile until you accept it.</p>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            <Btn variant="primary" onClick={() => { dispatch({ type: "REC_ACCEPT", category, id: record.id }); patch({ proposed: false }); }}>
              <Check size={13} /> Accept
            </Btn>
            <Btn variant="danger" onClick={() => { dispatch({ type: "REC_DELETE", category, id: record.id }); onClose(); }}>Reject</Btn>
          </div>
        </div>
      )}

      {catHas(def, "proficiency") && (
        <Field label="Level">
          {readOnly ? <div className="ff-serif" style={{ fontSize: 16 }}>{draft.proficiency || "Not stated"}</div> : (
            <select className="ff-input" value={draft.proficiency || ""} onChange={(e) => patch({ proficiency: e.target.value })}>
              <option value="">Not stated</option>
              {PROFICIENCY.map(p => <option key={p} value={p}>{p}</option>)}
            </select>
          )}
        </Field>
      )}

      {catHas(def, "description") && (
        <Field label={def.singular === "Qualification" ? "Supporting detail" : "Description"}
          hint={readOnly ? undefined : "This sits behind your card — write as much as it deserves."}>
          {readOnly
            ? <p className="ff-serif" style={{ fontSize: 16, lineHeight: 1.5, margin: 0 }}>{draft.description || "Nothing written yet."}</p>
            : <textarea className="ff-input" rows={6} value={draft.description || ""}
                onChange={(e) => patch({ description: e.target.value })}
                placeholder={`What should people know about this ${def.singular.toLowerCase()}?`} />}
        </Field>
      )}

      {catHas(def, "media") && (
        <div style={{ marginBottom: 16 }}>
          <div className="ff-label" style={{ marginBottom: 8 }}>Images</div>
          {(draft.media || []).length > 0 && (
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
              {draft.media.map(m => (
                <span key={m.id} style={{ position: "relative", width: 84, height: 84, border: "1px solid var(--rule)", overflow: "hidden", background: `url("${m.dataUrl}") center/cover` }}>
                  {!readOnly && (
                    <button aria-label={`Remove ${m.name}`}
                      onClick={() => patch({ media: draft.media.filter(x => x.id !== m.id) })}
                      style={{ position: "absolute", top: 2, right: 2, background: "rgba(12,12,14,.82)", color: "#EAD79C", width: 20, height: 20, display: "grid", placeItems: "center" }}>
                      <X size={12} />
                    </button>
                  )}
                </span>
              ))}
            </div>
          )}
          {!readOnly && (<>
            <input ref={mediaRef} type="file" accept="image/*" style={{ display: "none" }}
              onChange={(e) => { addMedia(e.target.files?.[0]); e.target.value = ""; }} />
            <Btn variant="sm" onClick={() => mediaRef.current?.click()}>
              <Plus size={12} /> {(draft.media || []).length ? "Add another image" : "Add an image"}
            </Btn>
          </>)}
          {readOnly && !(draft.media || []).length && <p className="ff-body ff-muted" style={{ margin: 0 }}>No images.</p>}
        </div>
      )}

      {catHas(def, "document") && (
        <div style={{ marginBottom: 16 }}>
          <div className="ff-label" style={{ marginBottom: 8 }}>Supporting document</div>
          {doc ? (
            <div className="ff-frame" style={{ padding: 12, display: "flex", gap: 11, alignItems: "center" }}>
              <span style={{ width: 34, height: 34, flex: "none", background: "#5C1220", display: "grid", placeItems: "center" }}>
                <FileText size={16} color="#EAD79C" strokeWidth={1.6} />
              </span>
              <span style={{ flex: 1, minWidth: 0 }}>
                <span className="ff-serif" style={{ fontSize: 15, display: "block", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{doc.name}</span>
                <span className="ff-body ff-muted" style={{ fontSize: 11 }}>{doc.size ? prettyBytes(doc.size) : "Attached"} · awaiting verification</span>
              </span>
            </div>
          ) : <p className="ff-body ff-muted" style={{ margin: "0 0 10px" }}>No document attached.</p>}

          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 10 }}>
            {doc && doc.dataUrl && (
              <a className="ff-btn sm" href={doc.dataUrl} target="_blank" rel="noopener noreferrer" style={{ textDecoration: "none" }}>
                <Eye size={12} /> Open PDF
              </a>
            )}
            {!readOnly && (<>
              <input ref={docRef} type="file" accept="application/pdf,.pdf" style={{ display: "none" }}
                onChange={(e) => { addDoc(e.target.files?.[0]); e.target.value = ""; }} />
              <Btn variant="sm" onClick={() => docRef.current?.click()}>
                <Upload size={12} /> {doc ? "Replace" : "Upload PDF"}
              </Btn>
              {doc && <Btn variant="sm danger" onClick={() => patch({ document: null })}>Remove</Btn>}
            </>)}
          </div>
        </div>
      )}

      {busy && <p className="ff-body ff-muted" style={{ fontSize: 12 }}>{busy}</p>}

      {!readOnly && !draft.proposed && (
        <>
          <Divider />
          {(() => {
            const all = recsOf(state.profile, category);
            const pos = all.findIndex(r => r.id === record.id);
            const n = def.cardLimit || 3;
            return (
              <div style={{ marginBottom: 14 }}>
                <div className="ff-label" style={{ marginBottom: 6 }}>Order</div>
                <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <Btn variant="sm" disabled={pos <= 0} onClick={() => dispatch({ type: "REC_MOVE", category, id: record.id, dir: -1 })}><ChevronLeft size={12} /> Earlier</Btn>
                  <span className="ff-body" style={{ fontSize: 13, flex: 1, textAlign: "center" }}>{pos + 1} of {all.length}</span>
                  <Btn variant="sm" disabled={pos >= all.length - 1} onClick={() => dispatch({ type: "REC_MOVE", category, id: record.id, dir: 1 })}>Later <ChevronRight size={12} /></Btn>
                </div>
                <p className="ff-body ff-muted" style={{ fontSize: 12, margin: "6px 0 0" }}>
                  {def.onCard ? `The first ${n} show on your Profile Card.` : "The first three are highlighted on your profile."} Your profile keeps them all.
                </p>
              </div>
            );
          })()}
          {category === "professions" && (
            <Field label="Display category" hint="Where this profession sits on Network, if it's your top profession.">
              <select className="ff-input" value={professionCategory(draft.name, draft.displayCategory) || ""}
                onChange={(e) => patch({ displayCategory: e.target.value || undefined })}>
                <option value="">Not sure yet</option>
                {PROFESSION_CATEGORIES.map(c => <option key={c.key} value={c.key}>{c.key}</option>)}
              </select>
            </Field>
          )}
          <Btn variant="danger wide" onClick={() => { dispatch({ type: "REC_DELETE", category, id: record.id }); onClose(); }}>
            Delete this {def.singular.toLowerCase()}
          </Btn>
        </>
      )}
    </Sheet>
  );
}

/* Quick-pick: five suggested professions per display category (v1.6 §2).
   Anything else can be typed — "Add another profession". */
function ProfessionPicker({ selected = [], onPick, title = "Pick your professions" }) {
  const [cat, setCat] = useState(PROFESSION_CATEGORIES[0].key);
  const c = PROFESSION_CATEGORIES.find(x => x.key === cat);
  const has = (n) => selected.some(x => String(x).toLowerCase() === n.toLowerCase());
  return (
    <div className="ff-frame" style={{ padding: 12, marginTop: 14 }}>
      <div className="ff-label" style={{ marginBottom: 8 }}>{title}</div>
      <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 6, scrollbarWidth: "none" }}>
        {PROFESSION_CATEGORIES.map(x => (
          <button key={x.key} className="ff-chip" onClick={() => setCat(x.key)} aria-pressed={x.key === cat}
            style={{ whiteSpace: "nowrap", margin: 0, flex: "none", ...(x.key === cat ? { background: "#141416", color: "#EAD79C", borderColor: "#141416" } : {}) }}>{x.key}</button>
        ))}
      </div>
      <div style={{ marginTop: 6 }}>
        {c.suggested.map(n => (
          <button key={n} className="ff-chip" onClick={() => onPick(n)}
            style={has(n) ? { background: "rgba(201,162,39,.18)", borderColor: "var(--gold)", color: "#3B342A" } : undefined}>
            {has(n) ? "✓ " : "+ "}{n}
          </button>
        ))}
      </div>
      <p className="ff-body ff-muted" style={{ fontSize: 11.5, margin: "6px 0 0" }}>
        Not listed? Type any profession — that's "Add another profession". Your first three show on your card.
      </p>
    </div>
  );
}

/* Add a record to any category — same shape whatever the category is. */
function AddRecordSheet({ open, onClose, category, def, onAdded }) {
  const { state, dispatch } = useStore();
  const [name, setName] = useState("");
  const [desc, setDesc] = useState("");
  useEffect(() => { if (open) { setName(""); setDesc(""); } }, [open, category]);
  if (!open || !def) return null;

  const commit = () => {
    const rec = { ...makeRecord(category, name), description: desc.trim() };
    const taskId = xpTaskFor(category);
    const fresh = XP_TASKS.some(t => t.id === taskId) && !(state.profile.xpClaimed || []).includes(taskId);
    dispatch({ type: "REC_ADD", category, record: rec });
    dispatch({ type: "TOAST", toast: fresh ? `${def.singular} added · +${XP_VALUES.task} XP` : `${def.singular} added` });
    onAdded && onAdded(rec);
    onClose();
  };

  return (
    <Sheet open onClose={onClose} title={`Add ${def.singular.toLowerCase()}`}>
      {category === "professions" && (
        <ProfessionPicker title="Suggested professions" selected={[name, ...recsOf(state.profile, "professions").map(r => r.name)]}
          onPick={(n) => setName(n)} />
      )}
      <Field label={category === "professions" ? "Profession" : def.singular}>
        <input className="ff-input" value={name} onChange={(e) => setName(e.target.value)} placeholder={def.placeholder || def.singular} autoFocus={category !== "professions"} />
      </Field>
      {catHas(def, "description") && (
        <Field label="Description" hint="Optional now — you can open the card later and write properly.">
          <textarea className="ff-input" rows={3} value={desc} onChange={(e) => setDesc(e.target.value)} />
        </Field>
      )}
      <Btn variant="primary wide" disabled={!name.trim()} onClick={commit}>
        <Plus size={14} /> Add to my profile
      </Btn>
    </Sheet>
  );
}

/* Proves the category model is open-ended: a new category can be defined at
   runtime and behaves like every built-in one. */
function AddCategorySheet({ open, onClose }) {
  const { dispatch } = useStore();
  const [label, setLabel] = useState("");
  const [needsDoc, setNeedsDoc] = useState(false);
  if (!open) return null;
  const key = label.trim().toLowerCase().replace(/[^a-z0-9]+/g, "_");
  const singular = label.trim().replace(/s$/i, "") || "Item";

  return (
    <Sheet open onClose={onClose} title="Add a category">
      <p className="ff-body" style={{ marginTop: 0 }}>
        Professions, skills, interests, locations, languages, qualifications and experience are the built-in
        categories. They are not the only ones possible — a new category gets the same Information Cards.
      </p>
      <Field label="Category name" hint="For example: Awards, References, Equipment, Certifications.">
        <input className="ff-input" value={label} onChange={(e) => setLabel(e.target.value)} placeholder="Awards" />
      </Field>
      <label style={{ display: "flex", gap: 9, alignItems: "center", marginBottom: 16 }}>
        <input type="checkbox" checked={needsDoc} onChange={(e) => setNeedsDoc(e.target.checked)} />
        <span className="ff-body">Items in this category can carry a document</span>
      </label>
      <Btn variant="primary wide" disabled={!label.trim()}
        onClick={() => {
          dispatch({
            type: "CATEGORY_ADD", key,
            def: {
              label: label.trim(), singular, icon: "skills", onCard: false, custom: true,
              fields: needsDoc ? ["description", "media", "document"] : ["description", "media"],
              placeholder: singular,
            },
          });
          setLabel(""); setNeedsDoc(false); onClose();
        }}>
        Create category
      </Btn>
    </Sheet>
  );
}

/* ==========================================================================
   PROFILE PAGE — a collection of linked Information Cards.
   Every category the person has becomes a section; every record in it opens
   its own full card. This is the depth behind the Profile Card summary.
   ========================================================================== */
function ProfileSections({ person, isMe }) {
  const { state, dispatch } = useStore();
  const all = useDirectory();
  const [openRec, setOpenRec] = useState(null);
  const [addingTo, setAddingTo] = useState(null);
  const [addingCat, setAddingCat] = useState(false);
  const [asking, setAsking] = useState(false);
  const shade = isMe ? (state.profile.cardShade || "slate") : "slate";

  const records = recordsForPerson(state, person);
  const cats = isMe ? allCategories(state.profile) : BASE_CATEGORIES;
  const order = (isMe ? categoryOrder(state.profile) : Object.keys(BASE_CATEGORIES)).filter(k => !cats[k].system);
  const reviewList = records.reviews || [];
  const reviewDef = cats.reviews || BASE_CATEGORIES.reviews;
  const pendingRequests = isMe
    ? state.reviewRequests.filter(r => r.aboutId === "me" && !state.reviews.some(rv => rv.aboutId === "me" && rv.byId === r.fromId))
    : [];
  const pendingCount = pendingRequests.length;

  const network = isMe
    ? (state.connections.length
      ? state.connections.map(c => all.find(p => p.id === c.id)).filter(Boolean)
      : all.filter(p => p.id !== "me").slice(0, 5))
    : all.filter(p => p.id !== person.id && p.id !== "me").slice(0, 6);

  const venues = isMe ? VENUES.slice(0, 5) : VENUES.slice(1, 5);

  const focusHandlers = {
    reviews: () => { dispatch({ type: "TOGGLE_CATEGORY", key: "reviews", visible: true }); setAsking(true); },
    questions: () => dispatch({ type: "TOGGLE_CATEGORY", key: "questions", visible: true }),
  };
  order.forEach(k => { focusHandlers[k] = () => setAddingTo(k); });
  useProfileFocus(focusHandlers, isMe);

  const renderCategorySection = (catKey) => {
    const def = cats[catKey];
    if (!def) return null;
    const list = (records[catKey] || []);
    if (!isMe && !list.length) return null;
    const live = list.filter(r => !r.proposed);
    const shownN = def.cardLimit || 3;
    const unresolved = isMe && catKey === "professions" ? live.find(r => !professionCategory(r.name, r.displayCategory)) : null;
    return (
      <section key={catKey} id={isMe ? `ff-sec-${catKey}` : undefined} style={{ marginTop: 22 }}>
        <SectionHead
          icon={<CatIcon kind={def.icon} size={15} color="var(--gold-dk)" />}
          title={def.label} count={list.length}
          action={isMe && !def.system ? <button className="ff-btn sm ghost" onClick={() => setAddingTo(catKey)}>Add</button> : null} />
        {isMe && list.length > 0 && (
          <p className="ff-body ff-muted" style={{ fontSize: 11.5, margin: "-4px 0 8px" }}>
            {def.onCard
              ? `Your first ${shownN} show on your card — use the arrows to reorder. ${live.length} on your profile.`
              : "Your first three are highlighted on your profile — use the arrows to reorder."}
          </p>
        )}
        {unresolved && (
          <div className="ff-frame" style={{ padding: 12, marginBottom: 10 }}>
            <div style={{ display: "flex", gap: 9, alignItems: "center", marginBottom: 8 }}>
              <Coin size={22} tier="gold" />
              <span className="ff-body" style={{ fontSize: 13 }}><b>FF AI:</b> which category is “{unresolved.name}”? It decides where you appear on Network.</span>
            </div>
            <div>
              {PROFESSION_CATEGORIES.map(c => (
                <button key={c.key} className="ff-chip" onClick={() => {
                  dispatch({ type: "REC_PATCH", category: "professions", id: unresolved.id, patch: { displayCategory: c.key } });
                  dispatch({ type: "TOAST", toast: `${unresolved.name} → ${c.key}` });
                }}>{c.key}</button>
              ))}
            </div>
          </div>
        )}
        {list.length ? (
          <HScroll label={def.label}>
            {list.map((r, i) => {
              const pos = live.indexOf(r);
              return (
                <div key={r.id} style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                  <InformationCard record={r} def={def} themeKey={r.proposed ? "paper" : shade}
                    highlight={pos > -1 && pos < 3}
                    onClick={() => setOpenRec({ record: r, def, category: catKey })} />
                  {isMe && !def.system && list.length > 1 && (
                    <div style={{ display: "flex", justifyContent: "center", alignItems: "center", gap: 8 }}>
                      <button className="ff-btn sm ghost" style={{ padding: "6px 10px" }} disabled={i === 0} aria-label={`Move ${r.name} earlier`}
                        onClick={() => dispatch({ type: "REC_MOVE", category: catKey, id: r.id, dir: -1 })}><ChevronLeft size={13} /></button>
                      <span className="ff-label" style={{ fontSize: 9, minWidth: 16, textAlign: "center" }}>{i + 1}</span>
                      <button className="ff-btn sm ghost" style={{ padding: "6px 10px" }} disabled={i === list.length - 1} aria-label={`Move ${r.name} later`}
                        onClick={() => dispatch({ type: "REC_MOVE", category: catKey, id: r.id, dir: 1 })}><ChevronRight size={13} /></button>
                    </div>
                  )}
                </div>
              );
            })}
            {isMe && !def.system && (
              <button className="ff-card ff-portrait ff-addtile" style={{ width: CARD_W.info }} onClick={() => setAddingTo(catKey)}>
                <span style={{ textAlign: "center" }}><Plus size={20} color="var(--gold-dk)" />
                  <span className="ff-label" style={{ display: "block", marginTop: 6 }}>Add {def.singular.toLowerCase()}</span></span>
              </button>
            )}
          </HScroll>
        ) : (
          <button className="ff-card ff-addtile" style={{ width: "100%", padding: 18 }} onClick={() => setAddingTo(catKey)}>
            <span style={{ textAlign: "center" }}><Plus size={18} color="var(--gold-dk)" />
              <span className="ff-label" style={{ display: "block", marginTop: 6 }}>Add your first {def.singular.toLowerCase()}</span></span>
          </button>
        )}
      </section>
    );
  };

  return (
    <>
      {isMe && (
        <section id="ff-sec-questions" style={{ marginTop: 4 }}>
          <SectionHead icon={<Award size={15} color="var(--gold-dk)" strokeWidth={1.6} />} title="Questions"
            action={
              <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <span className="ff-label" style={{ fontSize: 9 }}>Question Cards</span>
                <CategoryToggle sectionKey="questions" />
              </span>
            } />
          {state.categoryVisibility.questions !== false && <QuestionCardsCollection />}
        </section>
      )}

      {order.map(renderCategorySection)}

      <section style={{ marginTop: 26 }}>
        <SectionHead icon={<Users size={15} color="var(--gold-dk)" strokeWidth={1.6} />} title="Network" count={network.length}
          action={
            <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
              {isMe && <button className="ff-btn sm ghost" onClick={() => dispatch({ type: "TAB", tab: "network" })}>All</button>}
              <CategoryToggle sectionKey="profile_network" />
            </span>
          } />
        {state.categoryVisibility.profile_network !== false && (
        <HScroll label="Network" snap>
          {network.map(p => <PlayerTile key={p.id} person={p} onClick={() => dispatch({ type: "VIEW", id: p.id })} />)}
          {isMe && (
            <button className="ff-card ff-portrait ff-addtile" style={{ width: CARD_W.player }} onClick={() => dispatch({ type: "TAB", tab: "network" })}>
              <span style={{ textAlign: "center" }}><Plus size={20} color="var(--gold-dk)" />
                <span className="ff-label" style={{ display: "block", marginTop: 6 }}>Add people</span></span>
            </button>
          )}
        </HScroll>
        )}
      </section>

      <MediaSection isMe={isMe} media={isMe ? (state.profile.media || []) : []} />

      <section id={isMe ? "ff-sec-reviews" : undefined} style={{ marginTop: 22 }}>
        <SectionHead icon={<CatIcon kind="reviews" size={15} color="var(--gold-dk)" />} title="Reviews & References" count={reviewList.length}
          action={
            <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
              {isMe && <button className="ff-btn sm ghost" onClick={() => setAsking(true)}>Ask</button>}
              <CategoryToggle sectionKey="reviews" />
            </span>
          } />
        {(state.categoryVisibility.reviews === false) ? null : (reviewList.length || (isMe && pendingCount > 0)) ? (
          <HScroll label="Reviews & References">
            {reviewList.map((r, i) => (
              <InformationCard key={r.id} record={r} def={reviewDef} themeKey={shade} highlight={i < 3}
                onClick={() => setOpenRec({ record: r, def: reviewDef, category: "reviews" })} />
            ))}
            {isMe && pendingRequests.map(req => (
              <div key={req.id} className="ff-tile" style={{ width: CARD_W.info, minHeight: 140, justifyContent: "center", alignItems: "center", textAlign: "center", gap: 6 }}>
                <Clock size={18} color="var(--gold-dk)" strokeWidth={1.5} />
                <span className="ff-serif" style={{ fontSize: 13, fontStyle: "italic" }}>Waiting on {req.fromName}</span>
              </div>
            ))}
            {isMe && (
              <button className="ff-card ff-addtile" style={{ width: CARD_W.info, minHeight: 140 }} onClick={() => setAsking(true)}>
                <span style={{ textAlign: "center" }}><Plus size={20} color="var(--gold-dk)" />
                  <span className="ff-label" style={{ display: "block", marginTop: 6 }}>Ask for a review</span></span>
              </button>
            )}
          </HScroll>
        ) : isMe ? (
          <button className="ff-card ff-addtile" style={{ width: "100%", padding: 18 }} onClick={() => setAsking(true)}>
            <span style={{ textAlign: "center" }}><Plus size={18} color="var(--gold-dk)" />
              <span className="ff-label" style={{ display: "block", marginTop: 6 }}>Ask someone you've worked with for a review</span></span>
          </button>
        ) : (
          <p className="ff-body ff-muted" style={{ margin: 0 }}>No reviews yet.</p>
        )}
      </section>

      <section style={{ marginTop: 22 }}>
        <SectionHead icon={<MapPin size={15} color="var(--gold-dk)" strokeWidth={1.6} />} title="Venues" count={venues.length}
          action={<CategoryToggle sectionKey="profile_venues" />} />
        {state.categoryVisibility.profile_venues !== false && (
        <HScroll label="Venues">
          {venues.map(v => <VenueCard key={v.id} venue={v} onClick={() => dispatch({ type: "TOAST", toast: `${v.name} — ${v.kind}, ${v.area}` })} />)}
        </HScroll>
        )}
      </section>

      {isMe && (
        <div style={{ marginTop: 18 }}>
          <Btn variant="ghost wide" onClick={() => setAddingCat(true)}><Plus size={13} /> Add another category</Btn>
          <p className="ff-body ff-muted" style={{ fontSize: 11.5, textAlign: "center", marginTop: 8 }}>
            The six built-in categories are a starting point, not the limit.
          </p>
        </div>
      )}

      <InfoCardSheet open={!!openRec} record={openRec?.record} def={openRec?.def} category={openRec?.category}
        readOnly={!isMe || !!openRec?.record?.readOnly} onClose={() => setOpenRec(null)} />
      <AddRecordSheet open={!!addingTo} category={addingTo} def={addingTo ? cats[addingTo] : null}
        onClose={() => setAddingTo(null)} />
      <AddCategorySheet open={addingCat} onClose={() => setAddingCat(false)} />
      <AskForReviewSheet open={asking} onClose={() => setAsking(false)} />
    </>
  );
}

  const connected = state.connections.some(c => c.id === state.viewing);

        onReview: () => setReviewing(true),
        onJoin: () => dispatch({ type: "TOAST", toast: "Share this card so they can join FireFlair" }),
      }} />
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 16 }}>
        <Btn variant={connected ? "ghost" : "primary"} disabled={connected}
          onClick={() => dispatch({ type: "CONNECT", people: [{ id: person.id, name: person.name, note: person.profession, onFF: true, tag: person.tag }] })}>
          {connected ? <><Check size={14} /> Added</> : <><Plus size={14} /> Add to team</>}
        </Btn>
        <Btn onClick={() => setReviewing(true)}><Award size={14} /> Review</Btn>
      </div>
      {person.id !== "me" && (
        <div style={{ marginTop: 8 }}>
          <Btn variant={state.selection.includes(person.id) ? "ghost wide" : "wide"} onClick={() => {
            dispatch({ type: "SELECT", id: person.id });
            dispatch({ type: "TOAST", toast: state.selection.includes(person.id) ? `${person.name} removed from your basket` : `${person.name} added to your basket` });
          }}>
            {state.selection.includes(person.id) ? <><Check size={14} /> In your basket</> : <><Users size={14} /> Add to basket</>}
          </Btn>
        </div>
      )}
      <ProfileSections person={person} isMe={person.id === "me"} />
      <ReviewSheet open={reviewing} person={person} onClose={() => setReviewing(false)} />
    </div>
  );
}

/* Consume a FF-sheet focus request: scroll to #ff-sec-<target> and run the
   matching handler (e.g. open the Add sheet). One consumer is mounted at a
   time — whichever Profile screen is showing. */
function useProfileFocus(handlers, enabled = true) {
  const { state, dispatch } = useStore();
  useEffect(() => {
    const f = state.focus;
    if (!enabled || !f) return;
    const el = document.getElementById(`ff-sec-${f.target}`);
    setTimeout(() => {
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      else window.scrollTo({ top: 0, behavior: "smooth" });
    }, 60);
    const h = handlers[f.target] || handlers._any;
    if (h) h(f.target);
    dispatch({ type: "FOCUS", focus: null });
  }, [state.focus, enabled]);
}

/* Write the card editor's draft into the real profile records — the one
   profile, never a copy. Names are matched to existing records so their
   descriptions, media and documents are kept. */
function syncCardRecords(state, dispatch, d, cats = ["professions", "skills", "interests", "locations", "languages"]) {
  cats.forEach(cat => {
    const existing = recsOf(state.profile, cat);
    const limit = BASE_CATEGORIES[cat].cardLimit || 3;
    const kept = [];
    (d[cat] || []).filter(Boolean).forEach((v, i) => {
      const match = existing.find(r => r.name.toLowerCase() === v.toLowerCase());
      kept.push(match ? { ...match, name: v } : { ...makeRecord(cat, v), primary: i < limit });
    });
    existing.filter(r => r.proposed && !kept.some(k => k.id === r.id)).forEach(r => kept.push(r));
    if (!kept.some(r => r.primary && !r.proposed)) kept.slice(0, limit).forEach(r => { if (!r.proposed) r.primary = true; });
    dispatch({ type: "REC_BULK", category: cat, list: kept });
  });
}

/* PROFILE TAB — card building. The same EditablePlayerCard as everywhere
   else, saving into the real profile as you type. */
function ManualBuild() {
  const { state, dispatch } = useStore();
  const [d, setD] = useState(() => draftFromProfile(state));
  const ready = d.name.trim() && d.professions.length > 0;
  useProfileFocus({});

  /* Save as you go (debounced), and flush anything pending on leaving. */
  const latest = useRef(null);
  latest.current = { d, state };
  const pending = useRef(false);
  const first = useRef(true);
  const flush = () => {
    const { d: dd, state: st } = latest.current;
    pending.current = false;
    syncCardRecords(st, dispatch, dd);
    dispatch({ type: "PROFILE", patch: { name: dd.name, photo: dd.photo } });
    /* A card with a name and a profession is a created card — claim once. */
    if (dd.name.trim() && dd.professions.length && !(st.profile.xpClaimed || []).includes("create_card")) {
      dispatch({ type: "CARD_CREATED_XP" });
      dispatch({ type: "TOAST", toast: `Card created · +${XP_VALUES.task} XP` });
    }
  };
  useEffect(() => {
    if (first.current) { first.current = false; return; }
    pending.current = true;
    const t = setTimeout(flush, 450);
    return () => clearTimeout(t);
  }, [d]);
  useEffect(() => () => { if (pending.current) flush(); }, []);

  const commit = () => {
    flush();
    dispatch({ type: "GO", route: "review" });
    window.scrollTo(0, 0);
  };

  return (
    <div>
      <Steps n={1} of={4} />
      <div className="ff-eyebrow">FF Team · Profile</div>
      <h1 className="ff-h1" style={{ marginTop: 4 }}>{state.profile.live ? "Edit your card" : "Build your card"}</h1>
      <p className="ff-body" style={{ marginTop: 8, marginBottom: 18 }}>
        Type straight onto it — everything is saved to your profile as you go. Add as many professions as you have: your card shows three, your profile keeps them all.
      </p>

      <EditablePlayerCard draft={d} setDraft={setD} themeKey={state.profile.theme}
        tag={state.session.tag || "-----"} tier={state.profile.tier} level={state.profile.level}
        onPhoto={(url) => setD((x) => ({ ...x, photo: url }))} />

      <div style={{ display: "flex", gap: 10, justifyContent: "center", flexWrap: "wrap", margin: "18px 0" }}>
        {Object.entries(THEMES).map(([k, th]) => (
          <button key={k} onClick={() => dispatch({ type: "PROFILE", patch: { theme: k } })} aria-label={th.name}
            style={{ width: 32, height: 32, borderRadius: "50%", background: th.swatch, border: state.profile.theme === k ? "2px solid var(--gold)" : "1px solid var(--rule)" }} />
        ))}
      </div>

      <Btn variant="primary wide" disabled={!ready} onClick={commit}>
        Next: review and publish <ChevronRight size={15} />
      </Btn>
      {!ready && <p className="ff-body ff-muted" style={{ fontSize: 12, textAlign: "center", marginTop: 8 }}>Add your name and at least one profession to continue.</p>}
      <div style={{ height: 10 }} />
      <Btn variant="ghost wide" onClick={() => dispatch({ type: "GO", route: "build" })}><FileText size={14} /> Have a CV? Build from it instead</Btn>
    </div>
  );
}

function GroupedPeople({ onPick, selectable, scope = "", query = "" }) {

/* BOOKINGS (FF Team) — one page, three sections: booked shifts, FF Party
   service cards (coming soon), availability cards. Replies happen here. */
function TeamBookings({ guest = false }) {
  const { state, dispatch } = useStore();
  const [open, setOpen] = useState(null);
  const [q, setQ] = useState("");
  const BOOKED = ["confirmed", "completed", "signed_off", "paid"];
  const all = guest ? [] : state.engagements.filter(e => e.staffId === "me")
    .map(e => { const shift = state.shifts.find(s2 => s2.id === e.shiftId); return { e, shift, event: shift && state.events.find(v => v.id === shift.eventId) }; })
    .filter(x => x.shift).map(x => ({ ...x, iso: x.shift.iso }));
  const n = q.trim().toLowerCase();
  const match = (x) => !n || [x.shift.role, x.shift.venue, x.shift.date, x.event?.title].join(" ").toLowerCase().includes(n);
  const booked = all.filter(x => BOOKED.includes(x.e.state) && match(x));
  const requests = all.filter(x => x.e.state === "requested" && match(x)).sort((a, b) => String(a.iso).localeCompare(String(b.iso)));
  const answered = all.filter(x => ["available", "unavailable", "expired"].includes(x.e.state) && match(x));
  const jump = (id) => { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); };

function draftFromProfile(state) {
  const names = (cat) => recsOf(state.profile, cat).filter(r => !r.proposed).map(r => r.name);
  return {
    name: state.profile.name, professions: names("professions"), photo: state.profile.photo,
    skills: names("skills"), interests: names("interests"),
    locations: names("locations"), languages: names("languages"),
  };
}

function TeamProfile() {
  const { state, dispatch } = useStore();
  const [editing, setEditing] = useState(false);
  const [d, setD] = useState(() => draftFromProfile(state));

  if (!state.profile.live) return <Empty icon={<User size={26} />} title="Finish creating your profile and your card appears here."
    action={<Btn variant="primary" onClick={() => dispatch({ type: "TAB", tab: "home" })}>Continue setting up</Btn>} />;

  const me = meAsStaff(state.profile, state.session);
  const startEdit = () => { setD(draftFromProfile(state)); setEditing(true); };

  /* Editing the card edits NAMES only. Descriptions, media and documents
     live on the records and are never clobbered by a card edit: existing
     records are matched by name and kept whole. */
  const save = () => {
    const sync = (cat, values) => {
      const existing = recsOf(state.profile, cat);
      const limit = BASE_CATEGORIES[cat].cardLimit || 3;
      const kept = [];
      (values || []).filter(Boolean).forEach((v, i) => {
        const match = existing.find(r => r.name.toLowerCase() === v.toLowerCase());
        kept.push(match ? { ...match, name: v } : { ...makeRecord(cat, v), primary: i < limit });
      });
      existing.filter(r => r.proposed && !kept.some(k => k.id === r.id)).forEach(r => kept.push(r));
      if (!kept.some(r => r.primary && !r.proposed)) {
        kept.slice(0, limit).forEach(r => { if (!r.proposed) r.primary = true; });
      }
      dispatch({ type: "REC_BULK", category: cat, list: kept });
    };
    sync("professions", d.professions);
    sync("skills", d.skills);
    sync("interests", d.interests);
    sync("locations", d.locations);
    sync("languages", d.languages);
    dispatch({ type: "PROFILE", patch: { name: d.name.trim() || state.profile.name, photo: d.photo } });
    setEditing(false);
    dispatch({ type: "TOAST", toast: "Card updated" });
  };

  return (
    <div>
      <div className="ff-eyebrow">FF Team · Profile</div>
      <h1 className="ff-h1" style={{ marginTop: 4 }}>{editing ? "Edit your Profile Card" : "Your Profile Card"}</h1>

      <AIProfileCompletion />

      <div id="ff-sec-card" />
      {editing ? (
        <>
          <EditablePlayerCard draft={d} setDraft={setD} themeKey={state.profile.theme}
            tag={state.session.tag} tier={state.profile.tier} level={state.profile.level}
            onPhoto={(url) => setD(x => ({ ...x, photo: url }))} />
          <p className="ff-body ff-muted" style={{ fontSize: 11.5, textAlign: "center", marginTop: 10 }}>
            Descriptions, images and documents stay on the full cards below — editing here only changes the names.
          </p>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 14 }}>
            <Btn variant="primary" onClick={save}><Check size={14} /> Save card</Btn>
            <Btn variant="ghost" onClick={() => setEditing(false)}>Cancel</Btn>
          </div>
        </>
      ) : (
        <>
          <PlayerCard person={me} format="full" themeKey={state.profile.theme} actions={{
            onBook: () => dispatch({ type: "TOAST", toast: "This is what people booking you will see" }),
            onReview: () => dispatch({ type: "TOAST", toast: "This is what people reviewing you will see" }),
            onJoin: () => dispatch({ type: "TOAST", toast: "This is what people joining from your card will see" }),
          }} />
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 16 }}>
            <Btn variant="primary" onClick={startEdit}><Pencil size={13} /> Edit card</Btn>
            <Btn onClick={() => dispatch({ type: "TOAST", toast: "Link copied" })}><Share2 size={13} /> Share</Btn>
          </div>
          <div style={{ marginTop: 10, display: "flex", justifyContent: "center" }}>
            <WalletButton kind="profile" dark={false} payload={{ tag: state.session.tag, name: state.profile.name }} />
          </div>
        </>
      )}

      <CVPanel />

      <ProfileSections person={me} isMe />

      <div className="ff-frame" style={{ padding: 12, marginTop: 22, display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
        <Pill tone="gold"><Hash size={11} /> {state.session.tag}</Pill>
        <Pill tone="ok"><ShieldCheck size={11} /> Verified</Pill>
        <Pill>Level {state.profile.level}</Pill>
        <Pill>{TIERS[state.profile.tier].name} tier</Pill>
      </div>
    </div>
  );
}

/* Helpers shared by the FF Staff screens. */
/* Find a person on a Shift Card. "me" is the signed-in professional, who
   isn't in the directory until their FF Team profile is live. */
const findPerson = (all, state, id) => all.find(p => p.id === id) || (id === "me" ? meAsStaff(state.profile, state.session) : undefined);
const latestEng = (state, shiftId) => {
  const list = state.engagements.filter(e => e.shiftId === shiftId);
  return list[list.length - 1] || null;
};
const reservedCredits = (state) => state.engagements.filter(e => e.credit && e.state === "requested").length;
const freeCredits = (state) => Math.max(0, (state.credits?.balance || 0) - reservedCredits(state));
/* A shift can be sent when someone is assigned and they haven't already been
   asked (or the last person asked declined/expired and has been replaced). */
function canSend(state, shift) {
  if (!shift.staffId) return false;
  const e = latestEng(state, shift.id);
  if (!e) return true;
  return ["unavailable", "expired"].includes(e.state) && e.staffId !== shift.staffId;
}
const splitTime = (t) => { const [a = "", b = ""] = String(t || "").split(/\s*[—–-]\s*/); return [a.trim(), b.trim()]; };

/* ---------------------------------------------------------------------------
   SHIFT SHEET — create or edit one Shift Card for one person.
   --------------------------------------------------------------------------- */
function ShiftSheet({ open, shift, event, onClose, onSaved }) {
  const { state, dispatch } = useStore();
  const all = useDirectory();
  const blank = { role: "", start: "", finish: "", skills: "", pay: "", dress: "", notes: "", staffId: "" };
  const [f, setF] = useState(blank);
  useEffect(() => {
    if (!open) return;
    if (shift) {
      const [a, b] = splitTime(shift.time);
      setF({ role: shift.role || "", start: a, finish: b, skills: (shift.skills || []).join(", "), pay: shift.pay || "", dress: shift.dress || "", notes: shift.notes || "", staffId: shift.staffId || "" });
    } else setF(blank);
  }, [open, shift && shift.id]);
  if (!open) return null;
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const sent = shift && latestEng(state, shift.id) && !canSend(state, shift) && latestEng(state, shift.id).staffId === shift.staffId;
  const candidates = [...new Set([...(f.staffId ? [f.staffId] : []), ...state.selection])].map(id => all.find(p => p.id === id)).filter(Boolean);

  const save = () => {
    const data = {
      role: f.role.trim(), time: [f.start, f.finish].filter(Boolean).join(" — "),
      skills: f.skills.split(",").map(x => x.trim()).filter(Boolean),
      pay: f.pay.trim(), dress: f.dress.trim(), notes: f.notes.trim(), staffId: f.staffId,
      date: event?.date || "", iso: event?.iso || "", venue: event?.venue || "",
    };
    if (shift && state.shifts.some(x => x.id === shift.id)) dispatch({ type: "SHIFT_PATCH", id: shift.id, patch: data });
    else dispatch({ type: "SHIFT_ADD", shift: { id: shift?.id || uid("shf"), eventId: event.id, ...data } });
    onSaved && onSaved();
    onClose();
  };

  return (
    <Sheet open onClose={onClose} title={shift && state.shifts.some(x => x.id === shift.id) ? "Edit Shift Card" : "New Shift Card"}>
      <p className="ff-body ff-muted" style={{ marginTop: 0, fontSize: 12.5 }}>
        One Shift Card is for one person. Date and venue come from the Event Card.
      </p>
      <Field label="Person" hint={candidates.length ? "From your basket." : "Add people to your basket to assign them here."}>
        <select className="ff-input" value={f.staffId} onChange={set("staffId")} disabled={sent}>
          <option value="">Not assigned yet</option>
          {candidates.map(p => <option key={p.id} value={p.id}>{p.name} — {p.profession}</option>)}
        </select>
      </Field>
      <Field label="Profession / role"><input className="ff-input" value={f.role} onChange={set("role")} placeholder="Cocktail bartender" /></Field>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        <Field label="Start"><input className="ff-input" value={f.start} onChange={set("start")} placeholder="19:00" /></Field>
        <Field label="Finish"><input className="ff-input" value={f.finish} onChange={set("finish")} placeholder="23:00" /></Field>
      </div>
      <Field label="Requirements" hint="Separate with commas."><input className="ff-input" value={f.skills} onChange={set("skills")} placeholder="Cocktail mixology, flair" /></Field>
      <Field label="Pay rate" hint="Set by you and paid by you directly. FireFlair never sets or handles anyone's pay.">
        <input className="ff-input" value={f.pay} onChange={set("pay")} placeholder="Your rate for this shift" />
      </Field>
      <Field label="Dress code"><input className="ff-input" value={f.dress} onChange={set("dress")} placeholder="Smart black" /></Field>
      <Field label="Notes for this person"><textarea className="ff-input" rows={2} value={f.notes} onChange={set("notes")} /></Field>
      <Btn variant="primary wide" disabled={!f.role.trim()} onClick={save}><Check size={14} /> Save Shift Card</Btn>
    </Sheet>
  );
}

/* ---------------------------------------------------------------------------
   PICK PERSON — fill or replace the person on a Shift Card. The basket comes
   first; suggestions follow. The hirer always chooses.
   --------------------------------------------------------------------------- */
function PickPersonSheet({ open, shift, event, onClose }) {
  const { state, dispatch } = useStore();
  const all = useDirectory();
  if (!open || !shift) return null;
  const taken = state.shifts.filter(x => x.eventId === event.id && x.id !== shift.id).map(x => x.staffId);
  const asked = state.engagements.filter(e => e.shiftId === shift.id).map(e => e.staffId);
  const basket = state.selection.map(id => all.find(p => p.id === id)).filter(p => p && !taken.includes(p.id));
  const role = (shift.role || "").toLowerCase();
  const suggestions = all.filter(p => !taken.includes(p.id) && !asked.includes(p.id) && !state.selection.includes(p.id))
    .filter(p => role && (p.profession.toLowerCase().includes(role.split(" ").pop()) || role.includes(p.profession.toLowerCase().split(" ").pop())))
    .sort((a, b) => (b.rating || 0) - (a.rating || 0)).slice(0, 6);
  const pick = (p) => {
    dispatch({ type: "SHIFT_PATCH", id: shift.id, patch: { staffId: p.id } });
    dispatch({ type: "TOAST", toast: `${p.name.split(" ")[0]} assigned to this Shift Card` });
    onClose();
  };
  const Row = ({ p, tag }) => (
    <button className="ff-info" onClick={() => pick(p)} style={{ width: "100%", display: "flex", gap: 11, alignItems: "center", textAlign: "left" }}>
      <Portrait src={p.photo} name={p.name} size={38} tier={p.tier} />
      <span style={{ flex: 1, minWidth: 0 }}>
        <span className="ff-display" style={{ fontSize: 13, display: "block" }}>{p.name}</span>
        <span className="ff-body ff-muted" style={{ fontSize: 12 }}>{p.profession}{p.rating ? ` · ${p.rating}★` : ""}</span>
      </span>
      {tag && <Pill tone="gold">{tag}</Pill>}
    </button>
  );

  return (
    <Sheet open onClose={onClose} title={`Who for ${shift.role || "this shift"}?`}>
      <div className="ff-label" style={{ marginBottom: 8 }}>Your basket</div>
      {basket.length ? basket.map(p => <Row key={p.id} p={p} tag="Basket" />)
        : <p className="ff-body ff-muted" style={{ marginTop: 0, fontSize: 12.5 }}>Your basket is empty. Add people from any profile or the FF Staff home page.</p>}
      <div className="ff-label" style={{ margin: "16px 0 8px" }}>Suggestions</div>
      {suggestions.length ? suggestions.map(p => <Row key={p.id} p={p} tag="Suggested" />)
        : <p className="ff-body ff-muted" style={{ marginTop: 0, fontSize: 12.5 }}>No close matches for this role yet.</p>}
      <p className="ff-body ff-muted" style={{ fontSize: 11.5, marginBottom: 0 }}>Suggestions only. Nobody is assigned until you choose them.</p>
    </Sheet>
  );
}

/* ---------------------------------------------------------------------------
   INVOICE — confirmed Shift Cards for one event, one professional document.
   --------------------------------------------------------------------------- */
function InvoiceCard({ event, rows, company }) {
  const { dispatch } = useStore();
  const text = `FireFlair booking — ${event.title}, ${event.date || "date TBC"}, ${event.venue || ""}. Confirmed: ${rows.map(r => `${r.person?.name || "Staff"} (${r.shift.role}, ${r.shift.time || "times TBC"})`).join("; ")}.`;
  return (
    <div className="ff-invoice">
      <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "14px 14px 10px" }}>
        <Coin size={30} tier="gold" />
        <span style={{ flex: 1, minWidth: 0 }}>
          <span className="ff-label" style={{ display: "block" }}>FireFlair invoice</span>
          <span className="ff-display" style={{ fontSize: 15 }}>{event.title}</span>
        </span>
        <Receipt size={18} color="var(--gold-dk)" strokeWidth={1.5} />
      </div>
      <div style={{ padding: "0 14px" }}>
        <div className="ff-body ff-muted" style={{ fontSize: 12 }}>
          {event.date || "Date to confirm"} · {event.venue || "Venue to confirm"}{company?.name ? ` · Booked by ${company.name}` : ""}
        </div>
        <table className="ff-invtable">
          <thead><tr><th>Professional</th><th>Shift</th><th>Pay rate</th><th>FireFlair</th></tr></thead>
          <tbody>
            {rows.map(r => (
              <tr key={r.shift.id}>
                <td>{r.person?.name || "Staff"}</td>
                <td>{r.shift.role}<br /><span className="ff-muted">{r.shift.time || "Times TBC"}</span></td>
                <td>{r.shift.pay || "As agreed"}</td>
                <td>1 credit</td>
              </tr>
            ))}
          </tbody>
        </table>
        <p className="ff-body ff-muted" style={{ fontSize: 11.5, margin: "8px 0 12px" }}>
          {rows.length} confirmed Shift Card{rows.length === 1 ? "" : "s"} · {rows.length} FireFlair credit{rows.length === 1 ? "" : "s"} used ({CREDIT_FEE} connection fee each).
          Pay rates are paid by the hirer directly to each professional — FireFlair does not hold or move that money.
        </p>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, padding: "0 14px 14px" }}>
        <Btn variant="sm" onClick={async () => {
          try { await navigator.clipboard.writeText(text); dispatch({ type: "TOAST", toast: "Invoice copied" }); }
          catch (e) { dispatch({ type: "TOAST", toast: "Couldn't copy here — use Share on WhatsApp" }); }
        }}><Copy size={13} /> Copy invoice</Btn>
        <a className="ff-btn sm" href={`https://wa.me/?text=${encodeURIComponent(text)}`} target="_blank" rel="noopener noreferrer"><MessageCircle size={13} /> Share on WhatsApp</a>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------------
   EVENT CARD PAGE — the control page for a booking. One vertical, guided
   journey: event → team and Shift Cards → questions and T&Cs → credits and
   send → responses → invoice → reviews.
   --------------------------------------------------------------------------- */
function EventPage() {
  const { state, dispatch } = useStore();
  const all = useDirectory();
  const event = state.events.find(e => e.id === state.activeEventId);
  const [editing, setEditing] = useState(null);      // shift object or {} for new
  const [picking, setPicking] = useState(null);
  const [reviewing, setReviewing] = useState(null);  // { person, shiftId }
  const [offerCompany, setOfferCompany] = useState(false);
  const [buying, setBuying] = useState(false);
  const [, tick] = useState(0);
  useEffect(() => {
    const t = setInterval(() => { dispatch({ type: "EXPIRE_DUE" }); tick(n => n + 1); }, 30000);
    dispatch({ type: "EXPIRE_DUE" });
    return () => clearInterval(t);
  }, []);

  if (!event) return <Empty icon={<Calendar size={26} />} title="No Event Card open. Create one to start a booking."
    action={<Btn variant="primary" onClick={() => dispatch({ type: "GO", route: "eventNew" })}>Create Event Card</Btn>} />;

  const person = (id) => findPerson(all, state, id);
  const shifts = state.shifts.filter(s2 => s2.eventId === event.id);
  const assigned = shifts.filter(x => x.staffId);
  const assignedIds = assigned.map(x => x.staffId);
  const unassignedBasket = state.selection.filter(id => !assignedIds.includes(id)).map(person).filter(Boolean);
  const ready = shifts.filter(x => canSend(state, x));
  const free = freeCredits(state);
  const short = Math.max(0, ready.length - free);
  const company = state.company;
  const questions = (company?.questions || []).filter(q2 => (event.questionIds || []).includes(q2.id));
  const engs = shifts.map(sh => ({ sh, e: latestEng(state, sh.id) })).filter(x => x.e);
  const confirmedRows = engs.filter(x => ["confirmed", "completed", "signed_off", "paid"].includes(x.e.state))
    .map(x => ({ shift: x.sh, person: person(x.e.staffId) }));
  const reviewable = engs.filter(x => ["completed", "signed_off", "paid"].includes(x.e.state));
  const teamTarget = Number(event.team) || 0;

  const giveShift = (p) => {
    const last = shifts[shifts.length - 1];
    const sh = {
      id: uid("shf"), eventId: event.id, staffId: p ? p.id : "",
      role: p ? p.profession : (last?.role || ""), time: last?.time || "",
      skills: last ? [...(last.skills || [])] : [], pay: last?.pay || "", dress: last?.dress || "", notes: "",
      date: event.date || "", iso: event.iso || "", venue: event.venue || "",
    };
    setEditing(sh);
  };
  const toggleQ = (id) => {
    const cur = event.questionIds || [];
    dispatch({ type: "EVENT_PATCH", id: event.id, patch: { questionIds: cur.includes(id) ? cur.filter(x => x !== id) : [...cur, id] } });
  };
  const send = () => {
    dispatch({ type: "SEND_REQUESTS", shiftIds: ready.map(x => x.id), questions: questions.map(q2 => q2.id) });
    dispatch({ type: "TOAST", toast: `${ready.length} Availability Card${ready.length === 1 ? "" : "s"} sent on WhatsApp` });
  };

  return (
    <div>
      <button className="ff-btn sm ghost" style={{ marginBottom: 14 }} onClick={() => dispatch({ type: "TAB", tab: "bookings", route: "staffHome" })}><ChevronLeft size={13} /> All bookings</button>
      <div className="ff-eyebrow">FF Staff · Event Card</div>

      {/* 1 — the event */}
      <StepHead n={1} title="The event" note="Shared by every Shift Card on this event." done />
      <EventCard event={event} right={
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
          <Pill tone="gold"><Users size={11} /> {assigned.length}{teamTarget ? ` of ${teamTarget}` : ""} assigned</Pill>
          {company && <Pill tone="gold"><Briefcase size={11} /> {company.name}</Pill>}
          <span style={{ marginLeft: "auto", fontSize: 8.5, letterSpacing: ".14em", color: "rgba(234,215,156,.75)", textTransform: "uppercase" }}>{CARD_DOMAIN}/{company?.slug || "event"}</span>
        </div>
      } />

      {/* 2 — team and Shift Cards */}
      <StepHead n={2} title="Team and Shift Cards" done={teamTarget ? assigned.length >= teamTarget : assigned.length > 0}
        note="One Shift Card per person. Duplicate a card to set up similar shifts quickly." />
      {shifts.map(sh => {
        const p = person(sh.staffId);
        const e = latestEng(state, sh.id);
        const locked = e && e.staffId === sh.staffId && !["unavailable", "expired"].includes(e.state);
        return (
          <div key={sh.id} className="ff-shiftrow">
            <div style={{ display: "flex", gap: 11, alignItems: "center" }}>
              {p ? <Portrait src={p.photo} name={p.name} size={40} tier={p.tier} />
                : <span className="ff-emptyface"><User size={18} color="var(--gold-dk)" strokeWidth={1.4} /></span>}
              <span style={{ flex: 1, minWidth: 0 }}>
                <span className="ff-display" style={{ fontSize: 13.5, display: "block" }}>{p ? p.name : "Not assigned yet"}</span>
                <span className="ff-body ff-muted" style={{ fontSize: 12 }}>{sh.role || "Role to set"} · {sh.time || "Times to set"}</span>
                <span className="ff-body" style={{ fontSize: 12, display: "block", color: "#6A6253" }}>Pay rate: {sh.pay || <i>not set</i>}</span>
              </span>
              {e && e.staffId === sh.staffId ? <Pill tone={ENG_TONE[e.state]}>{ENG_LABEL[e.state]}</Pill>
                : sh.staffId ? <Pill>Not sent</Pill> : null}
            </div>
            <div className="ff-shiftacts">
              <button onClick={() => setEditing(sh)} disabled={locked}><Pencil size={12} /> Edit</button>
              <button onClick={() => dispatch({ type: "SHIFT_DUPLICATE", id: sh.id })}><Copy size={12} /> Duplicate</button>
              <button onClick={() => setPicking(sh)} disabled={locked}><Users size={12} /> {p ? "Change" : "Assign"}</button>
              {!e && <button onClick={() => dispatch({ type: "SHIFT_DELETE", id: sh.id })}><Trash2 size={12} /> Remove</button>}
            </div>
          </div>
        );
      })}
      {unassignedBasket.length > 0 && (
        <div className="ff-frame" style={{ padding: 12, marginTop: 6 }}>
          <div className="ff-label" style={{ marginBottom: 8 }}>In your basket — give each a Shift Card</div>
          {unassignedBasket.map(p => (
            <div key={p.id} style={{ display: "flex", gap: 10, alignItems: "center", padding: "6px 0" }}>
              <Portrait src={p.photo} name={p.name} size={30} tier={p.tier} />
              <span style={{ flex: 1, minWidth: 0 }} className="ff-body">{p.name} <span className="ff-muted">· {p.profession}</span></span>
              <Btn variant="sm" onClick={() => giveShift(p)}><Plus size={12} /> Shift Card</Btn>
            </div>
          ))}
        </div>
      )}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 10 }}>
        <Btn onClick={() => giveShift(null)}><Plus size={14} /> Add Shift Card</Btn>
        <Btn variant="ghost" onClick={() => dispatch({ type: "GO", route: "staffHome" })}><Search size={14} /> Find people</Btn>
      </div>

      {/* 3 — questions, T&Cs and documents */}
      <StepHead n={3} title="Questions, T&Cs and documents" note="Sent with each Availability Card, from your Company Card." done={!!company} />
      {company ? (
        <div className="ff-frame" style={{ padding: 14 }}>
          <div className="ff-label" style={{ marginBottom: 6 }}>Hiring questions</div>
          {(company.questions || []).length ? company.questions.map(q2 => (
            <label key={q2.id} className="ff-check">
              <input type="checkbox" checked={(event.questionIds || []).includes(q2.id)} onChange={() => toggleQ(q2.id)} />
              <span><span className="ff-body" style={{ display: "block" }}>{q2.text}</span>
                <span className="ff-body ff-muted" style={{ fontSize: 11.5 }}>{q2.options.join(" · ")}</span></span>
            </label>
          )) : <p className="ff-body ff-muted" style={{ margin: 0, fontSize: 12.5 }}>No hiring questions yet.</p>}
          <hr className="ff-rule" style={{ margin: "12px 0" }} />
          <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
            <Pill tone="ok"><FileText size={11} /> T&Cs {company.tcMode === "own" ? "· your own" : "· FireFlair template"}{company.nda ? " + NDA" : ""}</Pill>
            <Pill><FileText size={11} /> {(company.documents || []).length} document{(company.documents || []).length === 1 ? "" : "s"}</Pill>
            <button className="ff-btn sm ghost" style={{ marginLeft: "auto" }} onClick={() => dispatch({ type: "GO", route: "companyEdit" })}>Edit</button>
          </div>
        </div>
      ) : (
        <div className="ff-sell dark" style={{ marginBottom: 0 }}>
          <Corners />
          <span className="ff-label">Company Card</span>
          <h3 className="ff-h2" style={{ margin: "6px 0" }}>Save your T&Cs, documents and questions once.</h3>
          <p className="ff-body" style={{ marginTop: 0 }}>Until then, the FireFlair five-section T&Cs template goes with each Availability Card.</p>
          <Btn variant="onDark" onClick={() => dispatch({ type: "GO", route: "companyEdit" })}><Briefcase size={14} /> Create Company Card</Btn>
        </div>
      )}

      {/* 4 — credits and send */}
      <StepHead n={4} title="Credits and availability" done={ready.length === 0 && engs.length > 0}
        note={`One FireFlair credit (${CREDIT_FEE}) per Shift Card sent. A credit is only used when that person confirms.`} />
      <div className="ff-frame" style={{ padding: 14 }}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 12 }}>
          {[["Ready to send", ready.length], ["Credits free", free], ["Reserved", reservedCredits(state)]].map(([l, v]) => (
            <div key={l} style={{ textAlign: "center" }}>
              <div className="ff-display" style={{ fontSize: 20 }}>{v}</div>
              <div className="ff-label" style={{ fontSize: 8.5 }}>{l}</div>
            </div>
          ))}
        </div>
        {ready.length === 0 ? (
          <p className="ff-body ff-muted" style={{ margin: 0, fontSize: 12.5, textAlign: "center" }}>
            {shifts.length ? "Every assigned Shift Card has been sent." : "Add a Shift Card and assign someone to send availability."}
          </p>
        ) : short > 0 ? (
          <Btn variant="primary wide" onClick={() => setBuying(true)}><CreditCard size={15} /> Buy {short} credit{short === 1 ? "" : "s"}</Btn>
        ) : (
          <Btn variant="primary wide" onClick={send}><Send size={15} /> Send {ready.length} Availability Card{ready.length === 1 ? "" : "s"} on WhatsApp</Btn>
        )}
        <p className="ff-body ff-muted" style={{ fontSize: 11, margin: "10px 0 0", textAlign: "center" }}>
          No reply or a decline? The credit isn't used. Unused credits are non-refundable but stay yours for future bookings.
        </p>
      </div>

      {/* 5 — responses */}
      {engs.length > 0 && <>
        <StepHead n={5} title="Responses" note={`Each person has ${RESPONSE_HOURS} hours to confirm.`}
          done={engs.every(x => !["requested", "unavailable", "expired"].includes(x.e.state))} />
        {engs.map(({ sh, e }) => {
          const p = person(e.staffId);
          const first = (p?.name || "They").split(" ")[0];
          return (
            <div key={e.id} className="ff-shiftrow">
              <div style={{ display: "flex", gap: 11, alignItems: "center" }}>
                <Portrait src={p?.photo} name={p?.name || "Staff"} size={34} tier={p?.tier} />
                <span style={{ flex: 1, minWidth: 0 }}>
                  <span className="ff-display" style={{ fontSize: 13, display: "block" }}>{p?.name || "Staff"}</span>
                  <span className="ff-body ff-muted" style={{ fontSize: 12 }}>{sh.role}{e.state === "requested" && e.expiresAt ? ` · ${timeLeft(e.expiresAt)}` : ""}</span>
                </span>
                <Pill tone={ENG_TONE[e.state]}><span className="ff-dot" /> {ENG_LABEL[e.state]}</Pill>
              </div>
              {e.state === "requested" && (
                <div className="ff-preview">
                  <span className="ff-label" style={{ fontSize: 8.5 }}>Prototype preview</span>
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                    <button onClick={() => { dispatch({ type: "ENG_STATE", id: e.id, state: "confirmed" }); dispatch({ type: "TOAST", toast: `${first} confirmed${e.credit ? " · 1 credit used" : ""}` }); }}>{first} confirms</button>
                    <button onClick={() => dispatch({ type: "ENG_STATE", id: e.id, state: "unavailable" })}>{first} declines</button>
                    <button onClick={() => dispatch({ type: "ENG_STATE", id: e.id, state: "expired" })}>No reply in {RESPONSE_HOURS}h</button>
                  </div>
                </div>
              )}
              {["unavailable", "expired"].includes(e.state) && e.staffId === sh.staffId && (
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 10 }}>
                  <Btn variant="sm" onClick={() => setPicking(sh)}><RotateCcw size={12} /> Replace</Btn>
                  <Btn variant="sm ghost" onClick={() => setPicking(sh)}><Sparkles size={12} /> Take a suggestion</Btn>
                </div>
              )}
              {["unavailable", "expired"].includes(e.state) && e.staffId !== sh.staffId && (
                <p className="ff-body ff-muted" style={{ fontSize: 12, margin: "8px 0 0" }}>Replaced by {person(sh.staffId)?.name || "someone new"} — send their Availability Card in step 4.</p>
              )}
              {e.state === "confirmed" && (
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 10 }}>
                  <WalletButton kind="booking" dark={false} payload={{ shiftId: sh.id, role: sh.role, date: event.date, venue: event.venue }} />
                  <Btn variant="sm" onClick={() => dispatch({ type: "ENG_STATE", id: e.id, state: "completed" })}><Check size={12} /> Shift worked</Btn>
                </div>
              )}
            </div>
          );
        })}
      </>}

      {/* 6 — invoice */}
      {confirmedRows.length > 0 && <>
        <StepHead n={6} title="Invoice" note="Generated from the confirmed Shift Cards." done />
        <InvoiceCard event={event} rows={confirmedRows} company={company} />
      </>}

      {/* 7 — reviews, one per Shift Card */}
      {reviewable.length > 0 && <>
        <StepHead n={7} title="Reviews" note="One review per Shift Card." done={reviewable.every(x => state.reviews.some(r => r.shiftId === x.sh.id))} />
        {reviewable.map(({ sh, e }) => {
          const p = person(e.staffId);
          const done = state.reviews.some(r => r.shiftId === sh.id);
          return (
            <div key={sh.id} className="ff-shiftrow" style={{ display: "flex", gap: 11, alignItems: "center" }}>
              <Portrait src={p?.photo} name={p?.name || "Staff"} size={34} tier={p?.tier} />
              <span style={{ flex: 1, minWidth: 0 }} className="ff-body">{p?.name || "Staff"} <span className="ff-muted">· {sh.role}</span></span>
              {done ? <Pill tone="ok"><Check size={10} /> Reviewed</Pill>
                : <Btn variant="sm" onClick={() => p && setReviewing({ person: p, shiftId: sh.id })}><Award size={12} /> Review</Btn>}
            </div>
          );
        })}
      </>}

      <ComingSoonRow ids={["auto", "gmaps", "party"]} title="Coming to Event Cards" />

      <ShiftSheet open={!!editing} shift={editing} event={event} onClose={() => setEditing(null)} onSaved={() => { if (!company) setOfferCompany(true); }} />
      <PickPersonSheet open={!!picking} shift={picking} event={event} onClose={() => setPicking(null)} />
      <ReviewSheet open={!!reviewing} person={reviewing?.person} shiftId={reviewing?.shiftId} onClose={() => setReviewing(null)} />
      <BuyCreditsSheet open={buying} need={short} onClose={() => setBuying(false)} />
      <Sheet open={offerCompany} onClose={() => setOfferCompany(false)} title="Create your Company Card?">
        <p className="ff-body" style={{ marginTop: 0 }}>
          Your Company Card keeps your business details, T&Cs, documents and hiring questions, and sends them with every Event Card — so you only set them up once.
        </p>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
          <Btn variant="primary" onClick={() => { setOfferCompany(false); dispatch({ type: "GO", route: "companyEdit" }); }}><Briefcase size={14} /> Create it</Btn>
          <Btn variant="ghost" onClick={() => setOfferCompany(false)}>Later</Btn>
        </div>
      </Sheet>
    </div>
  );
}

/* Buy FireFlair credits. HONEST STATUS: no payment provider is connected in
   this prototype — the adapter adds test credits and says so. In Core this
   runs through the payment-provider adapter; FF AI never touches it. */
const PAYMENT_ADAPTER = { available: false, provider: "Stripe · Apple Pay · American Express" };

function BuyCreditsSheet({ open, need, onClose }) {
  const { state, dispatch } = useStore();
  const [n, setN] = useState(need || 1);
  useEffect(() => { if (open) setN(Math.max(1, need || 1)); }, [open, need]);
  if (!open) return null;
  return (
    <Sheet open onClose={onClose} title="Buy FireFlair credits">
      <p className="ff-body" style={{ marginTop: 0 }}>
        One credit ({CREDIT_FEE} connection fee) per Shift Card you send for availability. It's only used when that person confirms.
      </p>
      <Field label="Credits">
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <button className="ff-btn sm ghost" onClick={() => setN(Math.max(1, n - 1))}>−</button>
          <span className="ff-display" style={{ fontSize: 26, minWidth: 40, textAlign: "center" }}>{n}</span>

/* FF AI for the Company Card. HONEST STATUS: no language model is wired up;
   a simple local reader proposes fields from free text and the location
   lookup proposes service locations. Nothing is saved until approved. */
function companyFromText(text) {
  const lines = String(text || "").split(/\n|\.\s/).map(x => x.trim()).filter(Boolean);
  const name = lines[0] ? lines[0].replace(/^(we are|we're|i run|i own)\s+/i, "").split(/,| - | — /)[0].trim() : "";
  const known = Object.keys(LOCATION_NEIGHBOURS).find(k => text.toLowerCase().includes(k));
  const email = (text.match(/[\w.+-]+@[\w-]+\.[\w.]+/) || [""])[0];
  const phone = (text.match(/(\+?\d[\d\s]{8,}\d)/) || [""])[0];
  const kindMatch = text.match(/(cocktail bar|event (?:company|agency)|catering|bar hire|mobile bar|wedding|private events)[^.,\n]*/i);
  return {
    name, kind: kindMatch ? kindMatch[0].trim().replace(/^\w/, c => c.toUpperCase()) : "",
    location: known ? known.replace(/\b\w/g, c => c.toUpperCase()) : "", email, phone: phone.trim(),
    description: lines.slice(1).join(". ").replace(email, "").replace(phone, "").replace(/\s{2,}/g, " ").replace(/^[\s.,]+|[\s.,]+$/g, ""),
  };
}

         ...VENUES.map(v => ({ ...v, kind: "venue", venue: true })), ...MAP_EVENTS.map(e => ({ ...e, kind: "event" }))]
      : people;
    const seen = {};

    return all.map(p => {

      const n = (seen[p.area] = (seen[p.area] || 0) + 1) - 1;
      const ring = RING[n % RING.length];
      return { ...p, x: Math.max(4, Math.min(96, bx + ring[0])), y: Math.max(5, Math.min(95, by + ring[1])) };

        ))}

        {pins.map(p => {
          const on = sel && sel.id === p.id && sel.kind === p.kind;
          return (
            <button key={p.kind + p.id} className="ff-pin" style={{ left: `${p.x}%`, top: `${p.y}%`, zIndex: on ? 3 : 1 }}

              {p.kind === "event" ? (

/* Homepage card creator — the same EditablePlayerCard used partway through
   onboarding, dropped onto the homepage itself. Typing here fills the same
   draft shape ManualBuild commits, so "Join FireFlair" carries the card
   straight into the real profile rather than starting over. */
function HomeCardCreator() {
  const { state, dispatch } = useStore();
  const [d, setD] = useState({
    name: "", professions: [], photo: null,
    skills: [], interests: [], locations: [], languages: [],
  });
  const started = d.name.trim() || d.professions.length > 0;

  const joinWithCard = () => {
    const byCategory = {};
    const push = (cat, values) => {
      const list = (values || []).filter(Boolean);
      if (!list.length) return;
      const limit = BASE_CATEGORIES[cat].cardLimit || 3;
      byCategory[cat] = list.map((v, i) => ({ ...makeRecord(cat, v), primary: i < limit }));
    };
    push("professions", d.professions);
    push("skills", d.skills);
    push("interests", d.interests);
    push("locations", d.locations);
    push("languages", d.languages);
    dispatch({ type: "PROFILE", patch: { name: d.name.trim(), photo: d.photo } });
    if (Object.keys(byCategory).length) dispatch({ type: "RECORDS_MERGE", byCategory });
    /* The card actually exists now — claim the one-time creation XP. Claiming
       is idempotent, so coming back through here never awards it twice. */
    dispatch({ type: "CARD_CREATED_XP" });
    dispatch({ type: "ROLE", role: "team" });
    dispatch({ type: "GO", route: "tag" });
    dispatch({ type: "TOAST", toast: `Card created · +${XP_VALUES.task} XP` });
  };

  return (
    <div style={{ marginBottom: 22 }}>
      <p className="ff-body" style={{ textAlign: "center", marginTop: 0, marginBottom: 16 }}>
        Try it now — type your own details and watch your card build itself.
      </p>
      <EditablePlayerCard draft={d} setDraft={setD} themeKey="ivory" tag="-----"
        tier="standard" level={1} onPhoto={(url) => setD(x => ({ ...x, photo: url }))} />
      <div style={{ textAlign: "center", marginTop: 16 }}>
        <Btn variant="primary" disabled={!started} onClick={joinWithCard}>
          <ChevronRight size={14} /> Create my card · +{XP_VALUES.task} XP
        </Btn>
        {!started && <p className="ff-body ff-muted" style={{ fontSize: 11.5, marginTop: 8 }}>Start typing above — your name is enough to begin.</p>}
      </div>
    </div>
  );
}
